  let refreshManifestLive = () => {};

  function startEtaWatcher() {
    stopEtaTimer();
    etaTimer = setInterval(() => { if (state.view === "guide-manifest") render(); }, 30000);
  }
  function etaDue(bus) {
    if (bus.status !== "In Route") return false;
    const since = bus.etaUpdatedAt || bus.departedAt || Date.now();
    return Date.now() - since >= ETA_INTERVAL_MS || !bus.eta;
  }
  function etaMinutesUntilDue(bus) {
    const since = bus.etaUpdatedAt || bus.departedAt || Date.now();
    const remaining = (since + ETA_INTERVAL_MS) - Date.now();
    return Math.max(0, Math.ceil(remaining / 60000));
  }
  // Separate from the ETA re-confirmation above — this tracks when the guide
  // last made a MIC ANNOUNCEMENT to passengers (ETA + traffic), independent
  // of whether they've updated the system ETA. Starts counting from departure.
  function announcementDue(bus) {
    if (bus.status !== "In Route") return false;
    const since = bus.lastAnnouncementAt || bus.departedAt || Date.now();
    return Date.now() - since >= PASSENGER_ANNOUNCEMENT_INTERVAL_MS;
  }
  function announcementMinutesUntilDue(bus) {
    const since = bus.lastAnnouncementAt || bus.departedAt || Date.now();
    const remaining = (since + PASSENGER_ANNOUNCEMENT_INTERVAL_MS) - Date.now();
    return Math.max(0, Math.ceil(remaining / 60000));
  }

  // Shared Beginning/During/Arrival tabbed card, used both on the guide's
  // Route Overview (pure preview, no live status) and their execute screen
  // (live status + the 30-min reminder). The tab matching the bus's real
  // status is marked NOW, but the guide can tap any tab to preview it
  // without that changing anything about the run itself.
  function buildPhaseTabsCard(run, opts) {
    opts = opts || {};
    const currentPhase = opts.currentPhase || null; // "before" | "during" | "arrival" | null
    const dueReminder = opts.dueReminder || null;   // { due, minutesUntilDue, onAck } — "during" phase only, execute screen only
    const phases = [
      { key: "before", tabLabel: "1. Beginning", sectionLabel: "1. Beginning of run", proc: run.procedureBefore, script: run.announceBefore },
      { key: "during", tabLabel: "2. During", sectionLabel: "2. During the run", proc: run.procedureDuring, script: run.announceDuring },
      { key: "arrival", tabLabel: "3. Arrival", sectionLabel: "3. Upon arrival", proc: run.procedureArrival, script: run.announceArrival },
    ];
    if (!phases.some(p => p.proc || p.script)) return null; // nothing set anywhere — caller can skip mounting this at all

    let selected = currentPhase || "before"; // what the guide is currently VIEWING (starts on whatever is really happening)
    const wrap = document.createElement("div");

    const tabBar = document.createElement("div");
    tabBar.style.cssText = "display:flex; gap:6px; margin-bottom:10px;";
    const contentHolder = document.createElement("div");

    function renderContent() {
      contentHolder.innerHTML = "";
      const p = phases.find(x => x.key === selected);
      const card = document.createElement("div");
      card.className = "card";
      const isReallyNow = selected === currentPhase;
      if (isReallyNow) {
        const nowTag = document.createElement("div");
        nowTag.style.cssText = "display:inline-block; font-size:10px; font-weight:700; color:#fff; background:var(--brand); padding:2px 7px; border-radius:4px; margin-bottom:10px;";
        nowTag.textContent = "NOW";
        card.appendChild(nowTag);
      }
      if (p.proc) {
        const procLabel = document.createElement("div");
        procLabel.style.cssText = "font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--text-dim); margin-bottom:4px;";
        procLabel.textContent = "Guide procedure";
        const procText = document.createElement("div");
        procText.style.cssText = "font-size:14px; color:var(--text); white-space:pre-wrap; margin-bottom:14px;";
        procText.textContent = p.proc;
        card.appendChild(procLabel); card.appendChild(procText);
      }
      if (p.script) {
        const scriptLabel = document.createElement("div");
        scriptLabel.style.cssText = "font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--brand); margin-bottom:4px;";
        scriptLabel.textContent = "Say to passengers";
        const scriptText = document.createElement("div");
        scriptText.style.cssText = "font-size:14px; color:var(--text); white-space:pre-wrap; font-style:italic;";
        scriptText.textContent = "\u201C" + p.script + "\u201D";
        card.appendChild(scriptLabel); card.appendChild(scriptText);
      }
      if (!p.proc && !p.script) {
        const empty = document.createElement("div");
        empty.style.cssText = "font-size:14px; color:var(--text-dim);";
        empty.textContent = "Nothing set for this stage.";
        card.appendChild(empty);
      }
      if (selected === "during" && dueReminder && dueReminder.due) {
        const dueBox = document.createElement("div");
        dueBox.style.cssText = "margin-top:14px; padding:10px 12px; background:var(--accent-dim); border:1px solid var(--accent); border-radius:8px;";
        const dueMsg = document.createElement("div");
        dueMsg.style.cssText = "font-size:12.5px; font-weight:700; color:var(--accent); margin-bottom:8px;";
        dueMsg.textContent = "\uD83D\uDD0A Time for a passenger update \u2014 give guests the current ETA and any traffic news.";
        dueBox.appendChild(dueMsg);
        const ackBtn = document.createElement("button");
        ackBtn.className = "btn btn-secondary"; ackBtn.style.cssText = "width:100%; font-size:13px; padding:8px;";
        ackBtn.textContent = "\u2713 Announcement made";
        ackBtn.onclick = dueReminder.onAck;
        dueBox.appendChild(ackBtn);
        card.appendChild(dueBox);
      } else if (selected === "during" && dueReminder && !dueReminder.due) {
        const subtext = document.createElement("div");
        subtext.style.cssText = "margin-top:10px; font-size:12px; color:var(--text-dim);";
        subtext.textContent = "Next passenger update due in " + dueReminder.minutesUntilDue + "m";
        card.appendChild(subtext);
      }
      contentHolder.appendChild(card);
    }

    function renderTabs() {
      tabBar.innerHTML = "";
      phases.forEach(p => {
        const tab = document.createElement("button");
        const isSel = p.key === selected;
        const isReallyNow = p.key === currentPhase;
        tab.style.cssText = "flex:1; padding:8px 4px; font-size:12px; font-weight:700; border-radius:8px; border:1px solid var(--border); cursor:pointer;" +
          (isSel ? " background:var(--brand); color:#fff; border-color:var(--brand);" : " background:var(--panel-alt); color:var(--text);");
        tab.textContent = p.tabLabel + (p.key === "during" && dueReminder && dueReminder.due ? " \uD83D\uDD0A" : (isReallyNow ? " \u2022" : ""));
        tab.onclick = () => { selected = p.key; renderTabs(); renderContent(); };
        tabBar.appendChild(tab);
      });
    }

    renderTabs(); renderContent();
    wrap.appendChild(tabBar); wrap.appendChild(contentHolder);
    wrap.refreshDue = renderContent; // exposed so the caller can re-render just the due-reminder countdown on poll ticks
    return wrap;
  }

  function startGeoWatch(runId, busNum) {
    stopGeo();
    if (!("geolocation" in navigator)) return;
    geoWatchId = navigator.geolocation.watchPosition(
      pos => {
        const now = Date.now();
        if (now - lastGeoWrite < LOC_WRITE_INTERVAL_MS) return;
        lastGeoWrite = now;
        updateBusLocation(runId, busNum, pos.coords.latitude, pos.coords.longitude);
      },
      err => { console.warn("geo error", err); },
      { enableHighAccuracy: false, maximumAge: 20000, timeout: 15000 }
    );
  }
  async function updateBusLocation(runId, busNum, lat, lng) {
    const updated = await mutateRun(runId, (fresh) => {
      const bus = fresh.buses.find(b => b.num === busNum);
      if (!bus) return;
      bus.loc = { lat, lng, at: Date.now() };
    });
    if (updated && state.currentRun && state.currentRun.runId === runId) state.currentRun = updated;
  }

  function statusStepperUI(run, busNum, onAdvance) {
    const bus = run.buses.find(b => b.num === busNum);
    const idx = STATUS_ORDER.indexOf(bus.status);
    const box = document.createElement("div");
    box.className = "status-stepper";
    const label = document.createElement("div");
    label.className = "cur-label"; label.textContent = "Bus " + busNum + " status";
    box.appendChild(label);
    const pill = document.createElement("span");
    pill.className = "status-pill " + STATUS_CLASS(bus.status);
    pill.innerHTML = `<span class="sdot"></span>${bus.status}`;
    box.appendChild(pill);
    if (idx < STATUS_ORDER.length - 1) {
      const next = STATUS_ORDER[idx + 1];
      const btn = document.createElement("button");
      const labelMap = { "In Route": "Mark departed / in route", "Completed": "Mark completed" };
      btn.textContent = labelMap[next] || ("Advance to " + next);
      btn.style.marginTop = "12px";
      if (next === "In Route") {
        // this is the button that starts live GPS/ETA tracking — make it the
        // clear primary action instead of blending into the dark background
        btn.className = "btn btn-primary";
        btn.onclick = onAdvance;
      } else if (next === "Completed") {
        // irreversible — GPS and live tracking stop the moment this is hit,
        // with no way back. Require an explicit second confirmation so a
        // stray tap can't end the run by accident.
        btn.className = "btn btn-secondary";
        btn.onclick = () => {
          const sure = confirm("Mark this bus as Completed?\n\nThis stops live tracking and can't be undone \u2014 make sure the run is actually finished.");
          if (sure) onAdvance();
        };
      } else {
        btn.className = "btn btn-secondary";
        btn.onclick = onAdvance;
      }
      box.appendChild(btn);
    }
    return box;
  }

  // ---------- Guide: manifest (step-gated execute flow) ----------
  function renderGuideManifest() {
    const run = state.currentRun;
    const busNum = state.guideBus;
    const myBus = () => state.currentRun.buses.find(b => b.num === busNum);
    state.forceEtaOpen = false;
    state.unboardedOnly = false;
    state.specialNeedsOnly = false;
    state.viewingChecklist = false;

    const c = document.createElement("div");
    c.appendChild(topbar(run.runId + " \u00b7 Bus " + busNum, () => {
      // Once this route is finished, stepping back one screen at a time
      // through Bus Arrival / checklist / route-fork just replays a route
      // that's already done — go straight to the run list instead.
      if (myBus().status === "Completed") {
        teardownGuideSession();
        loadIndex().then(() => { go("guide-run-select"); startPolling(async () => { await loadIndex(); if (state.view === "guide-run-select") render(); }, 6000); });
      } else {
        go("guide-setup");
      }
    }));
    const screen = document.createElement("div");
    screen.className = "screen";

    const switchLink = document.createElement("button");
    switchLink.className = "link-btn"; switchLink.style.marginBottom = "14px"; switchLink.textContent = "Not your run? Switch run";
    switchLink.onclick = async () => { teardownGuideSession(); await loadIndex(); go("guide-run-select"); startPolling(async () => { await loadIndex(); if (state.view === "guide-run-select") render(); }, 6000); };
    screen.appendChild(switchLink);

    const bodyHolder = document.createElement("div");
    screen.appendChild(bodyHolder);
    c.appendChild(screen);

    function checklistItems() {
      return getChecklistItems(run);
    }
    function checklistComplete() {
      const bus = myBus();
      return checklistItems().every(it => !!bus[it.key]);
    }
    function gateStage() {
      const bus = myBus();
      if (bus.status === "Not Started") return "arrival";
      if (checklistComplete()) return "none";
      return bus.checklistBypassed ? "none" : "checklist";
    }

    async function bypassChecklist() {
      const updated = await mutateRun(run.runId, (fresh) => {
        const bus = fresh.buses.find(b => b.num === busNum);
        if (bus) bus.checklistBypassed = true;
      });
      if (updated) state.currentRun = updated;
      renderBody();
    }

    async function toggleChecklistItem(key) {
      const updated = await mutateRun(run.runId, (fresh) => {
        const bus = fresh.buses.find(b => b.num === busNum);
        if (!bus) return;
        const newVal = !bus[key];
        bus[key] = newVal;
        bus[key + "At"] = newVal ? Date.now() : null;
        // "busArrived" is its own dedicated stage that also drives the bus's tracked status
        if (key === "busArrived") {
          if (newVal && bus.status === "Not Started") { bus.status = "At Staging"; bus.stagingAt = Date.now(); }
          if (!newVal && bus.status === "At Staging") { bus.status = "Not Started"; bus.stagingAt = null; }
        }
      });
      if (updated) state.currentRun = updated;
      renderBody();
    }

    function renderBody() {
      bodyHolder.innerHTML = "";
      const stage = state.viewingChecklist ? "checklist" : gateStage();

      if (stage === "arrival") {
        const track = document.createElement("div");
        track.className = "step-track";
        track.innerHTML = `<b>Bus Arrival</b> \u2014 Stage 1`;
        bodyHolder.appendChild(track);
        const card = document.createElement("div");
        card.className = "prompt-card";
        card.innerHTML = `<div class="picon">\u{1F68C}</div>
          <div class="ptitle">Has the bus arrived at the staging location?</div>
          <div class="pdesc">${run.stagingLocation ? esc(run.stagingLocation) : "Confirm once the bus is parked and ready."} This confirms the bus is physically on site \u2014 the coordinator sees this update immediately.</div>`;
        const btn = document.createElement("button");
        btn.className = "btn btn-primary"; btn.textContent = "Yes, the bus has arrived";
        btn.onclick = () => toggleChecklistItem("busArrived");
        card.appendChild(btn);
        bodyHolder.appendChild(card);
        return;
      }

      if (stage === "checklist") {
        const items = checklistItems();
        const bus = myBus();
        const doneCount = items.filter(it => bus[it.key]).length;

        const track = document.createElement("div");
        track.className = "step-track";
        track.innerHTML = `<b>Pre-Run Checklist</b> \u2014 ${doneCount} of ${items.length} complete`;
        bodyHolder.appendChild(track);

        const heading = document.createElement("p");
        heading.className = "subtitle";
        heading.style.marginBottom = "16px";
        heading.textContent = "Check off each item as it's confirmed. The manifest unlocks once everything's checked.";
        bodyHolder.appendChild(heading);

        const card = document.createElement("div");
        card.className = "card";
        items.forEach((item, i) => {
          const checked = !!bus[item.key];
          const row = document.createElement("div");
          row.className = "pax-row" + (checked ? " boarded-mine" : "");
          if (i < items.length - 1) row.style.marginBottom = "8px";
          row.innerHTML = `<div class="checkbox">${checked ? "\u2713" : ""}</div><div class="pax-name" style="font-size:14.5px;">${esc(item.question)}</div>`;
          row.onclick = () => toggleChecklistItem(item.key);
          card.appendChild(row);
        });
        bodyHolder.appendChild(card);

        // The full guide-only procedure for this stage (Before Loading, food
        // and beverage checks, etc.) lives right here next to the checklist
        // itself, since it's the same moment — never shown to passengers.
        if (state.currentRun.procedureBefore) {
          const procHeading = document.createElement("h3");
          procHeading.style.marginTop = "20px";
          procHeading.textContent = "Full procedure";
          bodyHolder.appendChild(procHeading);
          const procCard = document.createElement("div");
          procCard.className = "card";
          procCard.style.cssText = "font-size:14px; color:var(--text); white-space:pre-wrap;";
          procCard.textContent = state.currentRun.procedureBefore;
          bodyHolder.appendChild(procCard);
        }

        const bypassWrap = document.createElement("div");
        bypassWrap.style.cssText = "margin-top:18px; text-align:center;";
        if (state.viewingChecklist) {
          const backBtn = document.createElement("button");
          backBtn.className = "link-btn";
          backBtn.style.fontSize = "13px";
          backBtn.textContent = "\u2190 Back to manifest";
          backBtn.onclick = () => { state.viewingChecklist = false; renderBody(); };
          bypassWrap.appendChild(backBtn);
        } else {
          const bypassBtn = document.createElement("button");
          bypassBtn.className = "link-btn";
          bypassBtn.style.fontSize = "13px";
          bypassBtn.textContent = "Not everyone's ready yet, but passengers are boarding \u2014 skip for now";
          bypassBtn.onclick = bypassChecklist;
          bypassWrap.appendChild(bypassBtn);
        }
        bodyHolder.appendChild(bypassWrap);
        return;
      }

      // stage === none: full execute UI
      const track = document.createElement("div");
      track.className = "step-track";
      track.innerHTML = `<b>${myBus().status === "In Route" ? "In route" : myBus().status === "Completed" ? "Completed" : "Boarding"}</b>`;
      bodyHolder.appendChild(track);

      if (myBus().checklistBypassed && !checklistComplete()) {
        const items = checklistItems();
        const bus0 = myBus();
        const remaining = items.filter(it => !bus0[it.key]).length;
        const bypassBanner = document.createElement("div");
        bypassBanner.className = "banner";
        bypassBanner.style.cssText = "border-left-color:var(--accent); background:var(--accent-dim); margin-bottom:14px;";
        bypassBanner.innerHTML = `\u26a0\ufe0f Pre-run checklist skipped \u2014 ${remaining} item${remaining === 1 ? "" : "s"} still not confirmed. <span id="view-checklist-link" style="color:var(--accent); text-decoration:underline; cursor:pointer; font-weight:600;">Finish it</span>`;
        bodyHolder.appendChild(bypassBanner);
        setTimeout(() => {
          const link = document.getElementById("view-checklist-link");
          if (link) link.onclick = () => { state.viewingChecklist = true; renderBody(); };
        }, 0);
      }

      const gpsRow = document.createElement("div");
      gpsRow.className = "gps-status"; gpsRow.id = "gps-status-row";
      bodyHolder.appendChild(gpsRow);
      function updateGpsRow() {
        const active = myBus().status === "In Route" && geoWatchId !== null;
        gpsRow.className = "gps-status" + (active ? " live" : "");
        gpsRow.innerHTML = `<span class="gdot"></span>${active ? "Sharing live location" : "Location off until bus is In Route"}`;
      }

      const stepperHolder = document.createElement("div");
      bodyHolder.appendChild(stepperHolder);
      function renderStepper() {
        stepperHolder.innerHTML = "";
        stepperHolder.appendChild(statusStepperUI(state.currentRun, busNum, async () => {
          let newStatus = null;
          const updated = await mutateRun(run.runId, (fresh) => {
            const bus = fresh.buses.find(b => b.num === busNum);
            if (!bus) return;
            const idx = STATUS_ORDER.indexOf(bus.status);
            bus.status = STATUS_ORDER[idx + 1];
            newStatus = bus.status;
            if (bus.status === "In Route") {
              bus.departedAt = Date.now();
              bus.lastAnnouncementAt = Date.now(); // 30-min passenger-update clock starts at departure, same as the ETA clock
            }
            if (bus.status === "Completed") { bus.completedAt = Date.now(); }
          });
          if (!updated) return;
          if (newStatus === "In Route") startGeoWatch(run.runId, busNum);
          if (newStatus === "Completed") { stopGeo(); await clearGuideResume(state.guidePin); }
          state.currentRun = updated;
          renderStepper(); renderEtaBanner(true); updateGpsRow(); renderBody2Track(); renderSwitchRunPrompt(); renderAnnouncements();
          showToast("Bus " + busNum + " marked " + newStatus);
        }));
      }
      function renderBody2Track() { track.innerHTML = `<b>${myBus().status === "In Route" ? "In route" : myBus().status === "Completed" ? "Completed" : "Boarding"}</b>`; }
      renderStepper();

      // Once a bus is Completed there's nothing left to do on this screen —
      // make "Switch Run" the obvious, prominent next action instead of the
      // small link at the very top being the only way forward.
      const switchRunPromptHolder = document.createElement("div");
      bodyHolder.appendChild(switchRunPromptHolder);
      function renderSwitchRunPrompt() {
        switchRunPromptHolder.innerHTML = "";
        if (myBus().status !== "Completed") return;
        const card = document.createElement("div");
        card.className = "card";
        card.style.cssText = "text-align:center; padding:20px 16px;";
        card.innerHTML = `<div style="font-size:14px; color:var(--text-dim); margin-bottom:12px;">This route is complete. Nothing more to do here.</div>`;
        const bigSwitchBtn = document.createElement("button");
        bigSwitchBtn.className = "btn btn-primary";
        bigSwitchBtn.textContent = "Switch Run";
        bigSwitchBtn.onclick = switchLink.onclick;
        card.appendChild(bigSwitchBtn);
        switchRunPromptHolder.appendChild(card);
      }
      renderSwitchRunPrompt();

      // Three announcement scripts, one per stage of the run — the one
      // matching the bus's current status is highlighted so the guide knows
      // exactly what to say right now without hunting through all three.
      const announceHolder = document.createElement("div");
      bodyHolder.appendChild(announceHolder);
      function renderAnnouncements() {
        announceHolder.innerHTML = "";
        const bus = myBus();
        const cur = state.currentRun;
        const currentPhase = (bus.status === "Not Started" || bus.status === "At Staging") ? "before"
          : bus.status === "In Route" ? "during" : "arrival";
        const dueReminder = bus.status === "In Route" ? {
          due: announcementDue(bus),
          minutesUntilDue: announcementMinutesUntilDue(bus),
          onAck: async () => {
            const updated = await mutateRun(run.runId, (fresh) => {
              const b = fresh.buses.find(b2 => b2.num === busNum);
              if (b) b.lastAnnouncementAt = Date.now();
            });
            if (updated) state.currentRun = updated;
            renderAnnouncements();
            showToast("Logged \u2014 next update due in 30 minutes");
          },
        } : null;
        const phaseCard = buildPhaseTabsCard(cur, { currentPhase, dueReminder });
        if (!phaseCard) return; // nothing set anywhere — keep the screen uncluttered
        const heading = document.createElement("h3");
        heading.textContent = "Beginning / During / Arrival";
        announceHolder.appendChild(heading);
        announceHolder.appendChild(phaseCard);
      }
      renderAnnouncements();

      const etaHolder = document.createElement("div");
      bodyHolder.appendChild(etaHolder);
      function renderEtaBanner(force) {
        const bus = myBus();
        // If the editable form is already showing, a background poll refresh
        // (force=false) must not touch it — rebuilding it wipes out whatever
        // the guide has already picked before they've hit Update. Only an
        // explicit user action (opening, closing, or a successful submit)
        // passes force=true and is allowed to rebuild it.
        const currentlyExpanded = etaHolder.querySelector(".eta-banner") !== null;
        if (!force && currentlyExpanded) return;
        etaHolder.innerHTML = "";
        if (bus.status !== "In Route") return;

        if (!etaDue(bus) && !state.forceEtaOpen) {
          const compact = document.createElement("div");
          compact.style.cssText = "margin-bottom:16px; padding:12px 14px; background:var(--panel-alt); border:1px solid var(--border); border-radius:10px;";
          const etaText = bus.eta
            ? "ETA " + new Date(bus.eta).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) + " \u00b7 next check-in in " + etaMinutesUntilDue(bus) + "m"
            : "No ETA set \u00b7 next check-in in " + etaMinutesUntilDue(bus) + "m";
          const info = document.createElement("div");
          info.style.cssText = "font-size:12.5px; color:var(--text-dim); margin-bottom:10px;";
          info.textContent = etaText;
          compact.appendChild(info);
          // A real, unmissable button — not just a subtle link — so a guide
          // can update their ETA the moment something changes (traffic, a
          // delay) without waiting for the next scheduled check-in.
          const openBtn = document.createElement("button");
          openBtn.className = "btn btn-secondary";
          openBtn.textContent = "\u{1F551} Update ETA Now";
          openBtn.onclick = () => { state.forceEtaOpen = true; renderEtaBanner(true); };
          compact.appendChild(openBtn);
          etaHolder.appendChild(compact);
          return;
        }

        const banner = document.createElement("div");
        banner.className = "eta-banner";
        banner.innerHTML = `<div class="eta-title">${bus.eta ? "ETA check-in" : "Set your ETA"}</div>`;
        const row = document.createElement("div");
        row.className = "eta-row";

        // Reliable dropdown-based time picker — native <input type="time"> pickers
        // are inconsistent (and prone to scroll conflicts) across Android browsers.
        const timeRow = document.createElement("div");
        timeRow.style.cssText = "display:flex; gap:6px; align-items:center;";
        const hourSel = document.createElement("select");
        hourSel.style.width = "auto";
        for (let h = 1; h <= 12; h++) { const o = document.createElement("option"); o.value = String(h); o.textContent = String(h); hourSel.appendChild(o); }
        const colon = document.createElement("span"); colon.textContent = ":"; colon.style.cssText = "color:var(--text-dim); font-family:var(--mono);";
        const minSel = document.createElement("select");
        minSel.style.width = "auto";
        for (let m = 0; m < 60; m += 5) { const o = document.createElement("option"); o.value = String(m); o.textContent = String(m).padStart(2, "0"); minSel.appendChild(o); }
        const ampmSel = document.createElement("select");
        ampmSel.style.width = "auto";
        ["AM", "PM"].forEach(v => { const o = document.createElement("option"); o.value = v; o.textContent = v; ampmSel.appendChild(o); });

        // default to the current time, rounded to the nearest 5 minutes
        const now = new Date();
        let defM = Math.round(now.getMinutes() / 5) * 5;
        let defH = now.getHours();
        if (defM === 60) { defM = 0; defH = (defH + 1) % 24; }
        const defAmpm = defH >= 12 ? "PM" : "AM";
        let def12 = defH % 12; if (def12 === 0) def12 = 12;
        hourSel.value = String(def12); minSel.value = String(defM); ampmSel.value = defAmpm;

        timeRow.appendChild(hourSel); timeRow.appendChild(colon); timeRow.appendChild(minSel); timeRow.appendChild(ampmSel);

        const submitBtn = document.createElement("button");
        submitBtn.className = "btn btn-primary"; submitBtn.style.width = "auto"; submitBtn.textContent = "Update ETA";
        submitBtn.onclick = async () => {
          let hh = parseInt(hourSel.value, 10);
          const mm = parseInt(minSel.value, 10);
          if (ampmSel.value === "PM" && hh !== 12) hh += 12;
          if (ampmSel.value === "AM" && hh === 12) hh = 0;
          const d = new Date(); d.setHours(hh, mm, 0, 0);
          const etaVal = d.getTime();
          const updated = await mutateRun(run.runId, (fresh) => {
            const b = fresh.buses.find(b2 => b2.num === busNum);
            if (!b) return;
            b.eta = etaVal; b.etaUpdatedAt = Date.now();
          });
          if (updated) state.currentRun = updated;
          state.forceEtaOpen = false;
          renderEtaBanner(true);
          showToast("ETA updated");
        };
        row.appendChild(timeRow); row.appendChild(submitBtn);
        banner.appendChild(row);
        if (bus.eta) {
          const cur = document.createElement("div"); cur.className = "eta-current";
          cur.textContent = "Current ETA: " + new Date(bus.eta).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) + " \u00b7 last updated " + timeAgo(bus.etaUpdatedAt);
          banner.appendChild(cur);
        }
        if (state.forceEtaOpen && !etaDue(bus)) {
          const closeBtn = document.createElement("button");
          closeBtn.className = "btn btn-ghost"; closeBtn.style.marginTop = "8px"; closeBtn.textContent = "Close";
          closeBtn.onclick = () => { state.forceEtaOpen = false; renderEtaBanner(true); };
          banner.appendChild(closeBtn);
        }
        etaHolder.appendChild(banner);
      }
      renderEtaBanner(true);
      updateGpsRow();
      if (myBus().status === "In Route") startGeoWatch(run.runId, busNum);

      const boarded = totalBoarded(state.currentRun);
      const mine = busBoardedCount(state.currentRun, busNum);
      const total = state.currentRun.manifest.length;
      const stats = document.createElement("div");
      stats.className = "stat-strip";
      function statsHtml(mineC, boardedC, totalC) {
        const remainingActive = state.unboardedOnly;
        return `<div class="stat-box"><div class="num">${mineC}</div><div class="lbl">On this bus</div></div>
          <div class="stat-box"><div class="num">${boardedC}/${totalC}</div><div class="lbl">Run boarded</div></div>
          <button type="button" class="stat-box" id="remaining-toggle" style="cursor:pointer; border:1px solid ${remainingActive ? "var(--brand)" : "var(--border)"}; background:${remainingActive ? "var(--brand-dim)" : "var(--panel-alt)"};">
            <div class="num">${totalC - boardedC}</div><div class="lbl">${remainingActive ? "Showing not boarded" : "Not boarded \u2014 tap"}</div>
          </button>`;
      }
      stats.innerHTML = statsHtml(mine, boarded, total);
      bodyHolder.appendChild(stats);

      // Meal breakdown for THIS bus — counts only passengers actually ticked
      // off as boarded here, so the guide can see exactly how many of each
      // box type to hand out once everyone is seated.
      const mealStrip = document.createElement("div");
      mealStrip.className = "stat-strip";
      mealStrip.style.marginTop = "8px";
      function mealCounts() {
        const c = { regular: 0, allergy: 0, extra: 0, other: 0 };
        state.currentRun.manifest.forEach(p => {
          if (p.boarded && p.busNum === busNum) c[mealCategory(p)]++;
        });
        return c;
      }
      function mealStripHtml() {
        const c = mealCounts();
        return `<div class="stat-box"><div class="num">${c.regular}</div><div class="lbl">Regular</div></div>
          <div class="stat-box" style="${c.allergy ? "border:1px solid var(--accent);" : ""}"><div class="num" style="${c.allergy ? "color:var(--accent);" : ""}">${c.allergy}</div><div class="lbl">Allergen Meals</div></div>
          <div class="stat-box" style="${c.extra ? "border:1px solid var(--brand); background:var(--brand-dim);" : ""}"><div class="num" style="${c.extra ? "color:var(--brand);" : ""}">${c.extra}</div><div class="lbl">Special Dietary Care</div></div>
          <div class="stat-box" style="${c.other ? "border:1px solid var(--status-amber);" : ""}"><div class="num" style="${c.other ? "color:var(--status-amber);" : ""}">${c.other}</div><div class="lbl">Other need</div></div>`;
      }
      mealStrip.innerHTML = mealStripHtml();
      bodyHolder.appendChild(mealStrip);
      const mealNote = document.createElement("p");
      mealNote.className = "subtitle";
      mealNote.style.cssText = "font-size:12px; margin-top:4px; margin-bottom:10px;";
      mealNote.textContent = "Meals for passengers boarded on this bus. Special Dietary Care Meals are named \u2014 hand each one to that guest only. \u201cOther need\u201d is a non-food need (mobility, assistance) \u2014 no meal required.";
      bodyHolder.appendChild(mealNote);

      // ---- Add names to this bus ----
      // Two situations need this. On "build" runs the coach loads freely and
      // the guide types everyone in afterwards. On normal runs, extra people
      // sometimes turn up and aren't turned away — they get added here too.
      const isBuildMode = state.currentRun.manifestMode === "build";
      // Build runs always need it. Pre-populated runs only when the run has
      // walk-ups switched on \u2014 otherwise guides shouldn't be adding names.
      const canAddNames = isBuildMode || !!state.currentRun.allowWalkUps;
      const addWrap = document.createElement("div");
      addWrap.style.cssText = "margin-bottom:14px;";
      bodyHolder.appendChild(addWrap);

      function renderAddBox() {
        addWrap.innerHTML = "";
        if (!canAddNames) return;
        const card = document.createElement("div");
        card.className = "card";
        card.style.cssText = "padding:12px 13px;" + (isBuildMode ? " border-color:var(--brand); background:var(--brand-dim);" : "");

        const h = document.createElement("div");
        h.style.cssText = "font-weight:700; font-size:13.5px; margin-bottom:2px; color:" + (isBuildMode ? "var(--brand)" : "var(--text)") + ";";
        h.textContent = isBuildMode ? "\u270D\uFE0F Build this bus's manifest" : "Add someone who isn't on the list";
        card.appendChild(h);

        const sub = document.createElement("div");
        sub.style.cssText = "font-size:12px; color:var(--text-dim); margin-bottom:8px;";
        sub.textContent = isBuildMode
          ? "Type the names of everyone on board. One per line. They're recorded as boarded on this bus straight away."
          : "For guests who turn up and aren't on the manifest. One name per line.";
        card.appendChild(sub);

        const ta = document.createElement("textarea");
        ta.placeholder = "Jane Rider\nJohn Rider";
        ta.style.cssText = "min-height:" + (isBuildMode ? "84px" : "60px") + "; width:100%;";
        ta.value = state.guideAddNames || "";
        ta.oninput = e => { state.guideAddNames = e.target.value; };
        card.appendChild(ta);

        const btn = document.createElement("button");
        btn.className = "btn " + (isBuildMode ? "btn-primary" : "btn-secondary");
        btn.style.marginTop = "8px";
        btn.textContent = isBuildMode ? "Add to this bus" : "Add to manifest";
        btn.onclick = async () => {
          const names = String(state.guideAddNames || "").split("\n").map(n => n.trim()).filter(Boolean);
          if (!names.length) { showToast("Enter at least one name"); return; }
          btn.disabled = true; btn.textContent = "Adding\u2026";
          let added = 0, dupes = 0;
          const updated = await mutateRun(run.runId, (fresh) => {
            added = 0; dupes = 0;
            names.forEach((nm, i) => {
              if (fresh.manifest.some(p => p.name.toLowerCase() === nm.toLowerCase())) { dupes++; return; }
              fresh.manifest.push({
                id: run.runId + "-gadd-" + Date.now() + "-" + i,
                name: nm,
                // Build mode means they're physically on this coach already,
                // so record them as boarded rather than making the guide
                // tick every name a second time.
                boarded: isBuildMode,
                busNum: isBuildMode ? busNum : null,
                boardedAt: isBuildMode ? Date.now() : null,
                specialNeeds: false, specialNeedsNote: "", phone: "",
              });
              added++;
            });
          });
          if (updated) {
            state.currentRun = updated;
            state.guideAddNames = "";
            showToast(`Added ${added}` + (dupes ? ` \u00b7 ${dupes} already listed` : ""));
            refreshManifestLive();
          } else {
            btn.disabled = false;
            btn.textContent = isBuildMode ? "Add to this bus" : "Add to manifest";
          }
        };
        card.appendChild(btn);

        // Straight to a copy-ready list — the venue team often wants it the
        // moment the manifest is built.
        const copyLink = document.createElement("button");
        copyLink.className = "link-btn";
        copyLink.style.cssText = "margin-top:10px; font-size:12.5px;";
        copyLink.textContent = "\u{1F4CB} Copy this bus's list\u2026";
        copyLink.onclick = () => { state.exportBackView = "guide-manifest"; go("manifest-export"); };
        card.appendChild(copyLink);

        addWrap.appendChild(card);
      }
      renderAddBox();

      // Who's still missing, across the whole run (boarding is fluid between
      // buses, so this is run-wide, not just this coach). Same component the
      // Courtesy Flow and Help Desk screens use, so tapping a name reveals
      // that guest's mobile number here too.
      const notBoardedHolder = document.createElement("div");
      notBoardedHolder.style.cssText = "margin-bottom:14px;";
      bodyHolder.appendChild(notBoardedHolder);
      function renderGuideNotBoarded() {
        notBoardedHolder.innerHTML = "";
        renderNotBoardedToggle(notBoardedHolder, state.currentRun);
      }
      renderGuideNotBoarded();

      function wireRemainingToggle() {
        const btn = document.getElementById("remaining-toggle");
        if (btn) btn.onclick = () => { state.unboardedOnly = !state.unboardedOnly; renderManifestList(); wireRemainingToggle(); refreshStatsDisplay(); };
      }
      function refreshStatsDisplay() {
        const b2 = busBoardedCount(state.currentRun, busNum);
        const t2 = totalBoarded(state.currentRun);
        const tot = state.currentRun.manifest.length;
        stats.innerHTML = statsHtml(b2, t2, tot);
        mealStrip.innerHTML = mealStripHtml();
        renderGuideNotBoarded();
        wireRemainingToggle();
      }
      wireRemainingToggle();

      const searchWrap = document.createElement("div");
      searchWrap.className = "search-wrap";
      const search = document.createElement("input");
      search.type = "text"; search.placeholder = "Search manifest\u2026"; search.value = state.search;
      search.oninput = e => { state.search = e.target.value; renderManifestList(); };
      searchWrap.appendChild(search);
      bodyHolder.appendChild(searchWrap);

      const specialNeedsCount = state.currentRun.manifest.filter(p => p.specialNeeds).length;
      if (specialNeedsCount > 0) {
        const snWrap = document.createElement("div");
        snWrap.style.marginBottom = "10px";
        const snBtn = document.createElement("button");
        snBtn.type = "button";
        snBtn.id = "special-needs-toggle";
        function snBtnStyle() {
          const active = state.specialNeedsOnly;
          snBtn.style.cssText = `width:100%; text-align:left; padding:10px 14px; border-radius:10px; cursor:pointer; border:1px solid ${active ? "var(--accent)" : "var(--border)"}; background:${active ? "var(--accent-dim)" : "var(--panel-alt)"}; color:var(--text); font-family:var(--sans); font-size:13.5px;`;
          snBtn.innerHTML = `\u2b50 ${active ? "Showing special needs only" : "Special needs (" + specialNeedsCount + ") \u2014 tap to view"}`;
        }
        snBtnStyle();
        snBtn.onclick = () => { state.specialNeedsOnly = !state.specialNeedsOnly; renderManifestList(); snBtnStyle(); };
        snWrap.appendChild(snBtn);
        bodyHolder.appendChild(snWrap);
      }

      const listHolder = document.createElement("div");
      listHolder.className = "pax-list"; listHolder.id = "pax-list-holder";
      bodyHolder.appendChild(listHolder);

      function renderManifestList() {
        const holder = document.getElementById("pax-list-holder");
        if (!holder) return;
        holder.innerHTML = "";
        const q = state.search.trim().toLowerCase();
        let filtered = state.currentRun.manifest.filter(p => !q || p.name.toLowerCase().includes(q));
        if (state.unboardedOnly) filtered = filtered.filter(p => !p.boarded);
        if (state.specialNeedsOnly) filtered = filtered.filter(p => p.specialNeeds);
        if (!filtered.length) { holder.innerHTML = `<div class="empty-state" style="padding:30px 10px;">${state.unboardedOnly ? "Everyone's boarded! \uD83C\uDF89" : "No matches."}</div>`; return; }
        filtered.forEach(p => {
          const row = document.createElement("div");
          const mineRow = p.boarded && p.busNum === busNum;
          const otherRow = p.boarded && p.busNum !== busNum;
          const otherGuide = otherRow ? (state.currentRun.buses.find(b => b.num === p.busNum) || {}).guideName : null;
          row.className = "pax-row" + (mineRow ? " boarded-mine" : "") + (otherRow ? " boarded-other" : "");
          const noteHtml = (p.specialNeeds && p.specialNeedsNote)
            ? `<div style="font-size:11px; color:var(--accent); margin-top:2px;">\u2b50 ${esc(p.specialNeedsNote)}</div>` : "";
          const phoneKey = run.runId + "::" + p.id;
          const phoneOpen = state.expandedGuestPhoneKeys.has(phoneKey);
          row.innerHTML = `<div class="checkbox">${p.boarded ? "\u2713" : ""}</div><div class="pax-name" style="flex:1;"><div>${p.specialNeeds ? "\u2b50 " : ""}${esc(p.name)}</div>${noteHtml}${
            phoneOpen
              ? (p.phone
                  ? `<div style="margin-top:4px;"><a href="tel:${esc(String(p.phone).replace(/[^0-9+]/g, ""))}" style="font-size:13.5px; font-weight:600; color:var(--brand); text-decoration:none;">\u{1F4DE} ${esc(p.phone)}</a><span style="font-size:11px; color:var(--text-dim); margin-left:6px;">tap to call</span></div>`
                  : `<div style="margin-top:4px; font-size:12px; color:var(--text-dim);">No mobile number on file</div>`)
              : ""
          }</div>${otherRow ? `<div class="pax-tag">Bus ${p.busNum}${otherGuide ? " \u00b7 " + esc(otherGuide) : ""}</div>` : ""}<button class="pax-phone-btn" style="all:unset; cursor:pointer; padding:6px 8px; font-size:15px; opacity:${phoneOpen ? "1" : "0.45"};" title="Show mobile number">\u{1F4DE}</button>`;
          // The phone button is deliberately separate from the row's own tap
          // target — tapping it must never board or un-board someone.
          const phoneBtn = row.querySelector(".pax-phone-btn");
          if (phoneBtn) {
            phoneBtn.onclick = (e) => {
              e.stopPropagation();
              if (phoneOpen) state.expandedGuestPhoneKeys.delete(phoneKey);
              else state.expandedGuestPhoneKeys.add(phoneKey);
              renderManifestList();
            };
          }
          if (!otherRow) {
            row.onclick = async () => {
              const personId = p.id;
              const updated = await mutateRun(run.runId, (fresh) => {
                const person = fresh.manifest.find(x => x.id === personId);
                if (!person) return;
                if (person.boarded && person.busNum === busNum) { person.boarded = false; person.busNum = null; person.boardedAt = null; }
                else if (!person.boarded) { person.boarded = true; person.busNum = busNum; person.boardedAt = Date.now(); }
              });
              if (updated) state.currentRun = updated;
              renderManifestList();
              refreshStatsDisplay();
            };
          }
          holder.appendChild(row);
        });
      }
      function updateStatsInPlace() { refreshStatsDisplay(); }
      refreshManifestLive = () => { renderManifestList(); updateStatsInPlace(); renderEtaBanner(); updateGpsRow(); renderAnnouncements(); };
      renderManifestList();
    }

    renderBody();
    return c;
  }

  // ---------- Coordinator: PIN gate ----------
  function renderCoordPin() {
    const c = document.createElement("div");
    c.appendChild(topbar("Coordinator", () => go("role-select")));
    const screen = document.createElement("div");
    screen.className = "screen";
    const holder = document.createElement("div");
    screen.appendChild(holder);
    c.appendChild(screen);
    loadCoordPin().then(pw => {
      if (!pw) {
        holder.innerHTML = "";
        const h = document.createElement("h2"); h.textContent = "Create a coordinator password";
        const sub = document.createElement("p"); sub.className = "subtitle";
        sub.textContent = "No coordinator password is set yet. Create one now (at least 8 characters) \u2014 you'll need it to get back in.";
        holder.appendChild(h); holder.appendChild(sub);

        const lbl1 = document.createElement("label"); lbl1.textContent = "Password";
        const p1 = document.createElement("input");
        p1.type = "password"; p1.placeholder = "At least 8 characters"; p1.autocomplete = "new-password";
        const lbl2 = document.createElement("label"); lbl2.textContent = "Confirm password";
        const p2 = document.createElement("input");
        p2.type = "password"; p2.autocomplete = "new-password";
        holder.appendChild(lbl1); holder.appendChild(p1); holder.appendChild(lbl2); holder.appendChild(p2);

        const btn = document.createElement("button");
        btn.className = "btn btn-primary"; btn.style.marginTop = "18px"; btn.textContent = "Create password & continue";
        btn.onclick = async () => {
          if (p1.value.length < 8) { showToast("Password must be at least 8 characters"); return; }
          if (p1.value !== p2.value) { showToast("Passwords don't match"); return; }
          await saveCoordPin(p1.value);
          state.coordAuthedAt = Date.now();
          state.coordTab = "dashboard";
          go("coord-home");
        };
        holder.appendChild(btn);
      } else {
        holder.innerHTML = "";
        const h = document.createElement("h2"); h.textContent = "Enter coordinator password";
        holder.appendChild(h);
        const label = document.createElement("label"); label.textContent = "Password";
        const input = document.createElement("input");
        input.type = "password"; input.autocomplete = "current-password"; input.autofocus = true;
        holder.appendChild(label); holder.appendChild(input);
        const btn = document.createElement("button");
        btn.className = "btn btn-primary"; btn.style.marginTop = "16px"; btn.textContent = "Continue";
        btn.onclick = async () => {
          if (input.value !== pw) { showToast("Incorrect password"); return; }
          state.coordAuthedAt = Date.now();
          state.coordTab = "dashboard";
          go("coord-home");
        };
        input.onkeydown = e => { if (e.key === "Enter") btn.click(); };
        holder.appendChild(btn);
      }
    });
    return c;
  }

  // ---------- Coordinator: tabbed home (Dashboard / Search / Courtesy Flow / Settings) ----------
  function renderCoordHome() {
    const c = document.createElement("div");
    c.appendChild(topbar("Coordinator", () => { stopPolling(); destroyFleetMap(); go("role-select"); }));
    const screen = document.createElement("div");
    screen.className = "screen";

    const banner = document.createElement("div");
    banner.className = "banner";
    banner.textContent = "Guides sign in with their own PIN. This data syncs to your Google Sheet if you've connected one in Settings.";
    screen.appendChild(banner);

    const tabBar = document.createElement("div");
    tabBar.className = "tab-bar";
    const tabs = [
      { id: "dashboard", label: "Dashboard", icon: "\u{1F4CA}" },
      { id: "map", label: "Fleet Map", icon: "\u{1F5FA}\uFE0F" },
      { id: "search", label: "Search", icon: "\u{1F50D}" },
      { id: "passengers", label: "Passengers", icon: "\u{1F465}" },
      { id: "courtesy", label: "Courtesy Flow", icon: "\u{1F697}" },
      { id: "settings", label: "Settings", icon: "\u2699\uFE0F" },
    ];
    tabs.forEach(t => {
      const btn = document.createElement("button");
      btn.className = "tab-btn" + (state.coordTab === t.id ? " active" : "");
      btn.innerHTML = `<span>${t.icon}</span> ${t.label}`;
      btn.onclick = () => { state.coordTab = t.id; render(); };
      tabBar.appendChild(btn);
    });
    screen.appendChild(tabBar);

    const contentHolder = document.createElement("div");
    contentHolder.innerHTML = `<div class="empty-state" style="padding:30px 0;">Loading\u2026</div>`;
    screen.appendChild(contentHolder);
    c.appendChild(screen);

    async function refresh() {
      if (state.view !== "coord-home") return;
      // Settings and Search are forms/lookups you're actively interacting with —
      // an automatic rebuild would wipe out anything mid-typing, so only the
      // live-glance views (Dashboard, Courtesy Flow, Fleet Map) refresh on their own.
      if (state.coordTab === "settings" || state.coordTab === "search" || state.coordTab === "passengers") return;
      lastReadFailed = false;
      let runs = [], roster = [];
      try {
        await loadIndex();
        runs = state.runIndex.length ? await loadScopedRuns() : [];
        roster = (state.coordTab === "courtesy" || state.coordTab === "map") ? await loadRoster() : [];
      } catch (err) {
        // A failed background refresh must never wipe what's already on
        // screen — leave the last good render in place and try again next tick.
        console.error("background refresh failed", err);
        return;
      }
      if (state.view !== "coord-home") return;
      if (state.coordTab === "settings" || state.coordTab === "search" || state.coordTab === "passengers") return;
      if (state.coordTab !== "map") destroyFleetMap();
      contentHolder.innerHTML = "";
      if (state.coordTab === "dashboard") contentHolder.appendChild(buildDashboardTab(runs));
      else if (state.coordTab === "courtesy") contentHolder.appendChild(buildCourtesyContent(runs, roster));
      else if (state.coordTab === "map") contentHolder.appendChild(buildFleetMapTab(runs, roster));
    }

    function showTabError(msg) {
      contentHolder.innerHTML = "";
      const box = document.createElement("div");
      box.className = "banner";
      box.style.cssText = "border-left-color:var(--accent); background:var(--accent-dim); color:var(--accent);";
      box.textContent = msg;
      contentHolder.appendChild(box);
      const btn = document.createElement("button");
      btn.className = "btn btn-primary";
      btn.textContent = "Try again";
      btn.onclick = () => renderCurrentTab();
      contentHolder.appendChild(btn);
    }

    async function renderCurrentTab() {
      try { await renderCurrentTabInner(); }
      catch (err) {
        console.error("tab render failed", err);
        showTabError("Couldn't load this screen just now \u2014 the system is busy. Your data is safe.");
      }
    }

    async function renderCurrentTabInner() {
      // Always hydrate the run index from the database first — never build
      // any tab (Settings included) off whatever state.runIndex happens to
      // be in memory, which could still be the empty default right after a
      // fresh page load.
      lastReadFailed = false;
      await loadIndex();
      const runs = state.runIndex.length
        ? await loadScopedRuns()
        : [];
      if (state.coordTab !== "map") destroyFleetMap();
      contentHolder.innerHTML = "";
      if (state.coordTab === "dashboard") contentHolder.appendChild(buildDashboardTab(runs));
      else if (state.coordTab === "search") contentHolder.appendChild(buildSearchTab(runs));
      else if (state.coordTab === "courtesy") contentHolder.appendChild(buildCourtesyContent(runs, await loadRoster()));
      else if (state.coordTab === "map") contentHolder.appendChild(buildFleetMapTab(runs, await loadRoster()));
      else if (state.coordTab === "passengers") contentHolder.appendChild(buildPassengersTab(runs));
      else if (state.coordTab === "settings") contentHolder.appendChild(buildSettingsTab());
    }

    renderCurrentTab();
    startPolling(refresh, 60000);
    return c;
  }

  // ---------- Dashboard tab: global stats + run list ----------
  function buildDashboardTab(runs, statsOnly) {
    const wrap = document.createElement("div");

    if (!runs.length) {
      if (lastReadFailed) {
        wrap.innerHTML = `<div class="empty-state"><div class="big">\u26A0\uFE0F</div>Couldn't load runs from the database.<br/>Check your connection.</div>`;
        const retry = document.createElement("button");
        retry.className = "btn btn-primary"; retry.style.marginTop = "14px"; retry.textContent = "Try again";
        retry.onclick = () => { lastReadFailed = false; render(); };
        wrap.appendChild(retry);
        return wrap;
      }
      wrap.innerHTML = `<div class="empty-state"><div class="big">\u{1F4CB}</div>No runs yet. Head to Settings to create one or import a batch from Excel.</div>`;
      return wrap;
    }

    const byStatus = {};
    STATUS_ORDER.forEach(s => { byStatus[s] = { buses: 0, pax: 0 }; });
    let grandBuses = 0, grandPax = 0, completedRuns = 0, inRouteBuses = 0, totalBoardedAllRuns = 0;
    runs.forEach(run => {
      run.buses.forEach(b => {
        const pax = busBoardedCount(run, b.num);
        byStatus[b.status].buses += 1;
        byStatus[b.status].pax += pax;
        grandBuses += 1; grandPax += pax;
        if (b.status === "In Route") inRouteBuses += 1;
      });
      totalBoardedAllRuns += totalBoarded(run);
      if (aggregateStatus(run) === "Completed") completedRuns += 1;
    });

    const topStrip = document.createElement("div");
    topStrip.className = "stat-strip";
    topStrip.innerHTML = `
      <div class="stat-box"><div class="num">${runs.length}</div><div class="lbl">Total runs</div></div>
      <div class="stat-box"><div class="num">${completedRuns}</div><div class="lbl">Runs completed</div></div>
      <div class="stat-box"><div class="num">${inRouteBuses}</div><div class="lbl">Buses en route</div></div>
      <div class="stat-box"><div class="num">${totalBoardedAllRuns}</div><div class="lbl">Passengers boarded</div></div>
    `;
    wrap.appendChild(topStrip);

    const breakdownLabel = document.createElement("h3");
    breakdownLabel.textContent = "Buses & passengers by stage";
    breakdownLabel.style.margin = "16px 0 8px";
    wrap.appendChild(breakdownLabel);

    const breakdownCard = document.createElement("div");
    breakdownCard.className = "card";
    STATUS_ORDER.forEach(s => {
      const t = byStatus[s];
      const row = document.createElement("div");
      row.className = "bus-detail-row";
      row.innerHTML = `<div class="bus-detail-left"><span class="status-pill ${STATUS_CLASS(s)}"><span class="sdot"></span>${s}</span></div>
        <div class="bus-detail-count">${t.buses} bus${t.buses === 1 ? "" : "es"} \u00b7 ${t.pax} pax</div>`;
      breakdownCard.appendChild(row);
    });
    const totalRow = document.createElement("div");
    totalRow.className = "bus-detail-row"; totalRow.style.borderTop = "2px solid var(--border)";
    totalRow.innerHTML = `<div class="bus-detail-left"><span style="font-family:var(--mono); font-size:12px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.05em;">Total</span></div>
      <div class="bus-detail-count"><b>${grandBuses} buses \u00b7 ${grandPax} pax</b></div>`;
    breakdownCard.appendChild(totalRow);
    wrap.appendChild(breakdownCard);

    // Courtesy Flow wants the numbers only \u2014 it already has its own
    // arrival/departure views for drilling into individual runs.
    if (statsOnly) return wrap;

    const listHeading = document.createElement("h3");
    listHeading.textContent = "All runs";
    listHeading.style.margin = "22px 0 8px";
    wrap.appendChild(listHeading);

    const runSearch = document.createElement("input");
    runSearch.type = "search";
    runSearch.placeholder = "Search runs \u2014 ID, description, origin, destination, guide\u2026";
    runSearch.value = state.coordRunQuery || "";
    runSearch.style.cssText = "width:100%; margin-bottom:10px;";
    runSearch.oninput = e => { state.coordRunQuery = e.target.value; renderRunCards(); };
    wrap.appendChild(runSearch);

    const runCountLine = document.createElement("p");
    runCountLine.className = "subtitle";
    runCountLine.style.cssText = "font-size:12px; margin:-4px 0 8px;";
    wrap.appendChild(runCountLine);

    const runListHolder = document.createElement("div");
    wrap.appendChild(runListHolder);

    // Sort the way the IDs read rather than plain alphabetical: plain
    // localeCompare keys on the airport code in the middle of
    // C-MMDD-ORIG-DEST-Cnnn, which scrambles the Cnnn sequence. Sort by
    // date, then the trailing run number, then the whole ID as a tiebreak.
    function runSortKey(runId) {
      const id = String(runId || "");
      const dm = id.match(/^C-(\d{4})/);
      const sm = id.match(/C(\d+)\s*$/);
      return {
        date: dm ? parseInt(dm[1], 10) : 99999,
        seq: sm ? parseInt(sm[1], 10) : 999999,
        raw: id,
      };
    }
    function compareRuns(a, b) {
      const ka = runSortKey(a.runId), kb = runSortKey(b.runId);
      if (ka.date !== kb.date) return ka.date - kb.date;
      if (ka.seq !== kb.seq) return ka.seq - kb.seq;
      return ka.raw.localeCompare(kb.raw);
    }

    function renderRunCards() {
      runListHolder.innerHTML = "";
      const q = String(state.coordRunQuery || "").trim().toLowerCase();
      const shown = runs.filter(run => {
        if (!q) return true;
        const hay = [
          run.runId, run.description, run.origin, run.destination, run.busCompany,
          ...(run.buses || []).map(b => b.guideName),
        ].filter(Boolean).join(" ").toLowerCase();
        return hay.includes(q);
      }).slice().sort(compareRuns);

      runCountLine.textContent = q
        ? `${shown.length} of ${runs.length} run(s) match`
        : `${runs.length} run(s)`;

      if (!shown.length) {
        runListHolder.innerHTML = `<div class="empty-state" style="padding:20px 0;">No runs match \u201c${esc(state.coordRunQuery)}\u201d.</div>`;
        return;
      }
      shown.forEach(renderOneRunCard);
    }

    function renderOneRunCard(run) {
      const boarded = totalBoarded(run);
      const total = run.manifest.length;
      const agg = aggregateStatus(run);
      const card = document.createElement("div");
      card.className = "card";
      const btn = document.createElement("button");
      btn.className = "list-btn";
      const chips = run.buses.map(b => `<span class="status-pill ${STATUS_CLASS(b.status)}" style="margin-right:6px; margin-bottom:4px; display:inline-flex;"><span class="sdot"></span>Bus ${b.num}${b.guideName ? " \u00b7 " + esc(b.guideName) : ""}</span>`).join("");
      btn.innerHTML = `<div class="run-row"><div><div class="run-id">${esc(run.runId)}</div><div class="run-desc">${esc(run.description || "")}</div>${run.busCompany ? `<div style="font-size:11.5px; color:var(--text-dim); margin-top:2px;">\u{1F68C} ${esc(run.busCompany)}</div>` : ""}</div></div>
        <div style="margin:10px 0 8px;">${chips}</div>
        <div class="run-row"><span class="status-pill ${STATUS_CLASS(agg)}"><span class="sdot"></span>${agg}</span><span style="font-family:var(--mono); font-size:13px;">${boarded} / ${total} boarded</span></div>`;
      btn.onclick = async () => { stopPolling(); state.currentRun = await loadRun(run.runId); go("coord-run-detail"); };
      card.appendChild(btn);
      runListHolder.appendChild(card);
    }

    renderRunCards();
    setTimeout(() => {
      if (state.coordRunQuery) {
        runSearch.focus();
        runSearch.setSelectionRange(runSearch.value.length, runSearch.value.length);
      }
    }, 0);

    return wrap;
  }

  // ---------- Search tab: passenger lookup across every run ----------
  function buildSearchTab(runs) {
    const wrap = document.createElement("div");
    const heading = document.createElement("h2");
    heading.textContent = "Find a passenger";
    wrap.appendChild(heading);
    const sub = document.createElement("p");
    sub.className = "subtitle";
    sub.textContent = "Search by name across every run to see whether they've boarded, which bus, and who the guide is.";
    wrap.appendChild(sub);

    const searchInput = document.createElement("input");
    searchInput.type = "text";
    searchInput.placeholder = "Passenger name\u2026";
    searchInput.value = state.passengerSearchQuery;
    searchInput.autofocus = true;
    wrap.appendChild(searchInput);

    const results = document.createElement("div");
    results.style.marginTop = "14px";
    wrap.appendChild(results);

    function renderResults() {
      const q = state.passengerSearchQuery.trim().toLowerCase();
      results.innerHTML = "";
      if (!q) return;
      const matches = [];
      runs.forEach(run => {
        run.manifest.forEach(p => {
          if (p.name.toLowerCase().includes(q)) matches.push({ run, person: p });
        });
      });
      if (!matches.length) {
        results.innerHTML = `<div class="empty-state" style="padding:20px 0;">No passenger matches "${esc(state.passengerSearchQuery)}".</div>`;
        return;
      }
      matches.slice(0, 30).forEach(({ run, person }) => {
        const bus = person.boarded ? run.buses.find(b => b.num === person.busNum) : null;
        const card = document.createElement("div");
        card.className = "card";
        const row = document.createElement("button");
        row.className = "list-btn";
        row.innerHTML = `<div class="run-row"><b style="font-size:14.5px;">${esc(person.name)}</b>
            <span class="run-id" style="font-size:12px;">${esc(run.runId)}</span></div>
          <div class="bus-detail-meta" style="margin-top:4px;">
            ${person.boarded
              ? `Boarded &middot; Bus ${person.busNum}${bus && bus.guideName ? " &middot; Guide: " + esc(bus.guideName) : ""}`
              : "Not yet boarded &middot; " + esc(run.description || run.runId)}
          </div>`;
        row.onclick = async () => {
          stopPolling();
          state.currentRun = await loadRun(run.runId);
          if (person.boarded) { state.currentBusNum = person.busNum; go("coord-bus-detail"); }
          else { go("coord-run-detail"); }
        };
        card.appendChild(row);
        results.appendChild(card);
      });
      if (matches.length > 30) {
        const more = document.createElement("div");
        more.className = "subtitle"; more.style.fontSize = "12px";
        more.textContent = (matches.length - 30) + " more match" + (matches.length - 30 === 1 ? "" : "es") + " \u2014 narrow your search to see them.";
        results.appendChild(more);
      }
    }
    searchInput.oninput = e => { state.passengerSearchQuery = e.target.value; renderResults(); };
    renderResults();
    return wrap;
  }

  // ---------- Courtesy Flow content: runs grouped by destination ----------
  // Shared between the Coordinator's "Courtesy Flow" tab and the standalone
  // no-PIN Courtesy Flow role reachable from the role-select screen.
  // ---------- Fleet Map tab: everyone's live location, plus pickup/drop-off pins ----------
  let fleetMapInstance = null;
  let fleetMapMarkers = {};
  function destroyFleetMap() { if (fleetMapInstance) { fleetMapInstance.remove(); fleetMapInstance = null; fleetMapMarkers = {}; } }

  function buildFleetMapTab(runs, roster) {
    const wrap = document.createElement("div");
    const heading = document.createElement("h2");
    heading.textContent = "Fleet Map";
    wrap.appendChild(heading);
    const sub = document.createElement("p");
    sub.className = "subtitle";
    sub.textContent = "Every guide currently sharing a live location, across every run, plus pickup and drop-off points.";
    wrap.appendChild(sub);

    const legend = document.createElement("div");
    legend.style.cssText = "display:flex; gap:14px; flex-wrap:wrap; margin-bottom:12px; font-size:12px; color:var(--text-dim);";
    legend.innerHTML = `
      <span>\u{1F535} Live bus</span>
      <span>\u{1F7E2} Origin / staging</span>
      <span>\u{1F7E0} Destination</span>`;
    wrap.appendChild(legend);

    const mapDiv = document.createElement("div");
    mapDiv.id = "fleet-map";
    mapDiv.style.cssText = "height:400px; border-radius:12px; overflow:hidden; border:1px solid var(--border);";
    wrap.appendChild(mapDiv);

    const statusLine = document.createElement("p");
    statusLine.className = "subtitle";
    statusLine.style.fontSize = "12px";
    statusLine.style.marginTop = "10px";
    wrap.appendChild(statusLine);

    const liveBuses = [];
    runs.forEach(run => run.buses.forEach(bus => { if (bus.loc) liveBuses.push({ run, bus }); }));
    statusLine.textContent = liveBuses.length
      ? liveBuses.length + " bus" + (liveBuses.length === 1 ? "" : "es") + " currently sharing location."
      : "No buses are currently sharing a live location \u2014 markers appear once a bus goes In Route.";

    setTimeout(async () => {
      if (typeof L === "undefined") { statusLine.textContent = "Map couldn't load \u2014 check your internet connection."; return; }
      const el = document.getElementById("fleet-map");
      if (!el) return;
      if (!fleetMapInstance) {
        fleetMapInstance = L.map(el, { attributionControl: false }).setView([39.5, -98.35], 4);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 18 }).addTo(fleetMapInstance);
      }
      const bounds = [];

      // live bus/guide markers
      liveBuses.forEach(({ run, bus }) => {
        const key = "bus-" + run.runId + "-" + bus.num;
        const popupHtml = `<b>${esc(bus.guideName || "Bus " + bus.num)}</b><br/>${esc(run.runId)} \u00b7 Bus ${bus.num}<br/>${bus.status}<br/>Updated ${timeAgo(bus.loc.at)}`;
        if (fleetMapMarkers[key]) {
          fleetMapMarkers[key].setLatLng([bus.loc.lat, bus.loc.lng]);
          fleetMapMarkers[key].setPopupContent(popupHtml);
        } else {
          fleetMapMarkers[key] = L.marker([bus.loc.lat, bus.loc.lng]).addTo(fleetMapInstance).bindPopup(popupHtml);
        }
        bounds.push([bus.loc.lat, bus.loc.lng]);
      });

      // unique pickup/drop-off locations, geocoded and cached
      const originMap = {}, destMap = {};
      runs.forEach(run => {
        if (run.origin) { const k = run.origin.trim(); if (k) (originMap[k] = originMap[k] || []).push(run.runId); }
        if (run.stagingLocation) { const k = run.stagingLocation.trim(); if (k) (originMap[k] = originMap[k] || []).push(run.runId); }
        if (run.destination) { const k = run.destination.trim(); if (k) (destMap[k] = destMap[k] || []).push(run.runId); }
      });

      for (const [locName, runIds] of Object.entries(originMap)) {
        const key = "origin-" + locName;
        if (fleetMapMarkers[key]) continue;
        const coords = await geocodeLocation(locName);
        if (!coords) continue;
        const uniqueRuns = Array.from(new Set(runIds));
        const marker = L.circleMarker([coords.lat, coords.lng], { radius: 9, color: "#34D399", fillColor: "#34D399", fillOpacity: 0.9, weight: 2 })
          .addTo(fleetMapInstance)
          .bindPopup(`<b>${esc(locName)}</b><br/>Origin / staging for: ${esc(uniqueRuns.join(", "))}`);
        fleetMapMarkers[key] = marker;
        bounds.push([coords.lat, coords.lng]);
      }
      for (const [locName, runIds] of Object.entries(destMap)) {
        const key = "dest-" + locName;
        if (fleetMapMarkers[key]) continue;
        const coords = await geocodeLocation(locName);
        if (!coords) continue;
        const uniqueRuns = Array.from(new Set(runIds));
        const marker = L.circleMarker([coords.lat, coords.lng], { radius: 9, color: "#E8963A", fillColor: "#E8963A", fillOpacity: 0.9, weight: 2 })
          .addTo(fleetMapInstance)
          .bindPopup(`<b>${esc(locName)}</b><br/>Destination for: ${esc(uniqueRuns.join(", "))}`);
        fleetMapMarkers[key] = marker;
        bounds.push([coords.lat, coords.lng]);
      }

      if (bounds.length === 1) fleetMapInstance.setView(bounds[0], 12);
      else if (bounds.length > 1) fleetMapInstance.fitBounds(bounds, { padding: [30, 30] });
    }, 0);

    return wrap;
  }

  function groupRunsByLocation(runs, field) {
    const groups = {};
    runs.forEach(run => {
      const loc = (run[field] || "").trim();
      const key = loc ? loc.toLowerCase() : "\u0000unspecified";
      if (!groups[key]) groups[key] = { label: loc || "Unspecified location", entries: [] };
      run.buses.forEach(b => groups[key].entries.push({ run, bus: b }));
    });
    return groups;
  }

  // Shared "who hasn't boarded yet" expandable list — boarding is fluid across
  // buses on a run, so this is scoped per run, not per bus.
  function renderNotBoardedToggle(container, run) {
    const notBoarded = run.manifest.filter(p => !p.boarded);
    const key = "nb-" + run.runId;
    const btn = document.createElement("button");
    btn.className = "link-btn";
    btn.style.cssText = "margin-top:8px; font-size:12.5px; display:block;";
    const isOpen = state.expandedNotBoardedKeys.has(key);
    btn.textContent = (isOpen ? "\u25B2 Hide" : "\u25BC View") + " who hasn't boarded (" + notBoarded.length + ")";
    btn.onclick = () => {
      if (isOpen) state.expandedNotBoardedKeys.delete(key); else state.expandedNotBoardedKeys.add(key);
      render();
    };
    container.appendChild(btn);
    if (isOpen) {
      const listBox = document.createElement("div");
      listBox.style.cssText = "margin-top:8px; max-height:240px; overflow-y:auto; background:var(--panel-alt); border:1px solid var(--border); border-radius:8px; padding:4px 12px;";

          const isShown = state.expandedGuestPhoneKeys.has(pKey);
          const row = document.createElement("div");
          row.style.cssText = "padding:6px 0; border-bottom:1px solid var(--border);";

          const nameBtn = document.createElement("button");
          nameBtn.style.cssText = "all:unset; cursor:pointer; display:flex; align-items:center; justify-content:space-between; width:100%; font-size:13.5px; color:var(--text);";
          nameBtn.innerHTML = `<span>${esc(p.name)}</span>
            <span style="font-size:11px; color:var(--text-dim);">${isShown ? "\u25B2" : "\u{1F4DE}"}</span>`;
          nameBtn.onclick = () => {
            if (isShown) state.expandedGuestPhoneKeys.delete(pKey);
            else state.expandedGuestPhoneKeys.add(pKey);

                <div style="font-size:11.5px; color:var(--text-dim); margin-top:2px;">Tap to call</div>`;
            } else {
              detail.innerHTML = `<div style="font-size:12.5px; color:var(--text-dim);">No mobile number on file for this guest.</div>`;
            }

          }
