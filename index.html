<script>
(function () {
  const STATUS_ORDER = ["Not Started", "At Staging", "In Route", "Completed"];
  const BUS_COMPANIES = ["Academy Express", "Yankee Line"];
  const DESTINATIONS = [
    "Westfield Hall", "New York Hall", "EWR Terminal A", "EWR Terminal B", "EWR Terminal C",
    "Allentown Airport (ABE)", "Stewart International Airport (SWF)", "Westchester County Airport (HPN)",
    "LGA", "JFK Terminal 8",
    // Friday boat-trip venues — these runs move real passengers, so their
    // locations belong in the fixed list like any airport or hall.
    "Pier 14 - Hoboken", "Delta Hotel - Basking Ridge",
  ];
  const ORIGINS = DESTINATIONS.filter(d => d !== "JFK Terminal 8"); // LGA is allowed as an origin too — only JFK T8 stays destination-only
  const MAX_BUSES = 12; // guide slots per run — some runs carry more guides than coaches
  // Venues the courtesy team actually staffs. Arrivals show runs ending at
  // one of these; departures show runs starting at one. The Friday boat
  // transfers run halls <-> Pier 14 and the Delta Hotel, so those are staffed
  // venues too, not just the two meeting halls.
  const HALL_NAMES = new Set([
    "Westfield Hall", "New York Hall",
    "Pier 14 - Hoboken", "Delta Hotel - Basking Ridge",
  ]);
  const AUTH_SESSION_MS = 60 * 60 * 1000; // stay signed in for 60 minutes of inactivity — applies to every role, not just the coordinator
  function getChecklistItems(run) {
    const items = [
      { key: "guideArrived", question: "Has the guide arrived at the staging location?", short: "Guide arrived at staging" },
    ];
    if (run.catering) items.push({ key: "cateringLoaded", question: "Has catering arrived and been loaded onto the bus?", short: "Catering arrived & loaded" });
    items.push({ key: "teamInPlace", question: "Are all team members in place?", short: "All team members in place" });
    return items;
  }
  const STATUS_CLASS = s => "status-" + s.replace(/\s+/g, "-");
  const ETA_INTERVAL_MS = 15 * 60 * 1000;
  const PASSENGER_ANNOUNCEMENT_INTERVAL_MS = 30 * 60 * 1000; // guest-facing ETA/traffic update cadence — separate from the 15-min ETA re-confirmation above
  const LOC_WRITE_INTERVAL_MS = 25 * 1000;

  let state = {
    view: "role-select",
    role: null,
    runIndex: [],
    currentRun: null,
    guideName: "",
    guidePin: "",
    guideBus: null,
    search: "",
    toast: null,
    pinInput: "",
    roster: [],
    courtesyRoster: [],
    newGuideName: "",
    passengerSearchQuery: "",
    currentBusNum: null,
    coordTab: "dashboard",
    courtesySelectedDestination: null,
    courtesySelectedDay: null,
    editingGuideIndex: null,
    coordAuthedAt: null,
    guideAuthedAt: null,
    courtesyName: null,
    courtesyAuthedAt: null,
    helpdeskAuthedAt: null,
    expandedLocationKeys: new Set(),
    expandedNotBoardedKeys: new Set(),
    expandedRunKeys: new Set(),
    expandedGuestPhoneKeys: new Set(),
    expandedBusPaxKeys: new Set(),
    paxToolMode: "remove",        // "remove" | "add"
    paxToolQuery: "",
    paxSelectedNames: new Set(),  // names picked for a bulk action
    paxSelectedRunIds: new Set(), // runs picked for a bulk action
    paxAddNames: "",              // typed names survive re-renders
    paxAddNeeds: "",
    manifestCatFilter: "all",
    guideAddNames: "",
    coordRunQuery: "",
    loadAllDays: false,
    hdCompletedQuery: "",
    hdOpenCompleted: null,
    exportScope: "boarded",
    exportGrouping: "bybus",
    exportBackView: "coord-run-detail",
    courtesyMode: "arrival",
    unboardedOnly: false,
    specialNeedsOnly: false,
    courtesyPinInput: "",
    forceEtaOpen: false,
    helpdeskPinInput: "",
    helpdeskTab: "arrivals",
    helpdeskSearchMode: "passenger",
    helpdeskSearchQuery: "",
  };

  let pollTimer = null, etaTimer = null, geoWatchId = null, lastGeoWrite = 0;
  let mapInstance = null, mapMarkers = {}, syncTimers = {};

  // Storage layer: backed by Firebase Realtime Database so every guide's
  // phone and the coordinator's dashboard read/write the same live data.
  function safeKey(key) { return key.replace(/[.#$\[\]]/g, "_"); }
  // A read can fail transiently (weak venue signal, a phone hopping from
  // Wi-Fi to cellular, a brief disconnect). Previously one dropped read was
  // silently turned into an empty result, so a guide would see "No runs
  // assigned to you" when the truth was "couldn't reach the database".
  // Now: retry with backoff, and flag a genuine failure so screens can show
  // "couldn't load, tap to retry" instead of a misleading empty state.
  let lastReadFailed = false;
  async function getJSON(key, fallback, attempts = 4) {
    let lastErr = null;
    for (let i = 0; i < attempts; i++) {
      try {
        const snap = await fbDb.ref(safeKey(key)).once("value");
        if (!snap.exists()) return fallback;
        const raw = snap.val();
        return typeof raw === "string" ? JSON.parse(raw) : fallback;
      } catch (e) {
        lastErr = e;
        if (i < attempts - 1) await new Promise(r => setTimeout(r, 300 * (i + 1) + Math.random() * 300));
      }
    }
    console.error("storage get failed after " + attempts + " attempts", key, lastErr);
    lastReadFailed = true;
    return fallback;
  }
  async function setJSON(key, val) {
    try { await fbDb.ref(safeKey(key)).set(JSON.stringify(val)); return true; }
    catch (e) { console.error("storage set failed", key, e); showToast("\u26a0\ufe0f Couldn't save \u2014 check your Firebase config"); return false; }
  }
  async function deleteKey(key) {
    try { await fbDb.ref(safeKey(key)).remove(); return true; }

  // ---------- URGENT LOAD REDUCTION (live event) ----------
  // The list views were pulling every run in the event, each with its full
  // passenger manifest, on every open and every refresh. Across ~68 runs
  // that is thousands of passenger records per view, per device, per poll —
  // which is what makes these screens slow or blank out under load.
  // Run IDs encode their date (C-MMDD-...), so we can narrow the fetch
  // BEFORE reading any run. Default: today and tomorrow only.
  function runIdDateMMDD(runId) {
    const m = String(runId || "").match(/^C-(\d{2})(\d{2})/);
    return m ? { month: parseInt(m[1], 10), day: parseInt(m[2], 10) } : null;
  }
  function activeRunIdSet() {
    const now = new Date();
    const keep = new Set();
    for (let offset = 0; offset <= 1; offset++) {   // today + tomorrow
      const d = new Date(now.getTime() + offset * 86400000);
      keep.add((d.getMonth() + 1) + "-" + d.getDate());
    }
    return keep;
  }
  function scopedIndexEntries() {
    if (state.loadAllDays) return state.runIndex;
    const keep = activeRunIdSet();
    const scoped = state.runIndex.filter(r => {
      const d = runIdDateMMDD(r.runId);
      if (!d) return true;                    // unparseable ID: never hide it
      return keep.has(d.month + "-" + d.day);
    });
    // If nothing matches (wrong dates, or the event is over), fall back to
    // everything rather than showing an empty app.
    return scoped.length ? scoped : state.runIndex;
  }
  // Resilient by design: Promise.all rejects the WHOLE batch if any single
  // read fails, which under load meant one dropped connection blanked the
  // entire Dashboard / Courtesy Flow / Help Desk screen. Each run is now
  // caught individually so a partial result still renders.
  let lastScopedLoadMissing = 0;
  async function loadScopedRuns() {
    const entries = scopedIndexEntries();
    lastScopedLoadMissing = 0;
    if (!entries.length) return [];
    const settled = await Promise.all(entries.map(async e => {
      try { return await loadRun(e.runId); }
      catch (err) { console.error("run load failed", e.runId, err); return null; }
    }));
    const ok = settled.filter(Boolean);
    lastScopedLoadMissing = entries.length - ok.length;
    return ok;
  }


  async function loadRun(runId) { return await getJSON("run-" + runId, null); }
  async function saveRun(run) { run.updatedAt = Date.now(); await setJSON("run-" + run.runId, run); scheduleSync(run); }

  // Safe concurrent-write helper — backed by Firebase's native transaction()
  // instead of client-side check-and-retry. Firebase hands our function the
  // CURRENT server value at the moment it actually commits, and automatically
  // re-runs us if another guide's write landed first — so there is no gap at
  // all where two simultaneous writers can silently clobber each other. This
  // is enforced by the database itself, not guessed at by the app.
  async function mutateRun(runId, mutateFn) {
    const key = safeKey("run-" + runId);
    return new Promise((resolve) => {
      fbDb.ref(key).transaction(
        (currentRaw) => {
          if (currentRaw === null || currentRaw === undefined) return currentRaw; // run doesn't exist — abort, nothing to mutate
          let run;
          try { run = JSON.parse(currentRaw); } catch (e) { return currentRaw; } // corrupt value — abort rather than guess
          mutateFn(run);
          run.updatedAt = Date.now();
          return JSON.stringify(run);
        },
        (error, committed, snapshot) => {
          if (error) {
            console.error("mutateRun transaction failed", runId, error);
            showToast("\u26a0\ufe0f Couldn't save that change \u2014 please try again.");
            resolve(null);
            return;
          }
          if (!committed) { resolve(null); return; }
          const finalRaw = snapshot ? snapshot.val() : null;
          let finalRun = null;
          try { finalRun = finalRaw ? JSON.parse(finalRaw) : null; } catch (e) { finalRun = null; }
          if (finalRun) scheduleSync(finalRun);
          resolve(finalRun);
        },
        false // don't apply an optimistic local guess before the server confirms — avoids showing a state that might get rejected
      );
    });
  }
  // Same transaction-based safety as mutateRun, but for the shared run-index
  // list itself. This is the ONLY thing allowed to write run-index — Firebase
  // hands mutateFn the CURRENT server value at commit time, so a stale
  // in-memory copy (e.g. state.runIndex still [] right after a fresh page
  // load) can never overwrite runs that already exist in the database.
  async function mutateRunIndex(mutateFn) {
    const key = safeKey("run-index");
    return new Promise((resolve) => {
      fbDb.ref(key).transaction(
        (currentRaw) => {
          let idx;
          try { idx = currentRaw ? JSON.parse(currentRaw) : []; } catch (e) { idx = []; }
          mutateFn(idx);
          return JSON.stringify(idx);
        },
        (error, committed, snapshot) => {
          if (error) {
            console.error("mutateRunIndex transaction failed", error);
            showToast("\u26a0\ufe0f Couldn't save that change \u2014 please try again.");
            resolve(null);
            return;
          }
          if (!committed) { resolve(null); return; }
          const finalRaw = snapshot ? snapshot.val() : null;
          let finalIdx = [];
          try { finalIdx = finalRaw ? JSON.parse(finalRaw) : []; } catch (e) { finalIdx = []; }
          state.runIndex = finalIdx;
          resolve(finalIdx);
        },
        false
      );
    });
  }

  function scheduleSync(run) {

  async function syncToSheet(run) {
    const url = await loadWebhookUrl();
    if (!url) return;
    const boarded = totalBoarded(run);
    const total = run.manifest.length;
    const payload = {
      runId: run.runId, status: aggregateStatus(run), boarded, total,
      origin: run.origin || "", destination: run.destination || "",
      busCompany: run.busCompany || "",
      catering: run.catering ? "Yes" : "No",
      buses: run.buses.map(b => ({
        num: b.num, guideName: b.guideName || "", status: b.status,
        pax: busBoardedCount(run, b.num),
        eta: b.eta ? new Date(b.eta).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "",
      })),
    };
    try {
      await fetch(url, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) });
    } catch (e) { console.error("sheet sync failed", e); }
  }

  function aggregateStatus(run) {

  // ---------- Geocoding: turn Origin/Destination/Staging text into map coordinates ----------
  // Uses OpenStreetMap's free Nominatim service, cached in shared storage so each
  // location is only ever looked up once across everyone using the app.
  let geocodeQueue = Promise.resolve();
  async function geocodeLocation(query) {
    const q = (query || "").trim();
    if (!q) return null;
    const cache = await getJSON("geocode-cache", {});
    const key = q.toLowerCase();
    if (cache[key] !== undefined) return cache[key];
    // throttle to be a good citizen of the free geocoding service (~1 req/sec)
    const result = await (geocodeQueue = geocodeQueue.then(async () => {
      try {
        await new Promise(r => setTimeout(r, 1100));
        const resp = await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" + encodeURIComponent(q));
        const data = await resp.json();
        if (data && data[0]) return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
        return null;
      } catch (e) { console.warn("geocode failed", q, e); return null; }
    }));
    const freshCache = await getJSON("geocode-cache", {});
    freshCache[key] = result;
    await setJSON("geocode-cache", freshCache);
    return result;
  }
  async function updateRunIndexEntry(runId, patch) {
    await mutateRunIndex(idx => {
      const i = idx.findIndex(r => r.runId === runId);
      if (i >= 0) idx[i] = { ...idx[i], ...patch };
    });
  }
  function timeAgo(ts) {
    if (!ts) return "never";
    const s = Math.floor((Date.now() - ts) / 1000);
    if (s < 60) return s + "s ago";
    if (s < 3600) return Math.floor(s / 60) + "m ago";
    return Math.floor(s / 3600) + "h ago";
  }

  // Shared between a fresh PIN login and a remembered (within-session) return,
  // so both paths land the guide in exactly the same place: resume an active
  // bus if they have one, otherwise their run list.
  async function proceedToGuideHome(match) {
    if (match.lastRunId && match.lastBusNum) {
      const run = await loadRun(match.lastRunId);
      const bus = run && run.buses.find(b => b.num === match.lastBusNum);
      if (run && bus) {
        state.currentRun = run;
        state.guideBus = match.lastBusNum;
        go("guide-manifest");
        startPolling(async () => {
          if (state.view !== "guide-manifest") return;
          const latest = await loadRun(run.runId);
          if (latest) { state.currentRun = latest; refreshManifestLive(); }
        }, 4000);
        startEtaWatcher();
        return;
      }
    }
    await loadIndex();
    state.guideBus = null;

        return;
      }
      const myEntries = state.runIndex.filter(r => r.assignedGuides && r.assignedGuides.includes(state.guideName));
      holder.innerHTML = "";
      if (!myEntries.length) {
        holder.innerHTML = `<div class="empty-state"><div class="big">\u{1F68C}</div>No runs assigned to you yet.<br/>Ask your coordinator to assign you to a bus.</div>`;
        return;
      }
      // Load each run independently. One failed read (a dropped connection
      // under load) must not take down the whole screen — better to show the
      // runs that did load than a blank page.
      const settled = await Promise.all(myEntries.map(async e => {
        try { return await loadRun(e.runId); } catch (err) { console.error("run load failed", e.runId, err); return null; }
      }));
      const fullRuns = settled.filter(Boolean);
      if (fullRuns.length && fullRuns.length < myEntries.length) {
        const warn = document.createElement("div");
        warn.className = "banner";
        warn.style.cssText = "border-left-color:var(--status-amber); background:var(--status-amber-dim); color:var(--status-amber);";
        warn.textContent = `${myEntries.length - fullRuns.length} of your run(s) couldn't load just now \u2014 pull down to retry. The rest are below.`;
        holder.appendChild(warn);
      }
      if (!fullRuns.length) {
        holder.innerHTML = `<div class="empty-state"><div class="big">\u{1F68C}</div>No runs assigned to you yet.<br/>Ask your coordinator to assign you to a bus.</div>`;
        return;
      }

      // Group by date first — a guide working multiple days of the event
      // should see each day's runs separately, not one long mixed list.
      const byDate = {};
      fullRuns.forEach(run => {
        const key = run.date || "";
        if (!byDate[key]) byDate[key] = [];
        byDate[key].push(run);
      });
      const dateKeys = Object.keys(byDate).sort(); // "" (undated) sorts first, then chronological
      const todayStr = new Date().toISOString().slice(0, 10);

      dateKeys.forEach(dateKey => {
        const dateHeading = document.createElement("h2");
        dateHeading.style.cssText = "margin-top:22px; display:flex; align-items:center; gap:8px;";
        dateHeading.textContent = formatDateLabel(dateKey);
        if (dateKey === todayStr) {
          const todayTag = document.createElement("span");
          todayTag.style.cssText = "font-size:10px; font-weight:700; color:#fff; background:var(--brand); padding:2px 8px; border-radius:4px;";
          todayTag.textContent = "TODAY";
          dateHeading.appendChild(todayTag);
        }
        holder.appendChild(dateHeading);

        const dayRuns = byDate[dateKey];
        const active = [], previous = [];
        dayRuns.forEach(run => {
          const myBuses = run.buses.filter(b => b.guideName === state.guideName);
          const allDone = myBuses.length > 0 && myBuses.every(b => b.status === "Completed");
          (allDone ? previous : active).push(run);
        });
        active.sort((a, b) => a.runId.localeCompare(b.runId));
        previous.sort((a, b) => a.runId.localeCompare(b.runId));

        if (active.length) active.forEach(r => holder.appendChild(runCard(r)));
        else holder.innerHTML += `<div class="empty-state" style="padding:12px 0;">Nothing active this day.</div>`;

        if (previous.length) {
          const prevNote = document.createElement("p");
          prevNote.className = "subtitle"; prevNote.style.fontSize = "12px"; prevNote.style.margin = "10px 0 4px";
          prevNote.textContent = "Completed that day:";
          holder.appendChild(prevNote);
          previous.forEach(r => {
            const card = runCard(r);
            card.style.opacity = "0.6";
            holder.appendChild(card);
          });
        }
      });
    })();

    return c;
  }
