  // Excel date/time cells arrive as JS Date objects (cellDates:true), but a
  // hand-typed cell arrives as a plain string — handle both without throwing.
  function parseDateCell(v) {
    if (!v) return "";
    if (v instanceof Date && !isNaN(v)) {
      return v.getFullYear() + "-" + String(v.getMonth() + 1).padStart(2, "0") + "-" + String(v.getDate()).padStart(2, "0");
    }
    return String(v).trim();
  }
  function parseTimeCell(v) {
    if (!v) return "";
    if (v instanceof Date && !isNaN(v)) {
      return String(v.getHours()).padStart(2, "0") + ":" + String(v.getMinutes()).padStart(2, "0");
    }
    return String(v).trim();
  }
  // "2026-09-16" -> "Wed, Sep 16" for the Courtesy Flow day toggle
  function formatDateLabel(dateStr) {
    if (!dateStr) return "Undated";
    const d = new Date(dateStr + "T00:00:00");
    if (isNaN(d)) return dateStr;
    return d.toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" });
  }
  // Meal category from the manifest's Special Needs text. Two categories:
  // "allergy box" = a standard allergen box; "extra special allergy box" =
  // a named box for that guest only, which must be walked to them
  // personally. Matching is deliberately tolerant of case and minor
  // wording differences so a stray capital never silently miscategorises
  // someone's meal.
  function mealCategory(person) {
    const note = String((person && person.specialNeedsNote) || "").toLowerCase();
    if (!person || !person.specialNeeds) return "regular";
    // Named meal for that guest only. Accepts the current wording
    // ("special dietary care") and the older "extra special allergy box"
    // so manifests imported before the rename still categorise correctly.
    if (note.includes("special dietary care") || note.includes("extra special") ||
        note.includes("dietary care")) return "extra";
    // Anything mentioning an allergy/dietary need takes a standard allergen box.
    if (note.includes("allergen") || note.includes("allerg") || note.includes("diet") || note.includes("gluten") ||
        note.includes("vegan") || note.includes("vegetarian") || note.includes("celiac") ||
        note.includes("coeliac") || note.includes("nut") || note.includes("dairy") ||
        note.includes("lactose") || note.includes("halal") || note.includes("kosher") ||
        note.includes("meal") || note.includes("food")) return "allergy";
    // Everything else is a real need but NOT a meal — mobility, assistance,
    // travelling with an infant. Counting these as allergy boxes would both
    // over-order meals and bury the actual need.
    return "other";
  }
  function mealLabel(cat) {
    return cat === "extra" ? "Special Dietary Care Meal" : cat === "allergy" ? "Allergen Meal" : cat === "other" ? "Other need" : "Regular";
  }
  function mealColor(cat) {
    return cat === "extra" ? "var(--brand)" : cat === "allergy" ? "var(--accent)" : cat === "other" ? "var(--status-amber)" : "var(--text-dim)";
  }
  // Guide arrives 45 min before the flight; the bus/staging arrival is 30 min
  // before. Both are shown so the 15-minute head start is unmistakable.
  function minusMinutes(hhmm, mins) {
    if (!hhmm) return "";
    const m = /^(\d{1,2}):(\d{2})/.exec(hhmm);
    if (!m) return "";
    let total = parseInt(m[1], 10) * 60 + parseInt(m[2], 10) - mins;
    while (total < 0) total += 24 * 60;
    const h = Math.floor(total / 60) % 24, mi = total % 60;
    return String(h).padStart(2, "0") + ":" + String(mi).padStart(2, "0");
  }
  function formatPlannedTime(hhmm) {
    if (!hhmm) return "";
    const m = /^(\d{1,2}):(\d{2})/.exec(hhmm);
    if (!m) return hhmm;
    const d = new Date(); d.setHours(parseInt(m[1], 10), parseInt(m[2], 10), 0, 0);
    return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }

  async function handleExcelImport(file, updateExisting) {
    const buf = await file.arrayBuffer();
    const workbook = XLSX.read(buf, { type: "array", cellDates: true });
    const runsSheetName = workbook.SheetNames.find(n => n.trim().toLowerCase() === "runs");
    const manifestSheetName = workbook.SheetNames.find(n => n.trim().toLowerCase() === "manifest");
    if (!runsSheetName) { showToast('No "Runs" tab found \u2014 check against the template'); return; }

    const runsRows = XLSX.utils.sheet_to_json(workbook.Sheets[runsSheetName], { defval: "" });
    const manifestRows = manifestSheetName ? XLSX.utils.sheet_to_json(workbook.Sheets[manifestSheetName], { defval: "" }) : [];
    const roster = await loadRoster();

    const manifestByRun = {};
    manifestRows.forEach(row => {
      const rid = String(row["Run ID"] || "").trim();
      const name = String(row["Passenger Name"] || row["Name"] || "").trim();
      if (!rid || !name) return;
      const specialNeeds = String(row["Special Needs"] || "").trim();
      // Accept the common spellings so the column works whichever header
      // the manifest happens to use.
      const phone = String(row["Mobile"] || row["Mobile Number"] || row["Phone"] ||
                           row["Phone Number"] || row["Guest Mobile"] || "").trim();
      if (!manifestByRun[rid]) manifestByRun[rid] = [];
      manifestByRun[rid].push({ name, specialNeeds, phone });
    });

    let created = 0, skipped = 0, manifestsUpdated = 0, passengersAdded = 0, passengersUpdated = 0, routeDetailsUpdated = 0;
    const newIndexEntries = [];
    let unmatchedGuides = new Set(), unmatchedLocations = new Set();
    for (const row of runsRows) {
      const runId = String(row["Run ID"] || "").trim();
      if (!runId) continue;

      // Parsed once, used whether this run is brand new or already exists —
      // route-level details (never bus status, never boarding) should refresh
      // from the sheet either way.
      const cateringVal = String(row["Catering (Yes/No)"] || row["Catering"] || "").trim().toLowerCase();
      const companyRaw = String(row["Bus Company"] || "").trim();
      const companyMatch = BUS_COMPANIES.find(c => c.toLowerCase() === companyRaw.toLowerCase());
      const originRaw = String(row["Origin"] || "").trim();
      const originMatch = ORIGINS.find(o => o.toLowerCase() === originRaw.toLowerCase());
      const destRaw = String(row["Destination"] || "").trim();
      const destMatch = DESTINATIONS.find(d => d.toLowerCase() === destRaw.toLowerCase());
      if (originRaw && !originMatch) unmatchedLocations.add("Origin: " + originRaw);
      if (destRaw && !destMatch) unmatchedLocations.add("Destination: " + destRaw);
      const routeDetails = {
        description: String(row["Description"] || "").trim(),
        date: parseDateCell(row["Date"]),
        origin: originMatch || originRaw, destination: destMatch || destRaw,
        plannedArrival: parseTimeCell(row["Planned Arrival Time"]) || null,
        // "prepopulated" = tick names off a known list (the default).
        // "build" = the coach loads freely and the guide types names in
        // afterwards, which is how the Friday boat transfers run.
        manifestMode: (function () {
          const v = String(row["Manifest Mode"] || "").trim().toLowerCase();
          return (v === "build" || v === "build manifest") ? "build" : "prepopulated";
        })(),
        // Off unless a run explicitly opts in. Guides can only add names to
        // a pre-populated run when this is on.
        allowWalkUps: ["yes", "y", "true", "1"].includes(
          String(row["Allow Walk-Ups"] || row["Allow Walk Ups"] || "").trim().toLowerCase()),
        flightTime: parseTimeCell(row["Flight Time"]) || null,
        departureTime: parseTimeCell(row["Departure Time"]) || null,
        departurePriority: (function () {
          const v = parseInt(row["Departure Priority"], 10);
          return Number.isFinite(v) ? v : null;
        })(),
        stagingLocation: String(row["Staging Location"] || "").trim(),
        busCompany: companyMatch || companyRaw,
        catering: ["yes", "y", "true"].includes(cateringVal),
        cateringDetails: String(row["Catering Details"] || "").trim(),
        procedureBefore: String(row["Procedure - Beginning of Run"] || "").trim(),
        announceBefore: String(row["Announcement - Beginning of Run"] || "").trim(),
        procedureDuring: String(row["Procedure - During Run"] || "").trim(),
        announceDuring: String(row["Announcement - During Run"] || "").trim(),
        procedureArrival: String(row["Procedure - Upon Arrival"] || "").trim(),
        announceArrival: String(row["Announcement - Upon Arrival"] || "").trim(),
      };

      if (state.runIndex.some(r => r.runId === runId)) {
        if (!updateExisting) { skipped++; continue; }
        // Update mode: refresh route-level details (description, date, origin,
        // destination, planned arrival, staging, catering, procedures, scripts)
        // from the sheet, and merge new/changed passengers into the manifest by
        // name match. Never touch each bus's live status, guide assignment,
        // departure/completion timestamps, or a manifest entry's boarded state —
        // a bulk re-import should only ever refresh planning details, never
        // disturb anything that's actually happening live.
        const people = manifestByRun[runId] || [];
        let added = 0, updated = 0;
        const result = await mutateRun(runId, (fresh) => {
          added = 0; updated = 0; // reset on every transaction attempt, including retries
          Object.assign(fresh, routeDetails);
          people.forEach(p => {
            const existing = fresh.manifest.find(m => m.name.toLowerCase() === p.name.toLowerCase());
            if (existing) {
              const newFlag = !!p.specialNeeds;
              const newNote = p.specialNeeds || "";
              const newPhone = p.phone || "";
              if (existing.specialNeeds !== newFlag || existing.specialNeedsNote !== newNote ||
                  (newPhone && (existing.phone || "") !== newPhone)) {
                existing.specialNeeds = newFlag; existing.specialNeedsNote = newNote;
                // only overwrite a stored number when the sheet actually has one
                if (newPhone) existing.phone = newPhone;
                updated++;
              }
            } else {
              fresh.manifest.push({
                id: runId + "-imp-" + Date.now() + "-" + added, name: p.name, boarded: false, busNum: null, boardedAt: null,
                specialNeeds: !!p.specialNeeds, specialNeedsNote: p.specialNeeds || "", phone: p.phone || "",
              });
              added++;
            }
          });
        });
        if (result) { routeDetailsUpdated++; manifestsUpdated++; passengersAdded += added; passengersUpdated += updated; }
        continue;
      }
      const numBuses = Math.max(1, Math.min(MAX_BUSES, parseInt(row["Number of Buses"], 10) || 1));
      const people = manifestByRun[runId] || [];
      const manifest = people.map((p, i) => ({
        id: runId + "-" + i, name: p.name, boarded: false, busNum: null, boardedAt: null,
        specialNeeds: !!p.specialNeeds, specialNeedsNote: p.specialNeeds || "", phone: p.phone || "",
      }));
      // Any guide named beyond the coach count is kept as an extra rather
      // than silently dropped — these are real people rostered to the run.
      const extraGuides = [];
      for (let gi = numBuses; gi < MAX_BUSES; gi++) {
        const raw = String(row["Bus " + (gi + 1) + " Guide"] || "").trim();
        if (!raw) continue;
        const match = roster.find(g => g.name.toLowerCase() === raw.toLowerCase());
        if (match) extraGuides.push(match.name);
        else { unmatchedGuides.add(raw); extraGuides.push(raw); }
      }
      const buses = Array.from({ length: numBuses }, (_, i) => {
        const raw = String(row["Bus " + (i + 1) + " Guide"] || "").trim();
        let guideName = "";
        if (raw) {
          const match = roster.find(g => g.name.toLowerCase() === raw.toLowerCase());
          if (match) guideName = match.name;
          else unmatchedGuides.add(raw);
        }
        return {
          num: i + 1, status: "Not Started", guideName, stagingAt: null, departedAt: null, completedAt: null,
          eta: null, etaUpdatedAt: null, loc: null, cateringLoaded: false, cateringLoadedAt: null,
          guideArrived: false, guideArrivedAt: null, busArrived: false, busArrivedAt: null, teamInPlace: false, teamInPlaceAt: null,
          checklistBypassed: false,
        };
      });
      const run = {
        runId, ...routeDetails,
        numBuses, buses, manifest, extraGuides, createdAt: Date.now(),
      };
      await saveRun(run);
      newIndexEntries.push({ runId, description: run.description, numBuses, createdAt: run.createdAt, assignedGuides: computeAssignedGuides(buses, extraGuides) });
      created++;
    }
    // Append to whatever the CURRENT run-index actually is at write time —
    // never trust the in-memory state.runIndex, which may still be empty
    // if this is the first thing the coordinator did after a fresh load.
    if (newIndexEntries.length) {
      await mutateRunIndex(idx => { newIndexEntries.forEach(e => idx.push(e)); });
    }
    showToast(
      created + " run(s) imported" +
      (manifestsUpdated ? ", " + manifestsUpdated + " existing run(s) refreshed (route details + " + passengersAdded + " passenger(s) added, " + passengersUpdated + " changed)" : "") +
      (skipped ? ", " + skipped + " skipped (duplicate ID)" : "") +
      (unmatchedGuides.size ? ", " + unmatchedGuides.size + " guide name(s) not found in roster" : "") +
      (unmatchedLocations.size ? ", " + unmatchedLocations.size + " location(s) didn't match the fixed list" : "")
    );
    state.coordTab = "dashboard";
    go("coord-home");
  }

  async function handleGuideExcelImport(file) {

    const sheetName = workbook.SheetNames.find(n => n.trim().toLowerCase() === "guides") || workbook.SheetNames[0];
    const rows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { defval: "" });

    rows.forEach(row => {
      const name = String(row["Name"] || "").trim();
      if (!name) return;
      const phone = String(row["Phone"] || "").trim();
      const email = String(row["Email"] || "").trim();
      let pin = String(row["PIN (optional)"] || row["PIN"] || "").trim();
      if (pin && !/^\d{4}$/.test(pin)) pin = "";
      if (pin && roster.some(g => g.pin === pin)) pin = "";
      const existingIdx = roster.findIndex(g => g.name.toLowerCase() === name.toLowerCase());
      if (existingIdx >= 0) {
        roster[existingIdx].phone = phone;
        roster[existingIdx].email = email;
        if (pin) roster[existingIdx].pin = pin;
        updated++;
      } else {
        if (!pin) pin = genPin(roster);
        roster.push({ name, phone, email, pin, lastRunId: null, lastBusNum: null });
        added++;
      }
    });
    await saveRoster(roster);
    state.roster = roster;
    showToast(added + " guide(s) added" + (updated ? ", " + updated + " updated" : ""));
  }

    const procArrivalLabel = document.createElement("label"); procArrivalLabel.textContent = "3. Upon arrival \u2014 guide procedure";
    procArrivalLabel.style.marginTop = "16px";
    const procArrivalInput = document.createElement("textarea"); procArrivalInput.placeholder = "e.g. Help unload luggage. Collect trash and dispose of it on site. Mark the drop-off complete.";
    const announceArrivalLabel = document.createElement("label"); announceArrivalLabel.textContent = "3. Upon arrival \u2014 passenger script";
    announceArrivalLabel.style.marginTop = "10px";
    const announceArrivalInput = document.createElement("textarea"); announceArrivalInput.placeholder = "e.g. Please take all belongings. Follow signage to registration.";

    const manifestLabel = document.createElement("label"); manifestLabel.textContent = "Passenger manifest \u2014 one name per line";
    const manifestArea = document.createElement("textarea"); manifestArea.placeholder = "Jane Rider\nJohn Traveler\nAlex Guest\n\u2026";

    const specialNeedsLabel = document.createElement("label"); specialNeedsLabel.textContent = "Special needs / accessibility \u2014 optional";
    const specialNeedsHint = document.createElement("p");
    specialNeedsHint.className = "subtitle"; specialNeedsHint.style.marginTop = "-8px";
    specialNeedsHint.textContent = "One per line, format: Name: note (e.g. \"Jane Rider: Wheelchair access\"). Names must match the manifest above exactly.";
    const specialNeedsArea = document.createElement("textarea"); specialNeedsArea.placeholder = "Jane Rider: Wheelchair access\nAlex Guest: Vegetarian meal\n\u2026";

    [cateringRow, cateringDetailsLabel, cateringDetailsInput,
     announceHeading, announceHint,
     procBeforeLabel, procBeforeInput, announceBeforeLabel, announceBeforeInput,
     procDuringLabel, procDuringInput, announceDuringLabel, announceDuringInput,
     procArrivalLabel, procArrivalInput, announceArrivalLabel, announceArrivalInput,
     manifestLabel, manifestArea,
     specialNeedsLabel, specialNeedsHint, specialNeedsArea].forEach(el => screen.appendChild(el));

    const btnRow = document.createElement("div");
    btnRow.className = "btn-row";
    const cancelBtn = document.createElement("button");
    cancelBtn.className = "btn btn-ghost"; cancelBtn.textContent = "Cancel"; cancelBtn.onclick = () => go("coord-home");
    const createBtn = document.createElement("button");
    createBtn.className = "btn btn-primary"; createBtn.textContent = "Create run";
    createBtn.onclick = async () => {
      const runId = runIdInput.value.trim();
      if (!runId) { showToast("Enter a Run ID"); return; }
      if (state.runIndex.some(r => r.runId === runId)) { showToast("That Run ID already exists"); return; }
      const numBuses = Math.max(1, Math.min(MAX_BUSES, parseInt(busInput.value, 10) || 1));
      const names = manifestArea.value.split("\n").map(n => n.trim()).filter(Boolean);
      const specialNeedsMap = {};
      let unmatchedSpecialNeeds = 0;
      specialNeedsArea.value.split("\n").map(l => l.trim()).filter(Boolean).forEach(line => {
        const idx = line.indexOf(":");
        if (idx === -1) { unmatchedSpecialNeeds++; return; }
        const nameKey = line.slice(0, idx).trim().toLowerCase();
        const note = line.slice(idx + 1).trim();
        specialNeedsMap[nameKey] = note;
      });
      const manifest = names.map((name, i) => {
        const note = specialNeedsMap[name.toLowerCase()];
        return { id: runId + "-" + i, name, boarded: false, busNum: null, boardedAt: null, specialNeeds: !!note, specialNeedsNote: note || "" };
      });
      const matchedCount = Object.keys(specialNeedsMap).filter(k => names.some(n => n.toLowerCase() === k)).length;
      const unmatchedNames = Object.keys(specialNeedsMap).length - matchedCount;
      const guideSelects = Array.from(guideAssignHolder.querySelectorAll("select"));
      const buses = Array.from({ length: numBuses }, (_, i) => {
        const sel = guideSelects.find(s => s.dataset.busIndex === String(i + 1));
        return {
          num: i + 1, status: "Not Started", guideName: sel ? sel.value : "", stagingAt: null, departedAt: null, completedAt: null,
          eta: null, etaUpdatedAt: null, loc: null, cateringLoaded: false, cateringLoadedAt: null,
          guideArrived: false, guideArrivedAt: null, busArrived: false, busArrivedAt: null, teamInPlace: false, teamInPlaceAt: null,
          checklistBypassed: false,
        };
      });
      const run = {
        runId, description: descInput.value.trim(), date: dateInput.value, origin: originInput.value.trim(), destination: destInput.value.trim(),
        plannedArrival: plannedArrivalInput.value || null,
        stagingLocation: stageInput.value.trim(), busCompany: companySelect.value, catering: cateringCheck.checked, cateringDetails: cateringDetailsInput.value.trim(),
        procedureBefore: procBeforeInput.value.trim(), procedureDuring: procDuringInput.value.trim(), procedureArrival: procArrivalInput.value.trim(),
        announceBefore: announceBeforeInput.value.trim(), announceDuring: announceDuringInput.value.trim(), announceArrival: announceArrivalInput.value.trim(),
        numBuses, buses, manifest, createdAt: Date.now(),
      };
      createBtn.disabled = true; createBtn.textContent = "Creating\u2026";
      await saveRun(run);
      // Append to the CURRENT run-index at write time, not the in-memory
      // copy — if this is the very first thing done after a fresh reload,
      // state.runIndex may still be empty and would otherwise wipe every
      // other run's entry out of the index.
      await mutateRunIndex(idx => { idx.push({ runId, description: run.description, numBuses, createdAt: run.createdAt, assignedGuides: computeAssignedGuides(buses) }); });
      let msg = "Run " + runId + " created";
      if (unmatchedNames > 0) msg += " \u2014 " + unmatchedNames + " special needs name(s) didn't match the manifest";
      if (unmatchedSpecialNeeds > 0) msg += " \u2014 " + unmatchedSpecialNeeds + " special needs line(s) missing a colon, skipped";
      showToast(msg);
      state.coordTab = "dashboard";
      go("coord-home");
    };
    btnRow.appendChild(cancelBtn); btnRow.appendChild(createBtn);
    screen.appendChild(btnRow);
    c.appendChild(screen);
    return c;
  }

      // Remove from the CURRENT run-index at write time, not the in-memory
      // copy — same reasoning as run creation: never trust a possibly-stale
      // state.runIndex with a write that replaces the whole list.
      await mutateRunIndex(idx => {
        const i = idx.findIndex(r => r.runId === run.runId);

    function buildExportRow(r) {
      const headers = ["Run ID", "Status", "Origin", "Destination", "Bus Company", "Catering (Y/N)"];
      for (let i = 1; i <= r.numBuses; i++) headers.push("Bus Guide " + i);
      for (let i = 1; i <= r.numBuses; i++) headers.push("Passengers - Bus " + i);
      headers.push("Total Passengers");
      const row = [r.runId, aggregateStatus(r), r.origin || "", r.destination || "", r.busCompany || "", r.catering ? "Yes" : "No"];
      for (let i = 1; i <= r.numBuses; i++) row.push(r.buses.find(b => b.num === i).guideName || "");
      for (let i = 1; i <= r.numBuses; i++) row.push(String(busBoardedCount(r, i)));
      row.push(String(totalBoarded(r)));
      return { headers, row };

    function updateLiveParts() {
      const r = state.currentRun;
      const boarded = totalBoarded(r);

        const cateringText = r.catering ? (b.cateringLoaded ? "Catering loaded" : "Catering not loaded yet") : "";
        const checklist = getChecklistItems(r);
        const checklistDone = checklist.filter(it => b[it.key]).length;
        const checklistComplete = checklistDone === checklist.length;
        const rowBtn = document.createElement("button");
        rowBtn.className = "list-btn bus-detail-row";
        rowBtn.innerHTML = `<div class="bus-detail-left"><div class="bus-detail-num">B${b.num}</div>
            <div><span class="status-pill ${STATUS_CLASS(b.status)}"><span class="sdot"></span>${b.status}</span>
            <span class="status-pill" style="margin-left:6px; background:${checklistComplete ? "var(--green-dim)" : "var(--panel-alt)"}; color:${checklistComplete ? "var(--green)" : "var(--text-dim)"};"><span class="sdot" style="background:${checklistComplete ? "var(--green)" : "var(--text-dim)"};"></span>Checklist ${checklistDone}/${checklist.length}</span>
            <div class="bus-detail-meta">${b.guideName ? esc(b.guideName) : "No guide checked in yet"} \u00b7 ETA ${etaText}${cateringText ? " \u00b7 " + cateringText : ""}</div></div></div>
          <div class="bus-detail-count">${cnt} pax <span class="chev">\u203A</span></div>`;
        rowBtn.onclick = () => { stopPolling(); destroyMap(); state.currentBusNum = b.num; go("coord-bus-detail"); };
        busCard.appendChild(rowBtn);
      });
      busCardHolder.appendChild(busCard);
      const { headers, row } = buildExportRow(r);
      csvHolder.innerHTML = "";
      const csvBox = document.createElement("div"); csvBox.className = "csv-box";
      csvBox.textContent = headers.join("\t") + "\n" + row.join("\t");
      csvHolder.appendChild(csvBox);
      updateMap(r);
    }
    updateLiveParts();
    startPolling(async () => {
      if (state.view !== "coord-run-detail") return;
      const fresh = await loadRun(run.runId);
      if (fresh) { state.currentRun = fresh; updateLiveParts(); }
    }, 60000);
    return c;
  }

  // ---------- Coordinator: single-bus detail (contact + passenger list) ----------
  // ---------- Coordinator: edit manifest mid-run (add / remove passengers) ----------
  function renderCoordManifestEdit() {
    const run = state.currentRun;
    const c = document.createElement("div");
    c.appendChild(topbar(run.runId + " \u00b7 Manifest", () => go("coord-run-detail")));
    const screen = document.createElement("div");
    screen.className = "screen";
    screen.innerHTML = `<h2>Edit Manifest</h2>`;

    const banner = document.createElement("div");
    banner.className = "banner";
    banner.textContent = "Safe to edit any time, even mid-run. Adding names never affects anyone already boarded. Removing an already-boarded passenger asks for confirmation first.";
    screen.appendChild(banner);

    const statsHolder = document.createElement("div");
    screen.appendChild(statsHolder);

    const addHeading = document.createElement("h3");
    addHeading.textContent = "Add passengers";
    screen.appendChild(addHeading);
    const addArea = document.createElement("textarea");
    addArea.placeholder = "One name per line\u2026";
    screen.appendChild(addArea);
    const addBtn = document.createElement("button");
    addBtn.className = "btn btn-primary"; addBtn.style.marginTop = "10px"; addBtn.textContent = "Add to manifest";
    addBtn.onclick = async () => {
      const names = addArea.value.split("\n").map(n => n.trim()).filter(Boolean);
      if (!names.length) { showToast("Enter at least one name"); return; }
      const stamp = Date.now();
      const updated = await mutateRun(run.runId, (fresh) => {
        names.forEach((name, i) => {
          fresh.manifest.push({ id: run.runId + "-add-" + stamp + "-" + i, name, boarded: false, busNum: null, boardedAt: null, specialNeeds: false, specialNeedsNote: "" });
        });
      });
      if (updated) state.currentRun = updated;
      addArea.value = "";
      showToast(names.length + " passenger(s) added");
      renderList();
    };
    screen.appendChild(addBtn);

    const removeHeading = document.createElement("h3");
    removeHeading.textContent = "Remove passengers";
    screen.appendChild(removeHeading);
    const searchInput = document.createElement("input");
    searchInput.type = "text";
    searchInput.placeholder = "Search the manifest to remove someone\u2026";
    screen.appendChild(searchInput);
    const listHolder = document.createElement("div");
    listHolder.style.marginTop = "12px";
    screen.appendChild(listHolder);

    function updateStats() {
      const total = state.currentRun.manifest.length;
      const boarded = totalBoarded(state.currentRun);
      statsHolder.innerHTML = "";
      const strip = document.createElement("div");
      strip.className = "stat-strip";
      strip.innerHTML = `<div class="stat-box"><div class="num">${total}</div><div class="lbl">Total</div></div>
        <div class="stat-box"><div class="num">${boarded}</div><div class="lbl">Boarded</div></div>
        <div class="stat-box"><div class="num">${total - boarded}</div><div class="lbl">Not boarded</div></div>`;
      statsHolder.appendChild(strip);
      // Category totals, so the meal counts you're about to rely on are
      // visible right where you're editing them.
      const cc = { regular: 0, allergy: 0, extra: 0, other: 0 };
      state.currentRun.manifest.forEach(p => cc[mealCategory(p)]++);
      const strip2 = document.createElement("div");
      strip2.className = "stat-strip";
      strip2.style.marginTop = "8px";
      strip2.innerHTML = `<div class="stat-box"><div class="num">${cc.regular}</div><div class="lbl">Regular</div></div>
        <div class="stat-box"><div class="num" style="${cc.allergy ? "color:var(--accent);" : ""}">${cc.allergy}</div><div class="lbl">Allergen Meals</div></div>
        <div class="stat-box"><div class="num" style="${cc.extra ? "color:var(--brand);" : ""}">${cc.extra}</div><div class="lbl">Special Dietary Care</div></div>
        <div class="stat-box"><div class="num" style="${cc.other ? "color:var(--status-amber);" : ""}">${cc.other}</div><div class="lbl">Other need</div></div>`;
      statsHolder.appendChild(strip2);
      const mealNote = document.createElement("p");
      mealNote.className = "subtitle";
      mealNote.style.cssText = "font-size:12px; margin-top:6px;";
      mealNote.textContent = "Meals to order = Allergen Meals + Special Dietary Care Meals. \u201cOther need\u201d is not a meal and is excluded from those counts.";
      statsHolder.appendChild(mealNote);

      // Quick filter \u2014 reviewing 139 names to find the flagged handful is
      // the slow part, so jump straight to the ones that matter.
      const filterRow = document.createElement("div");
      filterRow.style.cssText = "display:flex; gap:5px; margin-top:10px; flex-wrap:wrap;";
      [
        ["all", "All"],
        ["flagged", "Flagged only"],
        ["allergy", "Allergen"],
        ["extra", "Special Dietary"],
        ["other", "Other need"],
      ].forEach(([f, lbl]) => {
        const b = document.createElement("button");
        const on = (state.manifestCatFilter || "all") === f;
        b.style.cssText = "flex:1 1 auto; min-width:66px; padding:6px 5px; font-size:11.5px; font-weight:700; border-radius:7px; cursor:pointer; border:1px solid " +
          (on ? "var(--brand)" : "var(--border)") + ";" + (on ? " background:var(--brand); color:#fff;" : " background:var(--panel-alt); color:var(--text);");
        b.textContent = lbl;
        b.onclick = () => { state.manifestCatFilter = f; updateStats(); renderList(); };
        filterRow.appendChild(b);
      });
      statsHolder.appendChild(filterRow);
    }

    async function removePerson(personId, personName, isBoarded, busNum) {
      if (isBoarded) {
        const ok = confirm(personName + " has already boarded Bus " + busNum + ". Removing them will also remove them from that bus's boarded count. Continue?");
        if (!ok) return;
      } else {
        const ok = confirm("Remove " + personName + " from the manifest?");
        if (!ok) return;
      }
      const updated = await mutateRun(run.runId, (fresh) => {
        fresh.manifest = fresh.manifest.filter(p => p.id !== personId);
      });
      if (updated) state.currentRun = updated;
      showToast(personName + " removed");
      renderList();
    }

    // Set a passenger's category directly rather than guessing from free text.
    // "other" is a real need that must NOT be counted as a meal.
    async function setPersonCategory(personId, cat, customNote) {
      const preset = {
        regular: { flag: false, note: "" },
        allergy: { flag: true, note: "Allergen Meal" },
        extra:   { flag: true, note: "Special Dietary Care Meal" },
        other:   { flag: true, note: customNote || "Assistance required" },
      }[cat];
      if (!preset) return;
      const updated = await mutateRun(run.runId, (fresh) => {
        const person = fresh.manifest.find(p => p.id === personId);
        if (!person) return;
        person.specialNeeds = preset.flag;
        person.specialNeedsNote = preset.note;
      });
      if (updated) state.currentRun = updated;
      updateStats();
      renderList();
    }

    function renderList() {
      const q = searchInput.value.trim().toLowerCase();
      const f = state.manifestCatFilter || "all";
      const list = state.currentRun.manifest
        .filter(p => !q || p.name.toLowerCase().includes(q))
        .filter(p => {
          if (f === "all") return true;
          const cat = mealCategory(p);
          if (f === "flagged") return cat !== "regular";
          return cat === f;
        })
        .slice()
        .sort((a, b) => a.name.localeCompare(b.name));
      listHolder.innerHTML = "";
      if (!list.length) { listHolder.innerHTML = `<div class="empty-state" style="padding:20px 0;">No matches.</div>`; return; }
      list.slice(0, 100).forEach(p => {
        const row = document.createElement("div");
        row.className = "card";
        row.style.cssText = "padding:12px 14px; margin-bottom:8px;";
        const topRow = document.createElement("div");
        topRow.style.cssText = "display:flex; align-items:center; justify-content:space-between;";
        const info = document.createElement("div");
        info.innerHTML = `<div style="font-size:14.5px;">${esc(p.name)}</div>${p.boarded ? `<div style="font-size:11.5px; color:var(--text-dim); margin-top:2px;">Boarded \u2014 Bus ${p.busNum}</div>` : `<div style="font-size:11.5px; color:var(--text-dim); margin-top:2px;">Not yet boarded</div>`}`;
        const delBtn = document.createElement("button");
        delBtn.className = "roster-del"; delBtn.textContent = "\u2715";
        delBtn.onclick = () => removePerson(p.id, p.name, p.boarded, p.busNum);
        topRow.appendChild(info); topRow.appendChild(delBtn);
        row.appendChild(topRow);

        if (p.specialNeeds && p.specialNeedsNote) {
          const cat0 = mealCategory(p);
          const note = document.createElement("div");
          note.style.cssText = "margin-top:8px; font-size:12.5px; padding:6px 10px; border-radius:6px; color:" + mealColor(cat0) +
            "; background:" + (cat0 === "extra" ? "var(--brand-dim)" : cat0 === "other" ? "var(--status-amber-dim)" : "var(--accent-dim)") + ";";
          note.textContent = (cat0 === "other" ? "\u267f " : "\u2b50 ") + p.specialNeedsNote + "  \u00b7  " + mealLabel(cat0);
          row.appendChild(note);
        }
        // Four explicit buttons \u2014 no typing, no guessing which words the
        // parser will pick up. Whatever is chosen here wins.
        const curCat = mealCategory(p);
        const catRow = document.createElement("div");
        catRow.style.cssText = "display:flex; gap:5px; margin-top:10px; flex-wrap:wrap;";
        [
          ["regular", "Regular"],
          ["allergy", "Allergen Meal"],
          ["extra", "Special Dietary"],
          ["other", "Other need"],
        ].forEach(([cat, label]) => {
          const b = document.createElement("button");
          const on = curCat === cat;
          b.style.cssText = "flex:1 1 auto; min-width:78px; padding:7px 6px; font-size:11.5px; font-weight:700; border-radius:7px; cursor:pointer; border:1px solid " +
            (on ? mealColor(cat) : "var(--border)") + ";" +
            (on ? " background:" + mealColor(cat) + "; color:#fff;" : " background:var(--panel-alt); color:var(--text);");
          b.textContent = label;
          b.onclick = () => {
            if (cat === "other") {
              const note = prompt("What's the need? (not a meal \u2014 e.g. Wheelchair access, Limited mobility)", p.specialNeedsNote && curCat === "other" ? p.specialNeedsNote : "Assistance required");
              if (note === null) return;
              setPersonCategory(p.id, "other", note.trim() || "Assistance required");
            } else {
              setPersonCategory(p.id, cat);
            }
          };
          catRow.appendChild(b);
        });
        row.appendChild(catRow);

        listHolder.appendChild(row);
      });
      if (list.length > 100) {
        const more = document.createElement("p");
        more.className = "subtitle"; more.style.fontSize = "12px";
        more.textContent = (list.length - 100) + " more \u2014 narrow your search to see them.";
        listHolder.appendChild(more);
      }
    }
    searchInput.oninput = renderList;

    // ---- Replace this run's manifest from a spreadsheet ----
    // For when a whole coach's passenger list changes: wipe just this run's
    // names and load a fresh list, without touching any other run.
    const replaceHead = document.createElement("h3");
    replaceHead.textContent = "Replace this run's manifest";
    replaceHead.style.marginTop = "18px";
    screen.appendChild(replaceHead);

    const replaceNote = document.createElement("p");
    replaceNote.className = "subtitle";
    replaceNote.style.cssText = "font-size:12.5px; margin-top:-6px;";
    replaceNote.textContent = "Clears every name on THIS run only, then loads the new list. Other runs are untouched. Use the same Manifest columns as the main import \u2014 rows for other Run IDs in the file are ignored.";
    screen.appendChild(replaceNote);

    const replaceFileInput = document.createElement("input");
    replaceFileInput.type = "file";
    replaceFileInput.accept = ".xlsx,.xls,.csv";
    replaceFileInput.style.display = "none";
    screen.appendChild(replaceFileInput);

    const replaceBtn = document.createElement("button");
    replaceBtn.className = "btn btn-secondary";
    replaceBtn.style.marginBottom = "8px";
    replaceBtn.textContent = "\u{1F4E5} Clear & upload new manifest for this run";
    replaceBtn.onclick = () => replaceFileInput.click();
    screen.appendChild(replaceBtn);

    replaceFileInput.onchange = async (e) => {
      const file = e.target.files[0];
      e.target.value = "";
      if (!file) return;
      const boardedNow = totalBoarded(state.currentRun);
      const warn = boardedNow
        ? `This clears all ${state.currentRun.manifest.length} names on ${run.runId}, including ${boardedNow} already boarded, and replaces them with the file's list. Continue?`
        : `This clears all ${state.currentRun.manifest.length} names on ${run.runId} and replaces them with the file's list. Continue?`;
      if (!confirm(warn)) return;

      replaceBtn.disabled = true; replaceBtn.textContent = "Reading file\u2026";
      try {
        const buf = await file.arrayBuffer();
        const workbook = XLSX.read(buf, { type: "array", cellDates: true });
        const mSheet = workbook.Sheets["Manifest"] || workbook.Sheets[workbook.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(mSheet, { defval: "" });
        const people = [];
        rows.forEach(row => {
          const rid = String(row["Run ID"] || "").trim();
          const name = String(row["Passenger Name"] || row["Name"] || "").trim();
          if (!name) return;
          // If the file names Run IDs, take only this run's rows. If it has
          // no Run ID column at all, treat every row as belonging here.
          if (rid && rid.toLowerCase() !== run.runId.toLowerCase()) return;
          people.push({
            name,
            specialNeeds: String(row["Special Needs"] || "").trim(),
            phone: String(row["Mobile"] || row["Mobile Number"] || row["Phone"] ||
                          row["Phone Number"] || row["Guest Mobile"] || "").trim(),
          });
        });

        if (!people.length) {
          showToast("No passengers found for " + run.runId + " in that file");
          replaceBtn.disabled = false; replaceBtn.textContent = "\u{1F4E5} Clear & upload new manifest for this run";
          return;
        }

        const updated = await mutateRun(run.runId, (fresh) => {
          fresh.manifest = people.map((p, i) => ({
            id: run.runId + "-rep-" + Date.now() + "-" + i,
            name: p.name, boarded: false, busNum: null, boardedAt: null,
            specialNeeds: !!p.specialNeeds, specialNeedsNote: p.specialNeeds || "",
            phone: p.phone || "",
          }));
        });
        if (updated) {
          state.currentRun = updated;
          await updateRunIndexEntry(run.runId, {});
          showToast(`Manifest replaced \u2014 ${people.length} passenger(s) loaded`);
          updateStats();
          renderList();
        }
      } catch (err) {
        console.error(err);
        showToast("Couldn't read that file \u2014 check it matches the Manifest template");
      }
      replaceBtn.disabled = false; replaceBtn.textContent = "\u{1F4E5} Clear & upload new manifest for this run";
    };

    const clearBtn = document.createElement("button");
    clearBtn.className = "btn btn-danger";
    clearBtn.style.marginBottom = "18px";
    clearBtn.textContent = "\u{1F5D1}\uFE0F Clear all names on this run";
    clearBtn.onclick = async () => {
      const n = state.currentRun.manifest.length;
      if (!n) { showToast("Manifest is already empty"); return; }
      const boardedNow = totalBoarded(state.currentRun);
      if (!confirm(`Remove all ${n} name(s) from ${run.runId}${boardedNow ? `, including ${boardedNow} already boarded` : ""}? This can't be undone.`)) return;
      const updated = await mutateRun(run.runId, (fresh) => { fresh.manifest = []; });
      if (updated) {
        state.currentRun = updated;
        await updateRunIndexEntry(run.runId, {});
        showToast(`Cleared ${n} name(s) from ${run.runId}`);
        updateStats();
        renderList();
      }
    };
    screen.appendChild(clearBtn);


    updateStats();
    renderList();
    c.appendChild(screen);
    return c;
  }

  // ---------- Copy-ready passenger list ----------
  // For handing a list to the venue team at short notice: plain text, one
  // tap to copy, split per coach or as one list for the whole run.
  function renderManifestExport() {
    const run = state.currentRun;
    const c = document.createElement("div");
    c.appendChild(topbar(run.runId + " \u00b7 Copy list", () => go(state.exportBackView || "coord-run-detail")));
    const screen = document.createElement("div");
    screen.className = "screen";
    screen.innerHTML = `<h2>Copy passenger list</h2>`;

    const sub = document.createElement("p");
    sub.className = "subtitle";
    sub.textContent = "Ready to paste into a message or email. Choose what to include, then copy.";
    screen.appendChild(sub);

    const optWrap = document.createElement("div");
    optWrap.style.cssText = "display:flex; gap:5px; flex-wrap:wrap; margin-bottom:10px;";
    screen.appendChild(optWrap);

    const box = document.createElement("textarea");
    box.readOnly = true;
    box.style.cssText = "width:100%; min-height:300px; font-family:var(--mono); font-size:12.5px; line-height:1.5;";
    screen.appendChild(box);

    const copyBtn = document.createElement("button");
    copyBtn.className = "btn btn-primary";
    copyBtn.style.marginTop = "10px";
    copyBtn.textContent = "\u{1F4CB} Copy to clipboard";
    screen.appendChild(copyBtn);

    const countLine = document.createElement("p");
    countLine.className = "subtitle";
    countLine.style.cssText = "font-size:12px; margin-top:8px;";
    screen.appendChild(countLine);

    function build() {
      const scope = state.exportScope || "boarded";
      const grouping = state.exportGrouping || "bybus";
      const all = run.manifest || [];
      const people = scope === "boarded" ? all.filter(p => p.boarded) : all;

      const lines = [];
      lines.push(run.runId + (run.description ? " \u2014 " + run.description : ""));
      const route = [run.origin, run.destination].filter(Boolean).join(" \u2192 ");
      if (route) lines.push(route);
      if (run.date) lines.push(formatDateLabel(run.date));
      lines.push(scope === "boarded" ? "On board: " + people.length : "Full manifest: " + people.length);
      lines.push("");

      if (grouping === "bybus") {
        const buses = run.buses || [];
        buses.forEach(b => {
          const onThis = people.filter(p => p.busNum === b.num);
          lines.push(`--- Bus ${b.num}${b.guideName ? " \u00b7 " + b.guideName : ""} (${onThis.length}) ---`);
          onThis.slice().sort((x, y) => x.name.localeCompare(y.name)).forEach(p => {
            lines.push(p.name + (p.specialNeeds && p.specialNeedsNote ? "  [" + p.specialNeedsNote + "]" : ""));
          });
          lines.push("");
        });
        const unassigned = people.filter(p => !p.busNum);
        if (unassigned.length) {
          lines.push(`--- Not assigned to a bus (${unassigned.length}) ---`);
          unassigned.slice().sort((x, y) => x.name.localeCompare(y.name)).forEach(p => lines.push(p.name));
          lines.push("");
        }
      } else {
        people.slice().sort((a, b) => a.name.localeCompare(b.name)).forEach(p => {
          lines.push(p.name + (p.specialNeeds && p.specialNeedsNote ? "  [" + p.specialNeedsNote + "]" : ""));
        });
      }

      box.value = lines.join("\n").trim();
      countLine.textContent = `${people.length} name(s) included.`;
    }

    function paintOpts() {
      optWrap.innerHTML = "";
      const groups = [
        { key: "exportScope", val: "boarded", label: "On board only" },
        { key: "exportScope", val: "all", label: "Everyone on the manifest" },
        { key: "exportGrouping", val: "bybus", label: "Split by bus" },
        { key: "exportGrouping", val: "flat", label: "One list" },
      ];
      groups.forEach(g => {
        const cur = state[g.key] || (g.key === "exportScope" ? "boarded" : "bybus");
        const on = cur === g.val;
        const b = document.createElement("button");
        b.style.cssText = "flex:1 1 auto; min-width:104px; padding:7px 6px; font-size:11.5px; font-weight:700; border-radius:7px; cursor:pointer; border:1px solid " +
          (on ? "var(--brand)" : "var(--border)") + ";" + (on ? " background:var(--brand); color:#fff;" : " background:var(--panel-alt); color:var(--text);");
        b.textContent = g.label;
        b.onclick = () => { state[g.key] = g.val; paintOpts(); build(); };
        optWrap.appendChild(b);
      });
    }

    copyBtn.onclick = async () => {
      try {
        await navigator.clipboard.writeText(box.value);
        showToast("Copied to clipboard");
      } catch (e) {
        // Clipboard API needs a secure context; fall back to selecting the
        // text so the guide can long-press and copy manually.
        box.removeAttribute("readonly");
        box.focus(); box.select();
        document.execCommand && document.execCommand("copy");
        box.setAttribute("readonly", "true");
        showToast("Selected \u2014 press copy on your keyboard");
      }
    };

    paintOpts();
    build();
    c.appendChild(screen);
    return c;
  }

  // ---------- Coordinator: compare a server PDF against the app manifest ----------
  // Reads the Transport Passengers List PDF, pulls out the passenger names,
  // and diffs them against this run's manifest so discrepancies surface in
  // one pass instead of being eyeballed line by line.
  function parsePdfPassengers(text) {
    // "Mr Charles Arnot (41) +1 604-316-8253 Abbotsford - CA"
    // Title, then the name, then the age in brackets. Lines sometimes run
    // together across page breaks ("...CAMr Reaghan Dormer (13)"), so this
    // scans the whole blob rather than going line by line.
    const re = /(?:Mr|Mrs|Miss|Ms|Dr|Master|Mstr)\.?\s+([A-Za-z\u00C0-\u024F'’\-\.]+(?:\s+[A-Za-z\u00C0-\u024F'’\-\.]+)*?)\s*\((\d{1,3})\)/g;
    const out = [];
    let m;
    while ((m = re.exec(text)) !== null) {
      out.push({ name: m.group ? m.group(1) : m[1], age: parseInt(m[2], 10) });
    }
    return out.map(p => ({ name: String(p.name).replace(/\s+/g, " ").trim(), age: p.age }));
  }

  function normName(n) {
    return String(n || "")
      .toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "") // fold accents so Zoë === Zoe
      .replace(/[^a-z\s]/g, "")
      .replace(/\s+/g, " ")
      .trim();
  }

  function renderCoordComparePdf() {
    const run = state.currentRun;
    const c = document.createElement("div");
    c.appendChild(topbar(run.runId + " \u00b7 Compare PDF", () => go("coord-run-detail")));
    const screen = document.createElement("div");
    screen.className = "screen";
    screen.innerHTML = `<h2>Compare PDF to manifest</h2>`;

    const intro = document.createElement("p");
    intro.className = "subtitle";
    intro.textContent = "Upload the Transport Passengers List PDF from the server. Every name is matched against this run's manifest and anything that doesn't line up is listed below.";
    screen.appendChild(intro);

    const fileInput = document.createElement("input");
    fileInput.type = "file"; fileInput.accept = ".pdf"; fileInput.style.display = "none";
    screen.appendChild(fileInput);

    const pickBtn = document.createElement("button");
    pickBtn.className = "btn btn-primary";
    pickBtn.style.marginBottom = "14px";
    pickBtn.textContent = "\u{1F4C4} Choose PDF report";
    pickBtn.onclick = () => fileInput.click();
    screen.appendChild(pickBtn);

    const resultHolder = document.createElement("div");
    screen.appendChild(resultHolder);
    let lastPdfText = "";  // survives re-comparisons after add/remove

    fileInput.onchange = async (e) => {
      const file = e.target.files[0];
      e.target.value = "";
      if (!file) return;
      if (typeof pdfjsLib === "undefined") {
        resultHolder.innerHTML = `<div class="banner" style="border-left-color:var(--accent); background:var(--accent-dim); color:var(--accent);">PDF reader didn't load \u2014 check your connection and reload the app.</div>`;
        return;
      }
      pickBtn.disabled = true; pickBtn.textContent = "Reading PDF\u2026";
      resultHolder.innerHTML = "";
      try {
        pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
        const buf = await file.arrayBuffer();
        const doc = await pdfjsLib.getDocument({ data: buf }).promise;
        let text = "";
        for (let i = 1; i <= doc.numPages; i++) {
          const page = await doc.getPage(i);
          const content = await page.getTextContent();
          text += content.items.map(it => it.str).join(" ") + "\n";
        }
        lastPdfText = text;
        renderComparison(text);
      } catch (err) {
        console.error(err);
        resultHolder.innerHTML = `<div class="banner" style="border-left-color:var(--accent); background:var(--accent-dim); color:var(--accent);">Couldn't read that PDF. Make sure it's the Transport Passengers List report.</div>`;
      }
      pickBtn.disabled = false; pickBtn.textContent = "\u{1F4C4} Choose PDF report";
    };

    function renderComparison(text) {
      const liveRun = state.currentRun || run;
      const pdfPeople = parsePdfPassengers(text);
      const statedTotal = (text.match(/PASSENGERS\s*TOTAL:\s*(\d+)/i) || [])[1];
      const pdfRunId = (text.match(/C-\d{4}-[A-Z0-9]+-[A-Z0-9]+-C\d+/) || [])[0];

      resultHolder.innerHTML = "";

      if (!pdfPeople.length) {
        resultHolder.innerHTML = `<div class="banner" style="border-left-color:var(--accent); background:var(--accent-dim); color:var(--accent);">No passenger names found in that PDF.</div>`;
        return;
      }

      // Warn loudly if the PDF is for a different run than the one open.
      if (pdfRunId && pdfRunId.toLowerCase() !== run.runId.toLowerCase()) {
        const warn = document.createElement("div");
        warn.className = "banner";
        warn.style.cssText = "border-left-color:var(--accent); background:var(--accent-dim); color:var(--accent);";
        warn.textContent = `\u26a0\ufe0f This PDF is for ${pdfRunId}, but you're viewing ${run.runId}. Compare anyway, or go back and open ${pdfRunId}.`;
        resultHolder.appendChild(warn);
      }

      // Count-aware matching: two different people can share a name
      // (the reports do contain e.g. two "Valerie Price"), so compare
      // tallies rather than sets or one would silently vanish.
      const pdfCounts = new Map(), appCounts = new Map();
      pdfPeople.forEach(p => {
        const k = normName(p.name);
        if (!pdfCounts.has(k)) pdfCounts.set(k, { display: p.name, n: 0, ages: [] });
        const e = pdfCounts.get(k); e.n++; if (p.age != null) e.ages.push(p.age);
      });
      (liveRun.manifest || []).forEach(p => {
        const k = normName(p.name);
        if (!appCounts.has(k)) appCounts.set(k, { display: p.name, n: 0, people: [] });
        const e = appCounts.get(k); e.n++; e.people.push(p);
      });

      const missingFromApp = [];  // in PDF, not in app (or fewer in app)
      const extraInApp = [];      // in app, not in PDF (or more in app)
      let matched = 0;

      pdfCounts.forEach((pv, k) => {
        const av = appCounts.get(k);
        const have = av ? av.n : 0;
        matched += Math.min(pv.n, have);
        for (let i = have; i < pv.n; i++) {
          missingFromApp.push({ name: pv.display, age: pv.ages[i] });
        }
      });
      appCounts.forEach((av, k) => {
        const pv = pdfCounts.get(k);
        const want = pv ? pv.n : 0;
        for (let i = want; i < av.n; i++) {
          extraInApp.push(av.people[i]);
        }
      });

      // ---- summary ----
      const summary = document.createElement("div");
      summary.className = "stat-strip";
      summary.style.marginBottom = "6px";
      summary.innerHTML = `<div class="stat-box"><div class="num">${pdfPeople.length}</div><div class="lbl">In PDF</div></div>
        <div class="stat-box"><div class="num">${(liveRun.manifest || []).length}</div><div class="lbl">In app</div></div>
        <div class="stat-box"><div class="num" style="color:var(--green);">${matched}</div><div class="lbl">Matched</div></div>`;
      resultHolder.appendChild(summary);

      const diffStrip = document.createElement("div");
      diffStrip.className = "stat-strip";
      diffStrip.style.marginBottom = "10px";
      diffStrip.innerHTML = `<div class="stat-box" style="${missingFromApp.length ? "border:1px solid var(--accent);" : ""}"><div class="num" style="${missingFromApp.length ? "color:var(--accent);" : ""}">${missingFromApp.length}</div><div class="lbl">Missing from app</div></div>
        <div class="stat-box" style="${extraInApp.length ? "border:1px solid var(--status-amber);" : ""}"><div class="num" style="${extraInApp.length ? "color:var(--status-amber);" : ""}">${extraInApp.length}</div><div class="lbl">Not on PDF</div></div>`;
      resultHolder.appendChild(diffStrip);

      if (statedTotal && parseInt(statedTotal, 10) !== pdfPeople.length) {
        const n = document.createElement("p");
        n.className = "subtitle";
        n.style.cssText = "font-size:12px; color:var(--accent);";
        n.textContent = `Note: the PDF says PASSENGERS TOTAL: ${statedTotal} but ${pdfPeople.length} names were read. Worth a manual check.`;
        resultHolder.appendChild(n);
      }

      if (!missingFromApp.length && !extraInApp.length) {
        const ok = document.createElement("div");
        ok.className = "banner";
        ok.style.cssText = "border-left-color:var(--green); background:var(--green-dim); color:var(--green);";
        ok.textContent = "\u2713 Perfect match \u2014 every name on the PDF is on the manifest, and nothing extra.";
        resultHolder.appendChild(ok);
        return;
      }

      // ---- missing from app ----
      if (missingFromApp.length) {
        const h = document.createElement("h3");
        h.style.marginTop = "14px";
        h.textContent = `On the PDF but not in the app (${missingFromApp.length})`;
        resultHolder.appendChild(h);
        const card = document.createElement("div");
        card.className = "card";
        card.style.cssText = "padding:10px 12px; margin-bottom:8px;";
        missingFromApp.forEach(p => {
          const r = document.createElement("div");
          r.style.cssText = "padding:6px 0; border-bottom:1px solid var(--border); font-size:13.5px;";
          r.textContent = p.name + (p.age != null ? `  (${p.age})` : "");
          card.appendChild(r);
        });
        resultHolder.appendChild(card);

      }

      // ---- extra in app ----
      if (extraInApp.length) {
        const h = document.createElement("h3");
        h.style.marginTop = "14px";
        h.textContent = `In the app but not on the PDF (${extraInApp.length})`;
        resultHolder.appendChild(h);
        const note = document.createElement("p");
        note.className = "subtitle";
        note.style.cssText = "font-size:12px; margin-top:-6px;";
        note.textContent = "Flagged for you to check \u2014 they may be late additions the report predates.";
        resultHolder.appendChild(note);

        const card = document.createElement("div");
        card.className = "card";
        card.style.cssText = "padding:10px 12px; margin-bottom:8px;";
        extraInApp.forEach(p => {
          const r = document.createElement("div");
          r.style.cssText = "padding:6px 0; border-bottom:1px solid var(--border); font-size:13.5px; display:flex; justify-content:space-between; gap:8px;";
          r.innerHTML = `<span>${esc(p.name)}</span>${p.boarded ? `<span style="font-size:11px; font-weight:700; color:var(--green); white-space:nowrap;">BOARDED</span>` : ""}`;
          card.appendChild(r);
        });
        resultHolder.appendChild(card);

      }
    }

    c.appendChild(screen);
    return c;
  }

  // ---------- Coordinator: edit a run's details ----------
  // Everything about a run except its ID and manifest. Changing the coach
  // count is the delicate part: shrinking a run can strand passengers who
  // are already boarded on a coach that's about to disappear, so that case
  // is spelled out and handled rather than silently dropping them.
  function renderCoordEditRun() {
    const run = state.currentRun;
    const c = document.createElement("div");
    c.appendChild(topbar(run.runId + " \u00b7 Edit run", () => go("coord-run-detail")));
    const screen = document.createElement("div");
    screen.className = "screen";
    screen.innerHTML = `<h2>Edit run details</h2>`;

    const banner = document.createElement("div");
    banner.className = "banner";
    banner.textContent = "Safe to edit mid-event. Guides see changes the next time their app refreshes. Boarding and live bus status are never reset by saving here.";
    screen.appendChild(banner);

    function field(labelText, el, hint) {
      const l = document.createElement("label"); l.textContent = labelText;
      screen.appendChild(l); screen.appendChild(el);
      if (hint) {
        const h = document.createElement("p");
        h.className = "subtitle"; h.style.cssText = "margin-top:-8px; font-size:12px;";
        h.textContent = hint;
        screen.appendChild(h);
      }
      return el;
    }
    function textInput(val, ph) {
      const i = document.createElement("input"); i.type = "text"; i.value = val || ""; if (ph) i.placeholder = ph; return i;
    }
    function timeInput(val) {
      const i = document.createElement("input"); i.type = "time"; i.value = val || ""; return i;
    }
    function selectFrom(list, val) {

    })(), "1 = leaves first. Blank for runs that aren't hall departures.");

    const stageInput = field("Staging location", textInput(run.stagingLocation, "e.g. EWR Terminal A - Bus Bay 2"));

    const cateringRow = document.createElement("div");

    const cateringLbl = document.createElement("label");

    let chosenMode = run.manifestMode === "build" ? "build" : "prepopulated";
    const mmWrap = document.createElement("div");
    mmWrap.style.cssText = "display:flex; flex-direction:column; gap:8px; margin-bottom:14px;";
    let paintModes = function () {
      mmWrap.innerHTML = "";
      [
        ["prepopulated", "Pre-populated list", "Names are loaded ahead of time. The guide ticks people off as they board."],
        ["build", "Build manifest", "Coach loads freely with no checking. The guide types in who's aboard after departure."],

            <div style="font-size:12px; color:var(--text-dim); margin-top:2px;">${desc}</div></div>
          </div>`;
        b.onclick = () => { chosenMode = val; paintModes(); };
        mmWrap.appendChild(b);
      });
    };
    // Walk-ups: only meaningful on a pre-populated run, since build runs
    // are nothing but typed-in names. Hidden when build mode is selected.
    let allowWalkUps = !!run.allowWalkUps;
    const wuWrap = document.createElement("div");
    wuWrap.style.cssText = "margin-bottom:14px;";
    function paintWalkUps() {
      wuWrap.innerHTML = "";
      if (chosenMode === "build") {
        const n = document.createElement("p");
        n.className = "subtitle";
        n.style.cssText = "font-size:12px; margin:0;";
        n.textContent = "Build runs always let the guide type names in \u2014 no extra setting needed.";
        wuWrap.appendChild(n);
        return;
      }
      const on = allowWalkUps;
      const b = document.createElement("button");
      b.style.cssText = "all:unset; cursor:pointer; display:block; padding:11px 13px; border-radius:9px; border:1px solid " +
        (on ? "var(--accent)" : "var(--border)") + ";" + (on ? " background:var(--accent-dim);" : " background:var(--panel);");
      b.innerHTML = `<div style="display:flex; align-items:center; gap:9px;">
          <div class="checkbox" style="${on ? "background:var(--accent); border-color:var(--accent); color:#fff;" : ""}">${on ? "\u2713" : ""}</div>
          <div><div style="font-weight:700; font-size:13.5px; color:${on ? "var(--accent)" : "var(--text)"};">Allow walk-ups on this run</div>
          <div style="font-size:12px; color:var(--text-dim); margin-top:2px;">Lets the guide add guests who turn up but aren't on the list. Off by default \u2014 turn on only where extras are expected.</div></div>
        </div>`;
      b.onclick = () => { allowWalkUps = !allowWalkUps; paintWalkUps(); };
      wuWrap.appendChild(b);
    }

    const origPaintModes = paintModes;
    paintModes = function () { origPaintModes(); paintWalkUps(); };

    screen.appendChild(mmWrap);
    screen.appendChild(wuWrap);

    // ---- coach count ----
    const busHead = document.createElement("h3");

    busHead.style.marginTop = "18px";
    screen.appendChild(busHead);

    const busInput = document.createElement("input");
    busInput.type = "number"; busInput.min = "1"; busInput.max = String(MAX_BUSES);
    busInput.value = run.numBuses;
    field("Number of coaches", busInput, `1\u2013${MAX_BUSES}. Adding coaches leaves existing ones untouched.`);

    const warnBox = document.createElement("div");
    warnBox.style.cssText = "display:none; margin-top:-6px; margin-bottom:12px;";
    screen.appendChild(warnBox);

    function checkShrink() {
      const n = Math.max(1, Math.min(MAX_BUSES, parseInt(busInput.value, 10) || 1));
      warnBox.style.display = "none";
      warnBox.innerHTML = "";
      if (n >= run.numBuses) return;
      const losing = run.buses.filter(b => b.num > n);
      const strandedPax = run.manifest.filter(p => p.boarded && p.busNum > n);
      const losingGuides = losing.map(b => b.guideName).filter(Boolean);
      const bits = [];
      bits.push(`Removing coach${losing.length === 1 ? "" : "es"} ${losing.map(b => b.num).join(", ")}.`);
      if (losingGuides.length) bits.push(`${losingGuides.join(", ")} will be unassigned.`);
      if (strandedPax.length) bits.push(`\u26a0\ufe0f ${strandedPax.length} already-boarded passenger${strandedPax.length === 1 ? "" : "s"} will be set back to not boarded.`);
      warnBox.style.display = "block";
      warnBox.innerHTML = `<div class="banner" style="border-left-color:var(--accent); background:var(--accent-dim); color:var(--accent);">${esc(bits.join(" "))}</div>`;

    busInput.oninput = checkShrink;

    // ---- per-coach guide assignment ----
    const guideNote = document.createElement("p");
    guideNote.className = "subtitle";
    guideNote.style.cssText = "font-size:12.5px; margin-bottom:6px;";

    screen.appendChild(guideNote);

    const guideHolder = document.createElement("div");
    screen.appendChild(guideHolder);
    const guideSelects = [];

    (async () => {
      const roster = await loadRoster();
      function renderGuideRows() {
        guideHolder.innerHTML = "";
        guideSelects.length = 0;
        const n = Math.max(1, Math.min(MAX_BUSES, parseInt(busInput.value, 10) || 1));
        for (let i = 0; i < n; i++) {
          const existing = run.buses.find(b => b.num === i + 1);
          const rowWrap = document.createElement("div");
          rowWrap.style.cssText = "display:flex; align-items:center; gap:10px; margin-bottom:8px;";
          const lbl = document.createElement("div");
          lbl.style.cssText = "font-family:var(--mono); font-weight:700; font-size:13px; min-width:34px;";
          lbl.textContent = "B" + (i + 1);
          const sel = document.createElement("select");
          sel.style.flex = "1";
          const blank = document.createElement("option"); blank.value = ""; blank.textContent = "\u2014 no guide \u2014"; sel.appendChild(blank);
          roster.forEach(g => {
            const o = document.createElement("option"); o.value = g.name; o.textContent = g.name; sel.appendChild(o);
          });
          sel.value = existing ? (existing.guideName || "") : "";
          sel.dataset.busNum = String(i + 1);
          guideSelects.push(sel);
          rowWrap.appendChild(lbl); rowWrap.appendChild(sel);
          if (existing) {
            const st = document.createElement("span");
            st.className = "status-pill " + STATUS_CLASS(existing.status);
            st.style.cssText = "font-size:10px; white-space:nowrap;";
            st.innerHTML = `<span class="sdot"></span>${existing.status}`;
            rowWrap.appendChild(st);
          } else {
            const st = document.createElement("span");
            st.style.cssText = "font-size:11px; color:var(--green); white-space:nowrap; font-weight:700;";
            st.textContent = "NEW";
            rowWrap.appendChild(st);
          }
          guideHolder.appendChild(rowWrap);
        }
      }
      renderGuideRows();
      busInput.addEventListener("input", renderGuideRows);
    })();

    // ---- save ----
    const saveBtn = document.createElement("button");
    saveBtn.className = "btn btn-primary";
    saveBtn.style.marginTop = "18px";
    saveBtn.textContent = "Save changes";
    saveBtn.onclick = async () => {
      const n = Math.max(1, Math.min(MAX_BUSES, parseInt(busInput.value, 10) || 1));
      if (n < run.numBuses) {
        const stranded = run.manifest.filter(p => p.boarded && p.busNum > n).length;
        const msg = stranded
          ? `This removes ${run.numBuses - n} coach(es) and will set ${stranded} already-boarded passenger(s) back to not boarded. Continue?`
          : `This removes ${run.numBuses - n} coach(es). Continue?`;
        if (!confirm(msg)) return;
      }
      const guideByBus = {};
      guideSelects.forEach(sel => { guideByBus[parseInt(sel.dataset.busNum, 10)] = sel.value; });

      const patch = {
        description: descInput.value.trim(),
        date: dateInput.value,
        origin: originInput.value,
        destination: destInput.value,
        flightTime: flightInput.value || null,
        departureTime: departInput.value || null,
        departurePriority: (() => { const v = parseInt(prioInput.value, 10); return Number.isFinite(v) ? v : null; })(),
        plannedArrival: arriveInput.value || null,
        stagingLocation: stageInput.value.trim(),
        busCompany: companyInput.value,
        catering: cateringCheck.checked,
        manifestMode: chosenMode,
        allowWalkUps: chosenMode === "build" ? false : allowWalkUps,
      };

      saveBtn.disabled = true; saveBtn.textContent = "Saving\u2026";
      const updated = await mutateRun(run.runId, (fresh) => {
        Object.assign(fresh, patch);
        // Grow: append fresh coaches. Shrink: drop the tail and un-board
        // anyone who was on a coach that no longer exists.
        if (n > fresh.buses.length) {
          for (let i = fresh.buses.length; i < n; i++) {
            fresh.buses.push({
              num: i + 1, status: "Not Started", guideName: "", stagingAt: null, departedAt: null, completedAt: null,
              eta: null, etaUpdatedAt: null, loc: null, cateringLoaded: false, cateringLoadedAt: null,
              guideArrived: false, guideArrivedAt: null, busArrived: false, busArrivedAt: null,
              teamInPlace: false, teamInPlaceAt: null, checklistBypassed: false,
            });
          }
        } else if (n < fresh.buses.length) {
          fresh.buses = fresh.buses.filter(b => b.num <= n);
          fresh.manifest.forEach(p => {
            if (p.boarded && p.busNum > n) { p.boarded = false; p.busNum = null; p.boardedAt = null; }
          });
        }
        fresh.numBuses = n;
        // Guide assignment only \u2014 never touch status, ETA or boarding.
        fresh.buses.forEach(b => {
          if (Object.prototype.hasOwnProperty.call(guideByBus, b.num)) b.guideName = guideByBus[b.num] || "";
        });
      });
      if (!updated) { saveBtn.disabled = false; saveBtn.textContent = "Save changes"; return; }
      await updateRunIndexEntry(run.runId, {
        description: updated.description,
        numBuses: updated.numBuses,
        assignedGuides: computeAssignedGuides(updated.buses, updated.extraGuides),
      });
      state.currentRun = updated;
      showToast("Run updated");
      go("coord-run-detail");
    };
    screen.appendChild(saveBtn);

    c.appendChild(screen);
    return c;
  }

  function renderCoordBusDetail() {
    const run = state.currentRun;
    const busNum = state.currentBusNum;
    const c = document.createElement("div");
    c.appendChild(topbar(run.runId + " \u00b7 Bus " + busNum, () => {
      go("coord-run-detail");
      startPolling(async () => {
        if (state.view !== "coord-run-detail") return;
        const fresh = await loadRun(run.runId);
        if (fresh) { state.currentRun = fresh; }
      }, 60000);
    }));
    const screen = document.createElement("div");
    screen.className = "screen";
    const bodyHolder = document.createElement("div");
    screen.appendChild(bodyHolder);
    c.appendChild(screen);

    async function renderBody() {
      const bus = state.currentRun.buses.find(b => b.num === busNum);
      const roster = await loadRoster();
      const guide = bus.guideName ? roster.find(g => g.name === bus.guideName) : null;
      const riders = state.currentRun.manifest.filter(p => p.boarded && p.busNum === busNum);

      bodyHolder.innerHTML = "";
      const statusRow = document.createElement("div");
      statusRow.style.marginBottom = "14px";
      statusRow.innerHTML = `<span class="status-pill ${STATUS_CLASS(bus.status)}"><span class="sdot"></span>${bus.status}</span>`;
      bodyHolder.appendChild(statusRow);

      const contactCard = document.createElement("div");
      contactCard.className = "card";
      if (!bus.guideName) {
        contactCard.innerHTML = `<div class="empty-state" style="padding:10px 0;">No guide has checked into this bus yet.</div>`;
      } else {
        const phone = guide && guide.phone ? guide.phone : "";
        const email = guide && guide.email ? guide.email : "";
        contactCard.innerHTML = `
          <div class="overview-row" style="padding-top:0;">
            <div class="overview-label">Bus guide</div>
            <div class="overview-value">${esc(bus.guideName)}</div>
          </div>
          <div class="overview-row">
            <div class="overview-label">Phone</div>
            <div class="overview-value">${phone ? `<a href="tel:${esc(phone.replace(/[^+\d]/g, ""))}" style="color:var(--brand); text-decoration:none;">\u{1F4DE} ${esc(phone)}</a>` : "\u2014 not on file"}</div>
          </div>
          <div class="overview-row" style="border-bottom:none; padding-bottom:0;">
            <div class="overview-label">Email</div>
            <div class="overview-value">${email ? `<a href="mailto:${esc(email)}" style="color:var(--brand); text-decoration:none;">\u2709\uFE0F ${esc(email)}</a>` : "\u2014 not on file"}</div>
          </div>`;
        const life360Row = document.createElement("a");
        life360Row.href = "https://www.life360.com/";
        life360Row.target = "_blank"; life360Row.rel = "noopener noreferrer";
        life360Row.style.cssText = "display:block; margin-top:12px; text-align:center; text-decoration:none;";
        life360Row.innerHTML = `<button class="btn btn-secondary" type="button">\u{1F4CD} Open Life360</button>`;
        contactCard.appendChild(life360Row);
      }
      bodyHolder.appendChild(contactCard);

      const checklistHeading = document.createElement("h3");
      checklistHeading.textContent = "Pre-run checklist";
      bodyHolder.appendChild(checklistHeading);
      if (bus.checklistBypassed && !getChecklistItems(run).every(it => bus[it.key])) {
        const bypassNote = document.createElement("div");
        bypassNote.className = "banner";
        bypassNote.style.cssText = "border-left-color:var(--accent); background:var(--accent-dim);";
        bypassNote.textContent = "\u26a0\ufe0f This guide skipped the checklist and proceeded straight to boarding.";
        bodyHolder.appendChild(bypassNote);
      }
      const checklistCard = document.createElement("div");
      checklistCard.className = "card";
      const coordChecklistItems = getChecklistItems(run);
      coordChecklistItems.forEach((item, i) => {
        const done = !!bus[item.key];
        const row = document.createElement("div");
        row.className = "bus-detail-row";
        if (i === coordChecklistItems.length - 1) row.style.borderBottom = "none";
        row.innerHTML = `<div class="bus-detail-left"><div class="checkbox" style="${done ? 'background:var(--green); border-color:var(--green); color:#fff;' : ''}">${done ? "\u2713" : ""}</div>
            <span style="font-size:13.5px; color:${done ? "var(--text)" : "var(--text-dim)"};">${esc(item.short)}</span></div>
          <span style="font-size:11px; color:var(--text-dim); font-family:var(--mono);">${done ? timeAgo(bus[item.key + "At"]) : "pending"}</span>`;
        checklistCard.appendChild(row);

      bodyHolder.appendChild(checklistCard);

      const reassignCard = document.createElement("div");
      reassignCard.className = "card";

      const select = document.createElement("select");

        const updated = await mutateRun(run.runId, (fresh) => {

            row.style.cursor = "default";
            row.innerHTML = `<div class="checkbox">\u2713</div><div class="pax-name">${esc(p.name)}</div>
              <div class="pax-tag">${p.boardedAt ? timeAgo(p.boardedAt) : ""}</div>`;
            list.appendChild(row);
          });
        bodyHolder.appendChild(list);
      }
    }
    renderBody();
    startPolling(async () => {
      if (state.view !== "coord-bus-detail") return;
      const fresh = await loadRun(run.runId);
      if (fresh) { state.currentRun = fresh; renderBody(); }
    }, 60000);
    return c;
  }

  function updateMap(run) {
    if (typeof L === "undefined") return;
    const withLoc = run.buses.filter(b => b.loc);
    if (!mapInstance) {
      const el = document.getElementById("live-map");
      if (!el) return;
      mapInstance = L.map(el, { attributionControl: false }).setView([39.5, -98.35], 4);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 18 }).addTo(mapInstance);
      mapMarkers = {};
    }
    withLoc.forEach(b => {
      const popupHtml = `<b>Bus ${b.num}</b><br/>${esc(b.guideName || "")}<br/>Updated ${timeAgo(b.loc.at)}`;
      if (mapMarkers[b.num]) { mapMarkers[b.num].setLatLng([b.loc.lat, b.loc.lng]); mapMarkers[b.num].setPopupContent(popupHtml); }
      else { mapMarkers[b.num] = L.marker([b.loc.lat, b.loc.lng]).addTo(mapInstance).bindPopup(popupHtml); }
    });
    if (withLoc.length) {
      const bounds = withLoc.map(b => [b.loc.lat, b.loc.lng]);
      if (bounds.length === 1) mapInstance.setView(bounds[0], 13);
      else mapInstance.fitBounds(bounds, { padding: [30, 30] });
    }
  }
  function destroyMap() { if (mapInstance) { mapInstance.remove(); mapInstance = null; mapMarkers = {}; } }

  // Small, self-contained single-marker map used by Courtesy Flow / Help Desk
  // "View live location" toggles. Each call gets a fresh Leaflet instance since
  // the surrounding card is fully rebuilt on every poll/refresh anyway.
  function initMiniMap(containerId, lat, lng, label) {
    if (typeof L === "undefined") return;
    const el = document.getElementById(containerId);
    if (!el) return;
    try {
      const map = L.map(el, { attributionControl: false, zoomControl: false }).setView([lat, lng], 14);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 18 }).addTo(map);
      L.marker([lat, lng]).addTo(map).bindPopup(esc(label)).openPopup();
    } catch (e) { console.warn("mini map init failed", e); }
  }

  // ---------- Coordinator: settings ----------
  function esc(s) {
    return String(s).replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
  }

  function storageBridgeMissing() {
    return typeof fbDb === "undefined" || !FIREBASE_CONFIG || FIREBASE_CONFIG.apiKey === "PASTE_YOUR_API_KEY_HERE";
  }

  function renderStorageWarning() {
    const root = document.getElementById("app-root");
    root.innerHTML = "";
    const screen = document.createElement("div");
    screen.className = "screen";
    screen.style.paddingTop = "60px";
    screen.innerHTML = `
      <div style="font-family: var(--mono); font-size: 11px; letter-spacing: .1em; color: var(--red); text-transform: uppercase; margin-bottom: 14px;">App can't save right now</div>
      <h1 style="color: var(--red);">Firebase isn't configured yet</h1>
      <p class="subtitle" style="margin-bottom: 8px;">This app saves data using Firebase, but the FIREBASE_CONFIG block near the top of index.html still has placeholder values.</p>
      <p class="subtitle" style="margin-bottom: 24px;">Follow Part 1 of the setup guide: create a Firebase project, copy your config, and paste it into index.html in place of the "PASTE_YOUR..." placeholders. Then reload this page.</p>
      <button class="btn btn-secondary" id="retry-storage-btn">I've updated the config \u2014 try again</button>
    `;
    root.appendChild(screen);
    document.getElementById("retry-storage-btn").onclick = () => {
      if (storageBridgeMissing()) { renderStorageWarning(); }
      else { window.__authReady.then(() => render()); }
    };
  }

  if (storageBridgeMissing()) {
    renderStorageWarning();
  } else {
    // Wait for anonymous sign-in before the app tries to read/write anything —
    // the database rules require a signed-in user, so reads attempted
    // before this resolves would just fail.
    window.__authReady.then(() => render());
  }
})();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch((e) => console.warn("SW registration failed", e));
  });
}
</script>
