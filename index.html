        });
        if (notBoarded.length > 300) {
          const more = document.createElement("div");
          more.style.cssText = "padding:6px 0; font-size:12px; color:var(--text-dim);";
          more.textContent = (notBoarded.length - 300) + " more not shown.";
          listBox.appendChild(more);
        }
      }
      container.appendChild(listBox);
    }
  }

  function buildCourtesyContent(runs, roster) {
    roster = roster || [];
    const wrap = document.createElement("div");

    const modeBar = document.createElement("div");
    modeBar.className = "tab-bar"; modeBar.style.marginBottom = "16px";
    [
      { id: "arrival", label: "Arrival to Hall" },
      { id: "departure", label: "Departure from Hall" },
      { id: "search", label: "Search" },
      { id: "dashboard", label: "Dashboard" },
    ].forEach(m => {
      const btn = document.createElement("button");
      btn.className = "tab-btn" + (state.courtesyMode === m.id ? " active" : "");
      btn.textContent = m.label;
      btn.onclick = () => { state.courtesyMode = m.id; state.courtesySelectedDestination = null; state.courtesySelectedDay = null; render(); };
      modeBar.appendChild(btn);
    });
    wrap.appendChild(modeBar);

    // Same live stats the coordinator sees \u2014 the courtesy team is asked
    // "how's it going overall?" as often as anyone.
    if (state.courtesyMode === "dashboard") {
      wrap.appendChild(buildDashboardTab(runs, true));
      return wrap;
    }

    if (state.courtesyMode === "search") {
      wrap.appendChild(buildHelpdeskSearchTab(runs, roster));
      return wrap;
    }

    // Both modes group locations by DESTINATION — "where is this bus headed"
    // is the useful question whether you're asking about arrivals or
    // departures. What differs is the FILTER: Arrival only cares about buses
    // headed to one of the two halls; Departure only cares about buses
    // actually leaving one of the two halls (the courtesy team is based at
    // the hall), but then shows EVERYWHERE those buses go, airports
    // included — "whatever departure destinations are applicable."
    const field = "destination";
    const verb = state.courtesyMode === "departure" ? "heading out" : "arriving";
    const scopedRuns = state.courtesyMode === "arrival"
      ? runs.filter(r => HALL_NAMES.has((r.destination || "").trim()))
      : runs.filter(r => HALL_NAMES.has((r.origin || "").trim()));

    // Day comes FIRST, before any location — pick a day, then see only the
    // locations that actually have buses that day. Same day-selector for
    // both Arrival and Departure.
    const days = Array.from(new Set(scopedRuns.map(r => r.date || ""))).sort();
    if (days.length) {
      const todayStr = new Date().toISOString().slice(0, 10);
      if (!state.courtesySelectedDay || !days.includes(state.courtesySelectedDay)) {
        state.courtesySelectedDay = days.includes(todayStr) ? todayStr : days[0];
      }
    } else {
      state.courtesySelectedDay = null;
    }
    if (days.length > 1) {
      const dayBar = document.createElement("div");
      dayBar.style.cssText = "display:flex; gap:6px; margin-bottom:16px; overflow-x:auto; padding-bottom:2px;";
      days.forEach(day => {
        const dayBtn = document.createElement("button");
        const isSel = day === state.courtesySelectedDay;
        dayBtn.style.cssText = "flex:0 0 auto; padding:8px 14px; font-size:12.5px; font-weight:700; border-radius:20px; border:1px solid var(--border); cursor:pointer; white-space:nowrap;" +
          (isSel ? " background:var(--brand); color:#fff; border-color:var(--brand);" : " background:var(--panel-alt); color:var(--text);");
        dayBtn.textContent = formatDateLabel(day);
        dayBtn.onclick = () => { state.courtesySelectedDay = day; state.courtesySelectedDestination = null; render(); };
        dayBar.appendChild(dayBtn);
      });
      wrap.appendChild(dayBar);
    }

    const dayRuns = state.courtesySelectedDay
      ? scopedRuns.filter(r => (r.date || "") === state.courtesySelectedDay)
      : scopedRuns;
    const groups = groupRunsByLocation(dayRuns, field);
    const locKeys = Object.keys(groups).sort((a, b) => groups[a].label.localeCompare(groups[b].label));

    // Departure skips the by-destination step entirely: the courtesy team is
    // filling coaches in departure order, not picking an airport first. So
    // the day selection drops straight into one flat, ordered list of runs.
    const isFlatDeparture = state.courtesyMode === "departure";

    if (isFlatDeparture || (state.courtesySelectedDestination && groups[state.courtesySelectedDestination])) {
      const g = isFlatDeparture
        ? { label: "", entries: Object.values(groups).flatMap(gr => gr.entries) }
        : groups[state.courtesySelectedDestination];

      if (!isFlatDeparture) {
        const backBtn = document.createElement("button");
        backBtn.className = "link-btn"; backBtn.style.marginBottom = "14px"; backBtn.textContent = "\u2190 All locations";
        backBtn.onclick = () => { state.courtesySelectedDestination = null; render(); };
        wrap.appendChild(backBtn);

        const heading = document.createElement("h2");
        heading.textContent = g.label;
        wrap.appendChild(heading);
      } else {
        const heading = document.createElement("h2");
        heading.textContent = "Departures" + (state.courtesySelectedDay ? " \u2014 " + formatDateLabel(state.courtesySelectedDay) : "");
        wrap.appendChild(heading);
      }

      const sub = document.createElement("p");
      sub.className = "subtitle";
      sub.textContent = isFlatDeparture
        ? "Every coach leaving the halls, in departure order. Load the run marked 1st before the others \u2014 tap a run to see its buses."
        : "Runs arriving here, grouped by run with the full passenger count \u2014 tap a run to see its buses.";
      wrap.appendChild(sub);

      // Grouped by RUN, not by individual bus — a run with 3 buses and 120
      // passengers should read as ONE line ("120 passengers"), with the
      // buses themselves tucked behind a tap so the list stays scannable.
      const byRun = {};
      g.entries.forEach(({ run, bus }) => {
        if (!byRun[run.runId]) byRun[run.runId] = { run, buses: [] };
        byRun[run.runId].buses.push(bus);
      });
      // Sort by whichever ETA is most trustworthy right now: a guide's live
      // ETA once they've actually departed, falling back to the planned
      // time otherwise. Sorting on live ETA alone was the bug here — before
      // any bus departs, every run's live ETA is null, so the list quietly
      // fell back to alphabetical Run ID order instead of chronological.
      function minutesOfDay(ts) {
        if (!ts) return null;
        const d = new Date(ts);
        return d.getHours() * 60 + d.getMinutes();
      }
      function plannedMinutes(hhmm) {
        if (!hhmm) return null;
        const m = /^(\d{1,2}):(\d{2})/.exec(hhmm);
        if (!m) return null;
        return parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
      }
      function effectiveEtaMinutes(entry) {
        const liveTimes = entry.buses.map(bb => minutesOfDay(bb.eta)).filter(v => v !== null);
        if (liveTimes.length) return Math.min(...liveTimes);
        const planned = plannedMinutes(entry.run.plannedArrival);
        return planned !== null ? planned : Infinity;
      }
      const runList = Object.values(byRun).sort((a, b) => {
        const aActive = a.buses.some(bb => bb.status !== "Completed");
        const bActive = b.buses.some(bb => bb.status !== "Completed");
        if (aActive !== bActive) return aActive ? -1 : 1;
        // Departure view is about WHICH BUS LEAVES FIRST, so it follows the
        // assigned departure priority. Arrival view stays ordered by ETA.
        if (state.courtesyMode === "departure") {
          // Group by originating hall first so each hall's 1st, 2nd, 3rd...
          // reads as one clean sequence instead of interleaving two halls.
          const aO = a.run.origin || "", bO = b.run.origin || "";
          if (aO !== bO) return aO.localeCompare(bO);
          const aP = a.run.departurePriority || Infinity;
          const bP = b.run.departurePriority || Infinity;
          if (aP !== bP) return aP - bP;
        }
        const aEta = effectiveEtaMinutes(a);
        const bEta = effectiveEtaMinutes(b);
        if (aEta !== bEta) return aEta - bEta;
        return a.run.runId.localeCompare(b.run.runId);
      });
      if (!runList.length) {
        wrap.innerHTML += `<div class="empty-state">No runs ${state.courtesyMode === "departure" ? "currently departing from" : "currently assigned to"} here${state.courtesySelectedDay ? " on " + formatDateLabel(state.courtesySelectedDay) : ""}.</div>`;
      }
      runList.forEach(({ run, buses }) => {
        const totalPax = run.manifest.length;
        const plannedText = formatPlannedTime(run.plannedArrival);
        const runKey = run.runId;
        const isExpanded = state.expandedRunKeys.has(runKey);
        const isDeparture = state.courtesyMode === "departure";

        // Live ETA across the run's buses: soonest one still moving. Help Desk
        // and Courtesy Flow watch this constantly, so it has to be unmissable
        // and it has to be obvious whether it's live or still just the plan.
        const liveEtas = buses.map(bb => bb.eta).filter(Boolean).sort((x, y) => x - y);
        const liveEtaText = liveEtas.length ? new Date(liveEtas[0]).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : null;
        const anyInRoute = buses.some(bb => bb.status === "In Route");
        const allDone = buses.every(bb => bb.status === "Completed");
        const statusLabel = allDone ? "Arrived" : anyInRoute ? "In route" : buses.some(bb => bb.status === "At Staging") ? "At staging" : "Not started";
        const statusColor = allDone ? "var(--green)" : anyInRoute ? "var(--brand)" : "var(--text-dim)";

        const card = document.createElement("div");
        card.className = "card";
        const headerBtn = document.createElement("button");
        headerBtn.className = "list-btn";
        // Departure order needs to be unmistakable — the courtesy team is
        // deciding which coach to fill first, so it gets its own labelled
        // banner across the top of the card rather than a bare number
        // tucked beside the Run ID.
        const ordinal = (n) => {
          const s2 = ["th", "st", "nd", "rd"], v = n % 100;
          return n + (s2[(v - 20) % 10] || s2[v] || s2[0]);
        };
        // Priority is assigned per hall, so on a flat list the origin has to be
        // named — otherwise two different halls both show a "1st to leave".
        const priorityBanner = (isDeparture && run.departurePriority)
          ? `<div style="display:flex; align-items:center; gap:10px; margin:-2px 0 12px; padding:8px 12px; background:var(--accent); border-radius:8px;">
               <span style="font-size:22px; font-weight:800; color:#fff; line-height:1; white-space:nowrap;">${ordinal(run.departurePriority)}</span>
               <span style="font-size:11px; font-family:var(--mono); letter-spacing:.06em; text-transform:uppercase; color:#fff; opacity:.92; font-weight:700;">out of ${esc(run.origin || "the hall")}</span>
             </div>`
          : (isDeparture
              ? `<div style="margin:-2px 0 12px; padding:8px 12px; background:var(--panel-alt); border:1px dashed var(--border); border-radius:8px; font-size:11.5px; color:var(--text-dim);">No departure order set for this run</div>`
              : "");
        headerBtn.innerHTML = `${priorityBanner}<div class="run-row">
            <div><div class="run-id">${esc(run.runId)}</div><div class="run-desc">${esc(run.description || "")}</div>${
              // With no location drill-down on departures, each card has to
              // say where it's actually going.
              isDeparture ? `<div class="run-desc" style="margin-top:2px; color:var(--brand); font-weight:600;">\u2192 ${esc(run.destination || "")}</div>` : ""
            }</div>
            <div class="chev" style="transform:rotate(${isExpanded ? "90deg" : "0deg"});">\u203A</div>
          </div>
          <div class="stat-strip" style="margin:12px 0 0;">
            <div class="stat-box"><div class="num">${totalPax}</div><div class="lbl">Passengers</div></div>
            <div class="stat-box"><div class="num">${buses.length}</div><div class="lbl">Bus${buses.length === 1 ? "" : "es"}</div></div>
            ${isDeparture
              ? `<div class="stat-box"><div class="num" style="font-size:15px;">${esc(formatPlannedTime(run.departureTime) || "\u2014")}</div><div class="lbl">Departs</div></div>`
              : `<div class="stat-box"><div class="num" style="font-size:15px;">${plannedText || "\u2014"}</div><div class="lbl">Planned ETA</div></div>`}
          </div>
          ${!isDeparture ? `<div style="display:flex; align-items:center; gap:10px; margin-top:10px; padding:10px 12px; border-radius:10px; background:${liveEtaText ? "var(--brand-dim)" : "var(--panel-alt)"}; border:1px solid ${liveEtaText ? "var(--brand)" : "var(--border)"};">
              <div style="flex:1;">
                <div style="font-size:10.5px; font-family:var(--mono); letter-spacing:.05em; text-transform:uppercase; color:var(--text-dim);">Live ETA</div>
                <div style="font-size:22px; font-weight:800; color:${liveEtaText ? "var(--brand)" : "var(--text-dim)"}; line-height:1.15;">${liveEtaText || "Not live yet"}</div>
              </div>
              <div style="text-align:right;">
                <div style="font-size:10.5px; font-family:var(--mono); letter-spacing:.05em; text-transform:uppercase; color:var(--text-dim);">Status</div>
                <div style="font-size:13.5px; font-weight:700; color:${statusColor};">${statusLabel}</div>
              </div>
            </div>` : ""}`;
        headerBtn.onclick = () => {
          if (isExpanded) state.expandedRunKeys.delete(runKey); else state.expandedRunKeys.add(runKey);
          render();
        };
        card.appendChild(headerBtn);

        if (isExpanded) {
          const busList = document.createElement("div");
          busList.style.cssText = "margin-top:10px; padding-top:10px; border-top:1px solid var(--border);";
          buses.forEach(bus => {
            const liveEtaText = bus.eta ? new Date(bus.eta).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : null;
            const guide = bus.guideName ? roster.find(g2 => g2.name === bus.guideName) : null;
            const busRow = document.createElement("div");
            busRow.style.cssText = "padding:10px 0; border-top:1px solid var(--border);";
            busRow.innerHTML = `<div style="display:flex; justify-content:space-between; align-items:center;">
                <span style="font-weight:600; font-size:13.5px;">Bus ${bus.num}${bus.guideName ? " \u00b7 " + esc(bus.guideName) : ""}</span>
                <span class="status-pill ${STATUS_CLASS(bus.status)}"><span class="sdot"></span>${bus.status}</span>
              </div>
              <div style="display:flex; gap:16px; margin-top:6px; font-size:12.5px; color:var(--text-dim);">
                <span>Planned: <b style="color:var(--text);">${plannedText || "\u2014"}</b></span>
                <span>Live: <b style="color:${liveEtaText ? "var(--green)" : "var(--text-dim)"};">${liveEtaText || "Not live yet"}</b></span>
              </div>
              ${bus.guideName ? `<div class="bus-detail-meta" style="margin-top:4px; font-size:12.5px;">${contactLinksHtml(guide)}</div>` : ""}`;
            if (bus.loc) {
              const locKey = run.runId + "-" + bus.num;
              const locBtn = document.createElement("button");
              locBtn.className = "link-btn";
              locBtn.style.cssText = "margin-top:6px; font-size:12px;";
              locBtn.textContent = (state.expandedLocationKeys.has(locKey) ? "\u{1F4CD} Hide live location" : "\u{1F4CD} View live location");
              locBtn.onclick = (e) => {
                e.stopPropagation();
                if (state.expandedLocationKeys.has(locKey)) state.expandedLocationKeys.delete(locKey);
                else state.expandedLocationKeys.add(locKey);
                render();
              };
              busRow.appendChild(locBtn);
              if (state.expandedLocationKeys.has(locKey)) {
                const mapDiv = document.createElement("div");
                mapDiv.id = "mini-map-" + locKey.replace(/[^a-zA-Z0-9]/g, "_");
                mapDiv.style.cssText = "height:160px; border-radius:10px; overflow:hidden; margin-top:8px; border:1px solid var(--border);";
                const staleness = document.createElement("div");
                staleness.style.cssText = "font-size:11px; color:var(--text-dim); margin-top:6px;";
                staleness.textContent = "Last updated " + timeAgo(bus.loc.at);
                busRow.appendChild(mapDiv);
                busRow.appendChild(staleness);
                setTimeout(() => initMiniMap(mapDiv.id, bus.loc.lat, bus.loc.lng, bus.guideName || ("Bus " + bus.num)), 0);
              }
            }
            // Who's actually on this coach. Read-only — the courtesy team is
            // answering "which bus is my family on?", not boarding anyone.
            const paxKey = run.runId + "::bus" + bus.num;
            const onThisBus = (run.manifest || []).filter(p => p.boarded && p.busNum === bus.num);
            const paxOpen = state.expandedBusPaxKeys.has(paxKey);
            const paxBtn = document.createElement("button");
            paxBtn.className = "link-btn";
            paxBtn.style.cssText = "margin-top:6px; font-size:12px; display:block;";
            paxBtn.textContent = (paxOpen ? "\u25B2 Hide" : "\u25BC View") + ` who's on Bus ${bus.num} (${onThisBus.length})`;
            paxBtn.onclick = (e) => {
              e.stopPropagation();
              if (paxOpen) state.expandedBusPaxKeys.delete(paxKey);
              else state.expandedBusPaxKeys.add(paxKey);
              render();
            };
            busRow.appendChild(paxBtn);
            if (paxOpen) {
              const paxBox = document.createElement("div");
              paxBox.style.cssText = "margin-top:6px; background:var(--panel-alt); border-radius:8px; padding:8px 10px; max-height:260px; overflow-y:auto;";
              if (!onThisBus.length) {
                paxBox.innerHTML = `<div style="font-size:12.5px; color:var(--text-dim);">No one has boarded this bus yet.</div>`;
              } else {
                paxBox.innerHTML = onThisBus.slice().sort((x, y) => x.name.localeCompare(y.name)).map(pp => {
                  const cat = mealCategory(pp);
                  return `<div style="display:flex; justify-content:space-between; gap:8px; padding:4px 0; font-size:13px; border-bottom:1px solid var(--border);">
                      <span>${pp.specialNeeds ? "\u2b50 " : ""}${esc(pp.name)}</span>
                      ${cat !== "regular" ? `<span style="font-size:11px; font-weight:700; white-space:nowrap; color:${mealColor(cat)};">${esc(mealLabel(cat))}</span>` : ""}
                    </div>`;
                }).join("");
              }
              busRow.appendChild(paxBox);
            }
            busList.appendChild(busRow);
          });
          card.appendChild(busList);
        }

        if (run.busCompany) {
          const co = document.createElement("div");
          co.className = "bus-detail-meta"; co.style.marginTop = "10px";
          co.textContent = "\u{1F68C} " + run.busCompany;
          card.appendChild(co);
        }
        renderNotBoardedToggle(card, run);
        wrap.appendChild(card);
      });
      return wrap;
    }

    const heading = document.createElement("h2");
    heading.textContent = "Courtesy Flow \u2014 " + (state.courtesyMode === "departure" ? "departures" : "arrivals") + " by location";
    wrap.appendChild(heading);
    const sub = document.createElement("p");
    sub.className = "subtitle";
    sub.textContent = state.courtesyMode === "departure"
      ? "Pick a destination to see every bus heading there."
      : "Pick a location to see every bus arriving there.";
    wrap.appendChild(sub);

    if (!locKeys.length) {
      wrap.innerHTML += `<div class="empty-state"><div class="big">\u{1F3E8}</div>No runs ${state.courtesyMode === "departure" ? "leaving the hall" : "arriving at a hall"}${state.courtesySelectedDay ? " on " + formatDateLabel(state.courtesySelectedDay) : ""}.</div>`;
      return wrap;
    }

    locKeys.forEach(key => {
      const g = groups[key];
      const activeBuses = g.entries.filter(e => e.bus.status !== "Completed");
      const runsHere = Array.from(new Map(g.entries.map(e => [e.run.runId, e.run])).values());
      const totalPaxHere = runsHere.reduce((sum, r) => sum + r.manifest.length, 0);
      const card = document.createElement("div");
      card.className = "card";
      const btn = document.createElement("button");
      btn.className = "list-btn";
      let metaLine = "";
      if (state.courtesyMode === "departure") {
        const notBoardedTotal = runsHere.reduce((sum, r) => sum + r.manifest.filter(p => !p.boarded).length, 0);
        metaLine = `<div class="bus-detail-meta" style="margin-top:8px;">${notBoardedTotal} passenger${notBoardedTotal === 1 ? "" : "s"} still need boarding</div>`;
      } else {
        const nextEta = activeBuses
          .filter(e => e.bus.status === "In Route" && e.bus.eta)
          .map(e => e.bus.eta)
          .sort((a, b) => a - b)[0];
        metaLine = nextEta ? `<div class="bus-detail-meta" style="margin-top:8px;">Next arrival: <b style="color:var(--accent);">${new Date(nextEta).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}</b></div>` : "";
      }
      btn.innerHTML = `<div class="run-row"><div><div class="run-id">${esc(g.label)}</div>
          <div class="run-desc">${totalPaxHere} passenger${totalPaxHere === 1 ? "" : "s"} \u00b7 ${g.entries.length} bus${g.entries.length === 1 ? "" : "es"} total \u00b7 ${activeBuses.length} ${verb}</div></div>
          <div class="chev">\u203A</div></div>
        ${metaLine}`;
      btn.onclick = () => { state.courtesySelectedDestination = key; render(); };
      card.appendChild(btn);
      wrap.appendChild(card);
    });

    return wrap;
  }

  // ---------- Standalone Courtesy Flow role: shared PIN gate ----------
  function renderCourtesyPin() {
    const c = document.createElement("div");
    c.appendChild(topbar("Courtesy Flow", () => go("role-select")));
    const screen = document.createElement("div");
    screen.className = "screen";
    const holder = document.createElement("div");
    screen.appendChild(holder);
    c.appendChild(screen);

    loadCourtesyRoster().then(roster => {
      holder.innerHTML = "";
      if (!roster.length) {
        const h = document.createElement("h2"); h.textContent = "Courtesy Flow isn't set up yet";
        const sub = document.createElement("p"); sub.className = "subtitle";
        sub.textContent = "No one's been added to the Courtesy Flow team yet. Ask your coordinator to add you from Settings, then come back here.";
        holder.appendChild(h); holder.appendChild(sub);
        return;
      }
      const h = document.createElement("h2"); h.textContent = "Enter your PIN";
      const sub = document.createElement("p"); sub.className = "subtitle";
      sub.textContent = "Your coordinator gave you a 4-digit PIN.";
      holder.appendChild(h); holder.appendChild(sub);
      const input = document.createElement("input");
      input.className = "pin-input"; input.type = "text"; input.inputMode = "numeric"; input.maxLength = 4;
      input.autofocus = true;
      input.oninput = e => { input.value = e.target.value.replace(/\D/g, "").slice(0, 4); };
      holder.appendChild(input);
      const btn = document.createElement("button");
      btn.className = "btn btn-primary"; btn.style.marginTop = "16px"; btn.textContent = "Continue";
      btn.onclick = () => {
        const match = roster.find(p => p.pin === input.value);
        if (!match) { showToast("PIN not recognized \u2014 check with your coordinator"); return; }
        state.courtesyName = match.name;
        state.courtesyAuthedAt = Date.now();
        state.welcomeName = match.name;
        state.welcomeNext = () => { state.courtesySelectedDestination = null; state.courtesySelectedDay = null; go("courtesy-home"); };
        go("welcome");
      };
      holder.appendChild(btn);
    });
    return c;
  }

  // ---------- Standalone Courtesy Flow role (shared PIN, no individual login) ----------
  function renderCourtesyHome() {
    const c = document.createElement("div");
    c.appendChild(topbar("Courtesy Flow", () => { stopPolling(); state.courtesySelectedDestination = null; state.courtesySelectedDay = null; go("role-select"); }));
    const screen = document.createElement("div");
    screen.className = "screen";
    const holder = document.createElement("div");
    holder.innerHTML = `<div class="empty-state" style="padding:30px 0;">Loading\u2026</div>`;
    screen.appendChild(holder);
    c.appendChild(screen);

    async function refresh() {
      if (state.view !== "courtesy-home") return;
      await loadIndex();
      const runs = state.runIndex.length
        ? await loadScopedRuns()
        : [];

    startPolling(refresh, 60000);
    return c;
  }

  function contactLinksHtml(guide) {
    const phone = guide && guide.phone ? guide.phone : "";
    const email = guide && guide.email ? guide.email : "";
    const bits = [];
    if (phone) bits.push(`<a href="tel:${esc(phone.replace(/[^+\d]/g, ""))}" style="color:var(--brand); text-decoration:none;">\u{1F4DE} ${esc(phone)}</a>`);
    if (email) bits.push(`<a href="mailto:${esc(email)}" style="color:var(--brand); text-decoration:none;">\u2709\uFE0F ${esc(email)}</a>`);
    return bits.length ? bits.join(" &middot; ") : "No contact info on file";
  }

      { id: "arrivals", label: "Arrivals", icon: "\u{1F697}" },

    });

    screen.appendChild(contentHolder);
    c.appendChild(screen);

    async function refresh() {
      if (state.view !== "helpdesk-home") return;

  // ---------- Help Desk: completed runs, with a read-only record ----------
  // After the event (or later in the day) the desk gets asked "who was on
  // that bus?". This keeps a static, per-bus record of every finished run.
  function buildHelpdeskCompletedTab(runs, roster) {
    const wrap = document.createElement("div");

    const completed = runs.filter(r => aggregateStatus(r) === "Completed");

    const h = document.createElement("h2");
    h.textContent = "Completed runs";
    wrap.appendChild(h);

    const sub = document.createElement("p");
    sub.className = "subtitle";
    sub.textContent = "Finished runs with a record of who travelled on each bus. View only \u2014 nothing here can be changed.";
    wrap.appendChild(sub);

    if (!completed.length) {
      wrap.innerHTML += `<div class="empty-state" style="padding:26px 0;"><div class="big">\u{1F68C}</div>No runs have been completed yet.<br/>They'll appear here once every bus on a run is marked completed.</div>`;
      return wrap;
    }

    const search = document.createElement("input");
    search.type = "search";
    search.placeholder = "Search completed runs or passenger names\u2026";
    search.value = state.hdCompletedQuery || "";
    search.style.cssText = "width:100%; margin-bottom:10px;";
    wrap.appendChild(search);

    const countLine = document.createElement("p");
    countLine.className = "subtitle";
    countLine.style.cssText = "font-size:12px; margin:-4px 0 8px;";
    wrap.appendChild(countLine);

    const listHolder = document.createElement("div");
    wrap.appendChild(listHolder);

    function runSortKeyHd(runId) {
      const id = String(runId || "");
      const dm = id.match(/^C-(\d{4})/);
      const sm = id.match(/C(\d+)\s*$/);
      return { date: dm ? parseInt(dm[1], 10) : 99999, seq: sm ? parseInt(sm[1], 10) : 999999, raw: id };
    }

    function renderList() {
      listHolder.innerHTML = "";
      const q = String(state.hdCompletedQuery || "").trim().toLowerCase();
      const shown = completed.filter(run => {
        if (!q) return true;
        if ([run.runId, run.description, run.origin, run.destination, run.busCompany]
            .filter(Boolean).join(" ").toLowerCase().includes(q)) return true;
        // also match on a passenger's name, so "which bus was X on?" works
        return (run.manifest || []).some(p => p.name.toLowerCase().includes(q));
      }).slice().sort((a, b) => {
        const ka = runSortKeyHd(a.runId), kb = runSortKeyHd(b.runId);
        if (ka.date !== kb.date) return ka.date - kb.date;
        if (ka.seq !== kb.seq) return ka.seq - kb.seq;
        return ka.raw.localeCompare(kb.raw);
      });

      countLine.textContent = q
        ? `${shown.length} of ${completed.length} completed run(s) match`
        : `${completed.length} completed run(s)`;

      if (!shown.length) {
        listHolder.innerHTML = `<div class="empty-state" style="padding:20px 0;">No completed runs match \u201c${esc(state.hdCompletedQuery)}\u201d.</div>`;
        return;
      }

      shown.forEach(run => {
        const isOpen = state.hdOpenCompleted === run.runId;
        const boarded = (run.manifest || []).filter(p => p.boarded);
        const card = document.createElement("div");
        card.className = "card";

        const head = document.createElement("button");
        head.className = "list-btn";
        const lastDone = run.buses.map(b => b.completedAt).filter(Boolean).sort((a, b) => b - a)[0];
        head.innerHTML = `<div class="run-row">
            <div><div class="run-id">${esc(run.runId)}</div>
              <div class="run-desc">${esc(run.description || "")}</div>
              ${run.origin || run.destination ? `<div style="font-size:12px; color:var(--brand); font-weight:600; margin-top:2px;">${esc(run.origin || "")} \u2192 ${esc(run.destination || "")}</div>` : ""}
            </div>
            <div class="chev" style="transform:rotate(${isOpen ? "90deg" : "0deg"});">\u203A</div>
          </div>
          <div class="stat-strip" style="margin:12px 0 0;">
            <div class="stat-box"><div class="num">${boarded.length}</div><div class="lbl">Travelled</div></div>
            <div class="stat-box"><div class="num">${run.buses.length}</div><div class="lbl">Bus${run.buses.length === 1 ? "" : "es"}</div></div>
            <div class="stat-box"><div class="num" style="font-size:14px;">${lastDone ? new Date(lastDone).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "\u2014"}</div><div class="lbl">Finished</div></div>
          </div>`;
        head.onclick = () => {
          state.hdOpenCompleted = isOpen ? null : run.runId;
          renderList();
        };
        card.appendChild(head);

        if (isOpen) {
          // run detail
          const det = document.createElement("div");
          det.style.cssText = "margin-top:12px; padding-top:10px; border-top:1px solid var(--border);";
          const rows = [];
          if (run.date) rows.push(["Date", formatDateLabel(run.date)]);
          if (run.busCompany) rows.push(["Bus company", run.busCompany]);
          if (run.flightTime) rows.push(["Flight time", formatPlannedTime(run.flightTime)]);
          if (run.departureTime) rows.push(["Departed (planned)", formatPlannedTime(run.departureTime)]);
          if (run.plannedArrival) rows.push(["Planned arrival", formatPlannedTime(run.plannedArrival)]);
          const liveEtas = run.buses.map(b => b.eta).filter(Boolean).sort((a, b) => a - b);
          if (liveEtas.length) rows.push(["Last live ETA", new Date(liveEtas[liveEtas.length - 1]).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })]);
          if (run.catering) rows.push(["Catering", run.cateringDetails || "Yes"]);
          det.innerHTML = rows.map(([k, v]) =>
            `<div style="display:flex; justify-content:space-between; gap:10px; padding:5px 0; font-size:13px;">
               <span style="color:var(--text-dim);">${esc(k)}</span><span style="font-weight:600; text-align:right;">${esc(String(v))}</span>
             </div>`).join("");
          card.appendChild(det);

          // meal summary for the run
          const cc = { regular: 0, allergy: 0, extra: 0, other: 0 };
          boarded.forEach(p => cc[mealCategory(p)]++);
          const mealStrip = document.createElement("div");
          mealStrip.className = "stat-strip";
          mealStrip.style.marginTop = "10px";
          mealStrip.innerHTML = `<div class="stat-box"><div class="num">${cc.regular}</div><div class="lbl">Regular</div></div>
            <div class="stat-box"><div class="num" style="${cc.allergy ? "color:var(--accent);" : ""}">${cc.allergy}</div><div class="lbl">Allergen Meals</div></div>
            <div class="stat-box"><div class="num" style="${cc.extra ? "color:var(--brand);" : ""}">${cc.extra}</div><div class="lbl">Special Dietary Care</div></div>
            <div class="stat-box"><div class="num" style="${cc.other ? "color:var(--status-amber);" : ""}">${cc.other}</div><div class="lbl">Other need</div></div>`;
          card.appendChild(mealStrip);

          // per-bus manifests
          run.buses.forEach(b => {
            const onThis = boarded.filter(p => p.busNum === b.num)
              .slice().sort((x, y) => x.name.localeCompare(y.name));
            const busHead = document.createElement("div");
            busHead.style.cssText = "margin-top:14px; margin-bottom:6px; display:flex; justify-content:space-between; align-items:center; gap:8px;";
            busHead.innerHTML = `<span style="font-family:var(--mono); font-weight:700; font-size:13px;">Bus ${b.num}${b.guideName ? " \u00b7 " + esc(b.guideName) : ""}</span>
              <span style="font-size:12px; color:var(--text-dim);">${onThis.length} passenger${onThis.length === 1 ? "" : "s"}</span>`;
            card.appendChild(busHead);

            const listBox = document.createElement("div");
            listBox.style.cssText = "background:var(--panel-alt); border-radius:8px; padding:8px 10px;";
            if (!onThis.length) {
              listBox.innerHTML = `<div style="font-size:12.5px; color:var(--text-dim);">No one recorded on this bus.</div>`;
            } else {
              listBox.innerHTML = onThis.map(p => {
                const cat = mealCategory(p);
                return `<div style="display:flex; justify-content:space-between; gap:8px; padding:4px 0; font-size:13px; border-bottom:1px solid var(--border);">
                    <span>${p.specialNeeds ? "\u2b50 " : ""}${esc(p.name)}</span>
                    ${cat !== "regular" ? `<span style="font-size:11px; font-weight:700; white-space:nowrap; color:${mealColor(cat)};">${esc(mealLabel(cat))}</span>` : ""}
                  </div>`;
              }).join("");
            }
            card.appendChild(listBox);
          });

          // anyone recorded as travelling but not tied to a bus
          const noBus = boarded.filter(p => !p.busNum);
          if (noBus.length) {
            const nh = document.createElement("div");
            nh.style.cssText = "margin-top:14px; margin-bottom:6px; font-family:var(--mono); font-weight:700; font-size:13px; color:var(--status-amber);";
            nh.textContent = `Not assigned to a bus (${noBus.length})`;
            card.appendChild(nh);
            const nb = document.createElement("div");
            nb.style.cssText = "background:var(--status-amber-dim); border-radius:8px; padding:8px 10px;";
            nb.innerHTML = noBus.slice().sort((x, y) => x.name.localeCompare(y.name))
              .map(p => `<div style="padding:4px 0; font-size:13px;">${esc(p.name)}</div>`).join("");
            card.appendChild(nb);
          }

          // did not travel
          const notBoarded = (run.manifest || []).filter(p => !p.boarded);
          if (notBoarded.length) {
            const dh = document.createElement("div");
            dh.style.cssText = "margin-top:14px; margin-bottom:6px; font-family:var(--mono); font-weight:700; font-size:13px; color:var(--text-dim);";
            dh.textContent = `On the manifest but never boarded (${notBoarded.length})`;
            card.appendChild(dh);
            const db = document.createElement("div");
            db.style.cssText = "background:var(--panel-alt); border-radius:8px; padding:8px 10px;";
            db.innerHTML = notBoarded.slice().sort((x, y) => x.name.localeCompare(y.name))
              .map(p => `<div style="padding:4px 0; font-size:13px; color:var(--text-dim);">${esc(p.name)}</div>`).join("");
            card.appendChild(db);
          }

          const copyBtn = document.createElement("button");
          copyBtn.className = "btn btn-secondary";
          copyBtn.style.marginTop = "12px";
          copyBtn.textContent = "\u{1F4CB} Copy this run's list";
          copyBtn.onclick = () => {
            state.currentRun = run;
            state.exportBackView = "helpdesk-home";
            go("manifest-export");
          };
          card.appendChild(copyBtn);
        }

        listHolder.appendChild(card);
      });
    }

    search.oninput = e => { state.hdCompletedQuery = e.target.value; renderList(); };
    renderList();
    setTimeout(() => {
      if (state.hdCompletedQuery) {
        search.focus();
        search.setSelectionRange(search.value.length, search.value.length);
      }
    }, 0);
    return wrap;
  }

  function buildHelpdeskSearchTab(runs, roster) {
    const wrap = document.createElement("div");
    const heading = document.createElement("h2");
    heading.textContent = "Look someone up";
    wrap.appendChild(heading);

    const modeBar = document.createElement("div");
    modeBar.className = "tab-bar"; modeBar.style.marginBottom = "14px";
    const modes = [
      { id: "passenger", label: "Passenger" },
      { id: "guide", label: "Bus Guide" },
      { id: "runid", label: "Run ID" },
    ];
    modes.forEach(m => {
      const btn = document.createElement("button");
      btn.className = "tab-btn" + (state.helpdeskSearchMode === m.id ? " active" : "");
      btn.textContent = m.label;
      btn.onclick = () => { state.helpdeskSearchMode = m.id; state.helpdeskSearchQuery = ""; render(); };
      modeBar.appendChild(btn);
    });
    wrap.appendChild(modeBar);

    const placeholders = {
      passenger: "Passenger name\u2026",
      guide: "Bus guide name\u2026",
      runid: "Run ID, e.g. RUN-001\u2026",
    };
    const searchInput = document.createElement("input");
    searchInput.type = "text";
    searchInput.placeholder = placeholders[state.helpdeskSearchMode];
    searchInput.value = state.helpdeskSearchQuery;
    searchInput.autofocus = true;
    wrap.appendChild(searchInput);

    const results = document.createElement("div");
    results.style.marginTop = "14px";
    wrap.appendChild(results);

    function renderPassengerResults(q) {
      const matches = [];
      runs.forEach(run => {
        run.manifest.forEach(p => {
          if (p.name.toLowerCase().includes(q)) matches.push({ run, person: p });
        });
      });
      if (!matches.length) { results.innerHTML = `<div class="empty-state" style="padding:20px 0;">No passenger matches.</div>`; return; }
      matches.slice(0, 30).forEach(({ run, person }) => {
        const bus = person.boarded ? run.buses.find(b => b.num === person.busNum) : null;
        const guide = bus && bus.guideName ? roster.find(g => g.name === bus.guideName) : null;
        const card = document.createElement("div"); card.className = "card";
        card.innerHTML = `<div class="run-row"><b style="font-size:14.5px;">${esc(person.name)}</b>
            <span class="run-id" style="font-size:12px;">${esc(run.runId)}</span></div>
          <div class="bus-detail-meta" style="margin-top:4px;">
            ${person.boarded
              ? `Boarded &middot; Bus ${person.busNum}${bus && bus.guideName ? " &middot; Guide: " + esc(bus.guideName) : ""}`
              : "Not yet boarded &middot; " + esc(run.description || run.runId)}
          </div>
          ${bus && bus.guideName ? `<div class="bus-detail-meta" style="margin-top:6px;">${contactLinksHtml(guide)}</div>` : ""}`;
        results.appendChild(card);
      });
    }

    function renderGuideResults(q) {
      const matches = roster.filter(g => g.name.toLowerCase().includes(q));
      if (!matches.length) { results.innerHTML = `<div class="empty-state" style="padding:20px 0;">No guide matches.</div>`; return; }
      matches.slice(0, 30).forEach(g => {
        const assignments = [];
        runs.forEach(run => {
          run.buses.forEach(b => {
            if (b.guideName === g.name) assignments.push({ run, bus: b });
          });
        });
        const card = document.createElement("div"); card.className = "card";
        card.innerHTML = `<div class="run-row"><b style="font-size:14.5px;">${esc(g.name)}</b></div>
          <div class="bus-detail-meta" style="margin-top:4px;">${contactLinksHtml(g)}</div>`;
        if (assignments.length) {
          assignments.forEach(({ run, bus }) => {
            const etaText = bus.eta ? new Date(bus.eta).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "\u2014";
            const row = document.createElement("div");
            row.style.cssText = "margin-top:8px; padding-top:8px; border-top:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; gap:8px;";
            row.innerHTML = `<span style="font-size:13px;">${esc(run.runId)} \u00b7 Bus ${bus.num} \u00b7 ETA ${etaText}</span>
              <span class="status-pill ${STATUS_CLASS(bus.status)}"><span class="sdot"></span>${bus.status}</span>`;
            card.appendChild(row);
          });
        } else {
          const none = document.createElement("div");
          none.style.cssText = "margin-top:8px; font-size:12.5px; color:var(--text-dim);";
          none.textContent = "Not currently checked into any bus.";
          card.appendChild(none);
        }
        results.appendChild(card);
      });
    }

    function renderRunIdResults(q) {
      const matches = runs.filter(r => r.runId.toLowerCase().includes(q));
      if (!matches.length) { results.innerHTML = `<div class="empty-state" style="padding:20px 0;">No Run ID matches.</div>`; return; }
      matches.slice(0, 20).forEach(run => {
        const agg = aggregateStatus(run);
        const card = document.createElement("div"); card.className = "card";
        // Help Desk is fielding "where is this bus?" questions live, so the
        // run's planned and live ETA both need to be readable at a glance,
        // not buried in a line of bus detail.
        const hdLiveEtas = run.buses.map(b => b.eta).filter(Boolean).sort((x, y) => x - y);
        const hdLiveText = hdLiveEtas.length ? new Date(hdLiveEtas[0]).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : null;
        const hdPlannedText = formatPlannedTime(run.plannedArrival);
        const hdDepartText = formatPlannedTime(run.departureTime);
        card.innerHTML = `<div class="run-row">
            <div><div class="run-id">${esc(run.runId)}</div><div class="run-desc">${esc(run.description || "")}</div>
              ${run.origin || run.destination ? `<div style="font-size:12px; color:var(--brand); font-weight:600; margin-top:2px;">${esc(run.origin || "")} \u2192 ${esc(run.destination || "")}</div>` : ""}
              ${run.busCompany ? `<div style="font-size:11.5px; color:var(--text-dim); margin-top:2px;">\u{1F68C} ${esc(run.busCompany)}</div>` : ""}</div>
            <span class="status-pill ${STATUS_CLASS(agg)}"><span class="sdot"></span>${agg}</span>
          </div>
          <div style="display:flex; gap:8px; margin-top:12px;">
            <div style="flex:1; padding:10px 12px; border-radius:10px; background:var(--panel-alt); border:1px solid var(--border);">
              <div style="font-size:10.5px; font-family:var(--mono); letter-spacing:.05em; text-transform:uppercase; color:var(--text-dim);">Planned ETA</div>
              <div style="font-size:20px; font-weight:800; color:var(--text); line-height:1.15;">${hdPlannedText || "\u2014"}</div>
            </div>
            <div style="flex:1; padding:10px 12px; border-radius:10px; background:${hdLiveText ? "var(--brand-dim)" : "var(--panel-alt)"}; border:1px solid ${hdLiveText ? "var(--brand)" : "var(--border)"};">
              <div style="font-size:10.5px; font-family:var(--mono); letter-spacing:.05em; text-transform:uppercase; color:var(--text-dim);">Live ETA</div>
              <div style="font-size:20px; font-weight:800; color:${hdLiveText ? "var(--brand)" : "var(--text-dim)"}; line-height:1.15;">${hdLiveText || "Not live yet"}</div>
            </div>
          </div>
          ${hdDepartText ? `<div style="font-size:12px; color:var(--text-dim); margin-top:6px;">Departs ${esc(hdDepartText)}${run.departurePriority ? " \u00b7 departure order #" + run.departurePriority : ""}</div>` : ""}`;
        run.buses.forEach(bus => {
          const etaText = bus.eta ? new Date(bus.eta).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "\u2014";
          const guide = bus.guideName ? roster.find(g => g.name === bus.guideName) : null;
          const row = document.createElement("div");
          row.style.cssText = "margin-top:8px; padding-top:8px; border-top:1px solid var(--border);";
          row.innerHTML = `<div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
              <span style="font-size:13px; font-weight:600;">Bus ${bus.num} \u00b7 ${bus.guideName ? esc(bus.guideName) : "No guide"}</span>
              <span class="status-pill ${STATUS_CLASS(bus.status)}"><span class="sdot"></span>${bus.status}</span>
            </div>
            <div style="display:flex; gap:16px; margin-top:4px; font-size:12.5px; color:var(--text-dim);">
              <span>Planned: <b style="color:var(--text);">${hdPlannedText || "\u2014"}</b></span>
              <span>Live: <b style="color:${bus.eta ? "var(--brand)" : "var(--text-dim)"};">${bus.eta ? etaText : "Not live yet"}</b></span>
            </div>
            ${bus.guideName ? `<div style="font-size:12.5px; color:var(--text-dim); margin-top:4px;">${contactLinksHtml(guide)}</div>` : ""}`;
          card.appendChild(row);
          if (bus.loc) {
            const locKey = "hd-" + run.runId + "-" + bus.num;
            const locBtn = document.createElement("button");
            locBtn.className = "link-btn";
            locBtn.style.cssText = "margin-top:6px; font-size:12.5px;";
            locBtn.textContent = state.expandedLocationKeys.has(locKey) ? "\u{1F4CD} Hide live location" : "\u{1F4CD} View live location";
            locBtn.onclick = () => {
              if (state.expandedLocationKeys.has(locKey)) state.expandedLocationKeys.delete(locKey);
              else state.expandedLocationKeys.add(locKey);
              render();
            };
            row.appendChild(locBtn);
            if (state.expandedLocationKeys.has(locKey)) {
              const mapDiv = document.createElement("div");
              mapDiv.id = "mini-map-" + locKey.replace(/[^a-zA-Z0-9]/g, "_");
              mapDiv.style.cssText = "height:160px; border-radius:10px; overflow:hidden; margin-top:8px; border:1px solid var(--border);";
              row.appendChild(mapDiv);
              const stale = document.createElement("div");
              stale.style.cssText = "font-size:11px; color:var(--text-dim); margin-top:6px;";
              stale.textContent = "Last updated " + timeAgo(bus.loc.at);
              row.appendChild(stale);
              setTimeout(() => initMiniMap(mapDiv.id, bus.loc.lat, bus.loc.lng, bus.guideName || ("Bus " + bus.num)), 0);
            }
          }
        });
        renderNotBoardedToggle(card, run);
        results.appendChild(card);
      });
    }

    function renderResults() {
      const q = state.helpdeskSearchQuery.trim().toLowerCase();
      results.innerHTML = "";
      if (!q) return;
      if (state.helpdeskSearchMode === "passenger") renderPassengerResults(q);
      else if (state.helpdeskSearchMode === "guide") renderGuideResults(q);
      else renderRunIdResults(q);
    }
    searchInput.oninput = e => { state.helpdeskSearchQuery = e.target.value; renderResults(); };
    renderResults();
    return wrap;
  }

  // ---------- Passengers tab: bulk add / remove across many runs ----------
  // Built because moving a family to a different flight meant editing every
  // run they appeared on, one at a time. Here you pick the people once, pick
  // the runs once, and apply in a single action.
  function buildPassengersTab(runs) {
    const wrap = document.createElement("div");

    const modeBar = document.createElement("div");
    modeBar.className = "tab-bar";
    modeBar.style.marginBottom = "14px";
    [
      { id: "remove", label: "Remove from runs" },
      { id: "add", label: "Add to runs" },
    ].forEach(m => {
      const b = document.createElement("button");
      b.className = "tab-btn" + (state.paxToolMode === m.id ? " active" : "");
      b.textContent = m.label;
      b.onclick = () => {
        state.paxToolMode = m.id;
        state.paxSelectedNames = new Set();
        state.paxSelectedRunIds = new Set();
        state.paxToolQuery = "";
        state.paxAddNames = "";
        state.paxAddNeeds = "";
        render();
      };
      modeBar.appendChild(b);
    });
    wrap.appendChild(modeBar);

    // ============ REMOVE MODE ============
    if (state.paxToolMode === "remove") {
      const h = document.createElement("h2");
      h.textContent = "Remove passengers";
      wrap.appendChild(h);
      const sub = document.createElement("p");
      sub.className = "subtitle";
      sub.textContent = "Search a name, tick everyone who's moving, then remove them from whichever runs you choose \u2014 all at once.";
      wrap.appendChild(sub);

      const search = document.createElement("input");
      search.type = "search";
      search.placeholder = "Search passenger names\u2026";
      search.value = state.paxToolQuery;
      search.style.cssText = "width:100%; margin-bottom:10px;";
      wrap.appendChild(search);

      // Build a name -> runs index so a person's whole footprint is visible
      const byName = {};
      runs.forEach(run => {
        (run.manifest || []).forEach(p => {
          const key = p.name.trim().toLowerCase();
          if (!byName[key]) byName[key] = { name: p.name, entries: [] };
          byName[key].entries.push({ run, person: p });
        });
      });

      const q = state.paxToolQuery.trim().toLowerCase();
      const matches = q
        ? Object.values(byName).filter(v => v.name.toLowerCase().includes(q)).slice(0, 60)
        : [];

      const listHolder = document.createElement("div");
      wrap.appendChild(listHolder);

      if (!q) {
        listHolder.innerHTML = `<div class="empty-state" style="padding:20px 0;">Start typing a name to find who to remove.</div>`;
      } else if (!matches.length) {
        listHolder.innerHTML = `<div class="empty-state" style="padding:20px 0;">No passengers match \u201c${esc(state.paxToolQuery)}\u201d.</div>`;
      } else {
        matches.forEach(m => {
          const checked = state.paxSelectedNames.has(m.name);
          const card = document.createElement("div");
          card.className = "card";
          card.style.cssText = "padding:10px 12px; margin-bottom:8px;" + (checked ? " border-color:var(--brand); background:var(--brand-dim);" : "");
          const boardedCount = m.entries.filter(e => e.person.boarded).length;
          card.innerHTML = `<div style="display:flex; align-items:center; gap:10px;">
              <div class="checkbox" style="${checked ? "background:var(--brand); border-color:var(--brand); color:#fff;" : ""}">${checked ? "\u2713" : ""}</div>
              <div style="flex:1;">
                <div style="font-weight:600; font-size:14px;">${esc(m.name)}</div>
                <div style="font-size:12px; color:var(--text-dim);">On ${m.entries.length} run${m.entries.length === 1 ? "" : "s"}${boardedCount ? " \u00b7 already boarded on " + boardedCount : ""}</div>
              </div>
            </div>
            <div style="font-size:11.5px; color:var(--text-dim); margin-top:6px; padding-left:34px;">${m.entries.map(e => esc(e.run.runId)).join(" \u00b7 ")}</div>`;
          card.onclick = () => {
            if (checked) state.paxSelectedNames.delete(m.name);
            else state.paxSelectedNames.add(m.name);
            render();
          };
          listHolder.appendChild(card);
        });
      }

      // Which runs to remove them from
      if (state.paxSelectedNames.size) {
        const affected = [];
        runs.forEach(run => {
          const hits = (run.manifest || []).filter(p => state.paxSelectedNames.has(p.name));
          if (hits.length) affected.push({ run, hits });
        });

        const runHead = document.createElement("h3");
        runHead.style.marginTop = "18px";
        runHead.textContent = `Remove from which runs? (${affected.length} found)`;
        wrap.appendChild(runHead);

        const allBtn = document.createElement("button");
        allBtn.className = "link-btn";
        allBtn.style.marginBottom = "8px";
        const allSelected = affected.length > 0 && affected.every(a => state.paxSelectedRunIds.has(a.run.runId));
        allBtn.textContent = allSelected ? "Clear all runs" : "Select all runs";
        allBtn.onclick = () => {
          if (allSelected) state.paxSelectedRunIds = new Set();
          else affected.forEach(a => state.paxSelectedRunIds.add(a.run.runId));
          render();
        };
        wrap.appendChild(allBtn);

        affected.forEach(({ run, hits }) => {
          const sel = state.paxSelectedRunIds.has(run.runId);
          const row = document.createElement("div");
          row.className = "card";
          row.style.cssText = "padding:10px 12px; margin-bottom:6px; cursor:pointer;" + (sel ? " border-color:var(--accent); background:var(--accent-dim);" : "");
          const boardedHere = hits.filter(p => p.boarded).length;
          row.innerHTML = `<div style="display:flex; align-items:center; gap:10px;">
              <div class="checkbox" style="${sel ? "background:var(--accent); border-color:var(--accent); color:#fff;" : ""}">${sel ? "\u2713" : ""}</div>
              <div style="flex:1;">
                <div style="font-weight:600; font-size:13.5px;">${esc(run.runId)}</div>
                <div style="font-size:12px; color:var(--text-dim);">${esc(run.description || "")}</div>
                <div style="font-size:12px; color:var(--text-dim); margin-top:2px;">${hits.length} of the selected here${boardedHere ? " \u00b7 \u26a0\ufe0f " + boardedHere + " already boarded" : ""}</div>
              </div>
            </div>`;
          row.onclick = () => {
            if (sel) state.paxSelectedRunIds.delete(run.runId);
            else state.paxSelectedRunIds.add(run.runId);
            render();
          };
          wrap.appendChild(row);
        });

        if (state.paxSelectedRunIds.size) {
          const total = affected
            .filter(a => state.paxSelectedRunIds.has(a.run.runId))
            .reduce((n, a) => n + a.hits.length, 0);
          const doBtn = document.createElement("button");
          doBtn.className = "btn btn-danger";
          doBtn.style.marginTop = "14px";
          doBtn.textContent = `Remove ${total} passenger entr${total === 1 ? "y" : "ies"} from ${state.paxSelectedRunIds.size} run${state.paxSelectedRunIds.size === 1 ? "" : "s"}`;
          doBtn.onclick = async () => {
            const names = Array.from(state.paxSelectedNames);
            const runIds = Array.from(state.paxSelectedRunIds);
            if (!confirm(`Remove ${names.length} passenger(s) from ${runIds.length} run(s)? This can't be undone.`)) return;
            doBtn.disabled = true; doBtn.textContent = "Removing\u2026";
            let removed = 0;
            for (const rid of runIds) {
              const updated = await mutateRun(rid, (fresh) => {
                const before = fresh.manifest.length;
                fresh.manifest = fresh.manifest.filter(p => !names.includes(p.name));
                removed += before - fresh.manifest.length;
              });
              if (updated) await updateRunIndexEntry(rid, {});
            }
            state.paxSelectedNames = new Set();
            state.paxSelectedRunIds = new Set();
            showToast(`Removed ${removed} passenger entr${removed === 1 ? "y" : "ies"}`);
            render();
          };
          wrap.appendChild(doBtn);
        }
      }

      search.oninput = e => { state.paxToolQuery = e.target.value; render(); };
      setTimeout(() => { if (state.paxToolQuery) { search.focus(); search.setSelectionRange(search.value.length, search.value.length); } }, 0);
      return wrap;
    }

    // ============ ADD MODE ============
    const h = document.createElement("h2");
    h.textContent = "Add passengers";
    wrap.appendChild(h);
    const sub = document.createElement("p");
    sub.className = "subtitle";
    sub.textContent = "Type the names once, tick every run they need to be on, then add them everywhere in one go.";
    wrap.appendChild(sub);

    const namesLabel = document.createElement("label");
    namesLabel.textContent = "Names \u2014 one per line";
    const namesArea = document.createElement("textarea");
    namesArea.placeholder = "Jane Rider\nJohn Rider\nAlex Rider";
    namesArea.style.minHeight = "90px";
    namesArea.value = state.paxAddNames;
    // Ticking a run re-renders the tab, so what's typed has to live in state
    // or it would be wiped the moment a run is selected.
    namesArea.oninput = e => { state.paxAddNames = e.target.value; };
    wrap.appendChild(namesLabel); wrap.appendChild(namesArea);

    const needsLabel = document.createElement("label");
    needsLabel.textContent = "Special needs for all of these \u2014 optional";
    needsLabel.style.marginTop = "10px";
    const needsInput = document.createElement("select");
    [["", "None \u2014 regular meal"],
     ["Allergen Meal", "Allergen Meal \u2014 standard allergen box"],
     ["Special Dietary Care Meal", "Special Dietary Care Meal \u2014 named, that guest only"],
     ["Mobility assistance", "Other need \u2014 mobility assistance (no meal)"],
     ["Assistance required", "Other need \u2014 assistance required (no meal)"]]
      .forEach(([v, lbl]) => {
        const o = document.createElement("option"); o.value = v; o.textContent = lbl; needsInput.appendChild(o);
      });
    needsInput.value = state.paxAddNeeds;
    needsInput.onchange = e => { state.paxAddNeeds = e.target.value; };
    wrap.appendChild(needsLabel); wrap.appendChild(needsInput);

    const runHead = document.createElement("h3");
    runHead.style.marginTop = "18px";
    runHead.textContent = "Add to which runs?";
    wrap.appendChild(runHead);

    const runSearch = document.createElement("input");
    runSearch.type = "search";
    runSearch.placeholder = "Filter runs by ID or description\u2026";
    runSearch.value = state.paxToolQuery;
    runSearch.style.cssText = "width:100%; margin-bottom:10px;";
    wrap.appendChild(runSearch);

    const rq = state.paxToolQuery.trim().toLowerCase();
    const shownRuns = runs
      .filter(r => !rq || r.runId.toLowerCase().includes(rq) || (r.description || "").toLowerCase().includes(rq))
      .sort((a, b) => (a.date || "").localeCompare(b.date || "") || a.runId.localeCompare(b.runId))
      .slice(0, 80);

    shownRuns.forEach(run => {
      const sel = state.paxSelectedRunIds.has(run.runId);
      const row = document.createElement("div");
      row.className = "card";
      row.style.cssText = "padding:10px 12px; margin-bottom:6px; cursor:pointer;" + (sel ? " border-color:var(--brand); background:var(--brand-dim);" : "");
      row.innerHTML = `<div style="display:flex; align-items:center; gap:10px;">
          <div class="checkbox" style="${sel ? "background:var(--brand); border-color:var(--brand); color:#fff;" : ""}">${sel ? "\u2713" : ""}</div>
          <div style="flex:1;">
            <div style="font-weight:600; font-size:13.5px;">${esc(run.runId)}</div>
            <div style="font-size:12px; color:var(--text-dim);">${esc(run.description || "")}${run.date ? " \u00b7 " + esc(formatDateLabel(run.date)) : ""}</div>
          </div>
          <div style="font-size:12px; color:var(--text-dim);">${(run.manifest || []).length} pax</div>
        </div>`;
      row.onclick = () => {
        if (sel) state.paxSelectedRunIds.delete(run.runId);
        else state.paxSelectedRunIds.add(run.runId);
        render();
      };
      wrap.appendChild(row);
    });

    if (state.paxSelectedRunIds.size) {
      const doBtn = document.createElement("button");
      doBtn.className = "btn btn-primary";
      doBtn.style.marginTop = "14px";
      doBtn.textContent = `Add to ${state.paxSelectedRunIds.size} run${state.paxSelectedRunIds.size === 1 ? "" : "s"}`;
      doBtn.onclick = async () => {
        const names = state.paxAddNames.split("\n").map(n => n.trim()).filter(Boolean);
        if (!names.length) { showToast("Enter at least one name"); return; }
        const needs = state.paxAddNeeds;
        const runIds = Array.from(state.paxSelectedRunIds);
        doBtn.disabled = true; doBtn.textContent = "Adding\u2026";
        let added = 0, skippedDupes = 0;
        for (const rid of runIds) {
          const updated = await mutateRun(rid, (fresh) => {
            names.forEach((nm, i) => {
              // Don't create a duplicate if they're already on this run
              if (fresh.manifest.some(p => p.name.toLowerCase() === nm.toLowerCase())) { skippedDupes++; return; }
              fresh.manifest.push({
                id: rid + "-add-" + Date.now() + "-" + i,
                name: nm, boarded: false, busNum: null, boardedAt: null,
                specialNeeds: !!needs, specialNeedsNote: needs, phone: "",
              });
              added++;
            });
          });
          if (updated) await updateRunIndexEntry(rid, {});
        }
        state.paxAddNames = "";
        state.paxSelectedRunIds = new Set();
        showToast(`Added ${added} passenger entr${added === 1 ? "y" : "ies"}` + (skippedDupes ? ` \u00b7 ${skippedDupes} already there` : ""));
        render();
      };
      wrap.appendChild(doBtn);
    }

    runSearch.oninput = e => { state.paxToolQuery = e.target.value; render(); };
    setTimeout(() => { if (state.paxToolQuery) { runSearch.focus(); runSearch.setSelectionRange(runSearch.value.length, runSearch.value.length); } }, 0);
    return wrap;
  }

  function renderCoordSheetSettings() {

    c.appendChild(topbar("Sheet Connection", () => go("coord-home")));
    const screen = document.createElement("div");
    screen.className = "screen";
    screen.innerHTML = `<h2>Google Sheet Live Sync</h2>`;

    const sheetBanner = document.createElement("div");
    sheetBanner.className = "banner";
    sheetBanner.textContent = "One-time setup: paste the code below into a Google Apps Script bound to your sheet, deploy it as a web app, then paste the resulting URL here.";
    screen.appendChild(sheetBanner);

    const codeBox = document.createElement("div");
    codeBox.className = "code-box";
    const appsScript = `function doPost(e) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sheet = ss.getSheetByName('Live Status');
  if (!sheet) {
    sheet = ss.insertSheet('Live Status');
    var headers = ['Run ID','Status','Origin','Destination','Bus Company','Catering','Boarded','Total','Last Updated'];
    for (var i=1;i<=8;i++){
      headers.push('Bus '+i+' Guide','Bus '+i+' Status','Bus '+i+' Pax','Bus '+i+' ETA');
    }
    sheet.appendRow(headers);
  }
  var data = JSON.parse(e.postData.contents);
  var row = [data.runId, data.status, data.origin||'', data.destination||'', data.busCompany||'', data.catering||'', data.boarded, data.total, new Date()];
  for (var i=0;i<8;i++){
    var b = data.buses[i];
    row.push(b ? b.guideName : '', b ? b.status : '', b ? b.pax : '', b ? b.eta : '');
  }
  var values = sheet.getDataRange().getValues();
  var rowIndex = -1;
  for (var r=1;r<values.length;r++){
    if (values[r][0] === data.runId){ rowIndex = r+1; break; }
  }
  if (rowIndex === -1) sheet.appendRow(row);
  else sheet.getRange(rowIndex,1,1,row.length).setValues([row]);
  return ContentService.createTextOutput(JSON.stringify({ok:true}))
    .setMimeType(ContentService.MimeType.JSON);
}`;
    codeBox.textContent = appsScript;
    screen.appendChild(codeBox);
    const copyCodeBtn = document.createElement("button");
    copyCodeBtn.className = "btn btn-secondary"; copyCodeBtn.style.marginTop = "10px"; copyCodeBtn.textContent = "Copy Apps Script code";
    copyCodeBtn.onclick = async () => {
      try { await navigator.clipboard.writeText(appsScript); showToast("Copied"); }
      catch (e) { showToast("Copy not available \u2014 select manually"); }
    };
    screen.appendChild(copyCodeBtn);

    const urlLabel = document.createElement("label"); urlLabel.textContent = "Web app URL"; urlLabel.style.marginTop = "18px";
    const urlInput = document.createElement("input");
    urlInput.type = "text"; urlInput.placeholder = "https://script.google.com/macros/s/.../exec";
    screen.appendChild(urlLabel); screen.appendChild(urlInput);
    loadWebhookUrl().then(u => { urlInput.value = u || ""; });
    const saveUrlBtn = document.createElement("button");
    saveUrlBtn.className = "btn btn-primary"; saveUrlBtn.style.marginTop = "10px"; saveUrlBtn.textContent = "Save sheet connection";
    saveUrlBtn.onclick = async () => { await saveWebhookUrl(urlInput.value.trim()); showToast("Saved \u2014 updates will now sync to your sheet"); };
    screen.appendChild(saveUrlBtn);

    const disconnectBtn = document.createElement("button");
    disconnectBtn.className = "btn btn-danger"; disconnectBtn.style.marginTop = "24px"; disconnectBtn.textContent = "Disconnect sheet";
    disconnectBtn.onclick = async () => {
      if (!confirm("Stop syncing to this Google Sheet? You can reconnect any time.")) return;
      await saveWebhookUrl("");

    };
    screen.appendChild(disconnectBtn);

    c.appendChild(screen);
    return c;
  }
