  .leaflet-popup-tip { background: var(--panel); }

  .step-track b { color: var(--brand); }

  .prompt-card .pdesc { font-size: 13.5px; color: var(--text-dim); margin-bottom: 20px; line-height: 1.5; }

  .tab-btn { flex: 1; white-space: nowrap; background: none; border: none; color: var(--text-dim); font-family: var(--sans); font-size: 13px; font-weight: 600; padding: 10px 8px; border-radius: 9px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .tab-btn.active { background: var(--panel); color: var(--brand); }

<script>
(function () {
  const STATUS_ORDER = ["Not Started", "At Staging", "In Route", "Completed"];
  const BUS_COMPANIES = ["Academy Express", "Raritan Valley", "American Dream Coaches"];
  function getChecklistItems(run) {
    const items = [
      { key: "guideArrived", question: "Has the guide arrived at the staging location?", short: "Guide arrived at staging" },
    ];
    if (run.catering) items.push({ key: "cateringLoaded", question: "Has catering arrived and been loaded onto the bus?", short: "Catering arrived & loaded" });
    items.push({ key: "teamInPlace", question: "Are all team members in place?", short: "All team members in place" });
    return items;
  }
  const STATUS_CLASS = s => "status-" + s.replace(/\s+/g, "-");
  const ETA_INTERVAL_MS = 20 * 60 * 1000;
  const LOC_WRITE_INTERVAL_MS = 25 * 1000;

  let state = {
    view: "role-select",
    role: null,
    runIndex: [],
    currentRun: null,
    guideName: "",
    guidePin: "",
    guideBus: null,
    search: "",
    toast: null,
    pinInput: "",
    roster: [],
    newGuideName: "",
    passengerSearchQuery: "",
    currentBusNum: null,
    coordTab: "dashboard",
    courtesySelectedDestination: null,
    editingGuideIndex: null,
    courtesyPinInput: "",
    forceEtaOpen: false,
    helpdeskPinInput: "",
    helpdeskTab: "arrivals",
    helpdeskSearchMode: "passenger",
    helpdeskSearchQuery: "",
  };

  let pollTimer = null, etaTimer = null, geoWatchId = null, lastGeoWrite = 0;
  let mapInstance = null, mapMarkers = {}, syncTimers = {};

  // Storage layer: backed by Firebase Realtime Database so every guide's
  // phone and the coordinator's dashboard read/write the same live data.
  function safeKey(key) { return key.replace(/[.#$\[\]]/g, "_"); }
  async function getJSON(key, fallback) {
    try {
      const snap = await fbDb.ref(safeKey(key)).once("value");
      if (!snap.exists()) return fallback;
      const raw = snap.val();
      return typeof raw === "string" ? JSON.parse(raw) : fallback;
    } catch (e) { console.error("storage get failed", key, e); return fallback; }
  }
  async function setJSON(key, val) {
    try { await fbDb.ref(safeKey(key)).set(JSON.stringify(val)); return true; }
    catch (e) { console.error("storage set failed", key, e); showToast("\u26a0\ufe0f Couldn't save \u2014 check your Firebase config"); return false; }
  }
  async function deleteKey(key) {
    try { await fbDb.ref(safeKey(key)).remove(); return true; }
    catch (e) { console.error("storage delete failed", key, e); return false; }
  }

  async function loadIndex() { state.runIndex = await getJSON("run-index", []); }
  async function loadRun(runId) { return await getJSON("run-" + runId, null); }
  async function saveRun(run) { run.updatedAt = Date.now(); await setJSON("run-" + run.runId, run); scheduleSync(run); }
  async function loadRoster() { return await getJSON("guide-roster", []); }
  async function saveRoster(list) { await setJSON("guide-roster", list); }
  async function loadCoordPin() { return await getJSON("coordinator-pin", null); }
  async function saveCoordPin(pin) { await setJSON("coordinator-pin", pin); }
  async function loadCourtesyPin() { return await getJSON("courtesy-pin", null); }
  async function saveCourtesyPin(pin) { await setJSON("courtesy-pin", pin); }
  async function loadHelpdeskPin() { return await getJSON("helpdesk-pin", null); }
  async function saveHelpdeskPin(pin) { await setJSON("helpdesk-pin", pin); }
  async function loadWebhookUrl() { return await getJSON("sheet-webhook-url", ""); }
  async function saveWebhookUrl(url) { await setJSON("sheet-webhook-url", url); }

  async function setGuideResume(pin, runId, busNum) {
    const roster = await loadRoster();
    const g = roster.find(x => x.pin === pin);
    if (g) { g.lastRunId = runId; g.lastBusNum = busNum; await saveRoster(roster); }
  }
  async function clearGuideResume(pin) {
    const roster = await loadRoster();
    const g = roster.find(x => x.pin === pin);
    if (g) { g.lastRunId = null; g.lastBusNum = null; await saveRoster(roster); }
  }

  function scheduleSync(run) {
    if (syncTimers[run.runId]) clearTimeout(syncTimers[run.runId]);
    syncTimers[run.runId] = setTimeout(() => syncToSheet(run), 1200);
  }
  async function syncToSheet(run) {
    const url = await loadWebhookUrl();
    if (!url) return;
    const boarded = totalBoarded(run);
    const total = run.manifest.length;
    const payload = {
      runId: run.runId, status: aggregateStatus(run), boarded, total,
      origin: run.origin || "", destination: run.destination || "",
      busCompany: run.busCompany || "",
      catering: run.catering ? "Yes" : "No", notes: run.notes || "",
      buses: run.buses.map(b => ({
        num: b.num, guideName: b.guideName || "", status: b.status,
        pax: busBoardedCount(run, b.num),
        eta: b.eta ? new Date(b.eta).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "",
      })),
    };
    try {
      await fetch(url, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) });
    } catch (e) { console.error("sheet sync failed", e); }
  }

  function showToast(msg) {
    state.toast = msg; render();
    setTimeout(() => { const el = document.getElementById("toast-el"); if (el) el.classList.remove("show"); }, 1800);
  }
  function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }
  function startPolling(fn, ms) { stopPolling(); pollTimer = setInterval(fn, ms); }
  function stopEtaTimer() { if (etaTimer) { clearInterval(etaTimer); etaTimer = null; } }
  function stopGeo() { if (geoWatchId !== null && navigator.geolocation) { navigator.geolocation.clearWatch(geoWatchId); geoWatchId = null; } }
  function teardownGuideSession() { stopPolling(); stopEtaTimer(); stopGeo(); }
  function go(view) { state.view = view; render(); }

  function busBoardedCount(run, busNum) { return run.manifest.filter(p => p.boarded && p.busNum === busNum).length; }
  function totalBoarded(run) { return run.manifest.filter(p => p.boarded).length; }
  function aggregateStatus(run) {
    if (!run.buses.length) return "Not Started";
    let minIdx = STATUS_ORDER.length - 1;
    run.buses.forEach(b => { minIdx = Math.min(minIdx, STATUS_ORDER.indexOf(b.status)); });
    return STATUS_ORDER[minIdx];
  }
  function genPin(existing) {
    let pin; do { pin = String(Math.floor(1000 + Math.random() * 9000)); } while (existing.some(g => g.pin === pin));
    return pin;
  }
  function computeAssignedGuides(buses) {
    return Array.from(new Set(buses.map(b => b.guideName).filter(Boolean)));
  }
  async function updateRunIndexEntry(runId, patch) {
    const idx = await getJSON("run-index", []);
    const i = idx.findIndex(r => r.runId === runId);
    if (i >= 0) { idx[i] = { ...idx[i], ...patch }; await setJSON("run-index", idx); state.runIndex = idx; }
  }
  function timeAgo(ts) {
    if (!ts) return "never";
    const s = Math.floor((Date.now() - ts) / 1000);
    if (s < 60) return s + "s ago";
    if (s < 3600) return Math.floor(s / 60) + "m ago";
    return Math.floor(s / 3600) + "h ago";
  }

    const screen = document.createElement("div");
    screen.className = "screen";

    input.value = state.pinInput; input.autofocus = true;

  let refreshManifestLive = () => {};

  function startEtaWatcher() {
    stopEtaTimer();
    etaTimer = setInterval(() => { if (state.view === "guide-manifest") render(); }, 30000);
  }
  function etaDue(bus) {
    if (bus.status !== "In Route") return false;
    const since = bus.etaUpdatedAt || bus.departedAt || Date.now();
    return Date.now() - since >= ETA_INTERVAL_MS || !bus.eta;
  }
  function etaMinutesUntilDue(bus) {
    const since = bus.etaUpdatedAt || bus.departedAt || Date.now();
    const remaining = (since + ETA_INTERVAL_MS) - Date.now();
    return Math.max(0, Math.ceil(remaining / 60000));
  }
  function startGeoWatch(runId, busNum) {
    stopGeo();
    if (!("geolocation" in navigator)) return;
    geoWatchId = navigator.geolocation.watchPosition(
      pos => {
        const now = Date.now();
        if (now - lastGeoWrite < LOC_WRITE_INTERVAL_MS) return;
        lastGeoWrite = now;
        updateBusLocation(runId, busNum, pos.coords.latitude, pos.coords.longitude);
      },
      err => { console.warn("geo error", err); },
      { enableHighAccuracy: false, maximumAge: 20000, timeout: 15000 }
    );
  }
  async function updateBusLocation(runId, busNum, lat, lng) {
    const fresh = await loadRun(runId);
    if (!fresh) return;
    const bus = fresh.buses.find(b => b.num === busNum);
    if (!bus) return;
    bus.loc = { lat, lng, at: Date.now() };
    await saveRun(fresh);
    if (state.currentRun && state.currentRun.runId === runId) state.currentRun = fresh;
  }

  function statusStepperUI(run, busNum, onAdvance) {
    const bus = run.buses.find(b => b.num === busNum);
    const idx = STATUS_ORDER.indexOf(bus.status);
    const box = document.createElement("div");
    box.className = "status-stepper";
    const label = document.createElement("div");
    label.className = "cur-label"; label.textContent = "Bus " + busNum + " status";
    box.appendChild(label);
    const pill = document.createElement("span");
    pill.className = "status-pill " + STATUS_CLASS(bus.status);
    pill.innerHTML = `<span class="sdot"></span>${bus.status}`;
    box.appendChild(pill);
    if (idx < STATUS_ORDER.length - 1) {
      const next = STATUS_ORDER[idx + 1];
      const btn = document.createElement("button");
      btn.className = "btn btn-secondary"; btn.style.marginTop = "12px";
      const labelMap = { "In Route": "Mark departed / in route", "Completed": "Mark completed" };
      btn.textContent = labelMap[next] || ("Advance to " + next);
      btn.onclick = onAdvance;
      box.appendChild(btn);
    }
    return box;
  }

  // ---------- Guide: manifest (step-gated execute flow) ----------
  function renderGuideManifest() {
    const run = state.currentRun;
    const busNum = state.guideBus;
    const myBus = () => state.currentRun.buses.find(b => b.num === busNum);
    state.forceEtaOpen = false;

    const c = document.createElement("div");
    c.appendChild(topbar(run.runId + " \u00b7 Bus " + busNum, () => go("guide-setup")));
    const screen = document.createElement("div");
    screen.className = "screen";

    const switchLink = document.createElement("button");
    switchLink.className = "link-btn"; switchLink.style.marginBottom = "14px"; switchLink.textContent = "Not your run? Switch run";
    switchLink.onclick = async () => { teardownGuideSession(); await loadIndex(); go("guide-run-select"); startPolling(async () => { await loadIndex(); if (state.view === "guide-run-select") render(); }, 6000); };
    screen.appendChild(switchLink);

    const bodyHolder = document.createElement("div");
    screen.appendChild(bodyHolder);
    c.appendChild(screen);

    function checklistItems() {
      return getChecklistItems(run);
    }
    function checklistComplete() {
      const bus = myBus();
      return checklistItems().every(it => !!bus[it.key]);
    }
    function gateStage() {
      const bus = myBus();
      if (bus.status === "Not Started") return "arrival";
      return checklistComplete() ? "none" : "checklist";
    }

    async function toggleChecklistItem(key) {
      const fresh = await loadRun(run.runId);
      const bus = fresh.buses.find(b => b.num === busNum);
      const newVal = !bus[key];
      bus[key] = newVal;
      bus[key + "At"] = newVal ? Date.now() : null;
      // "busArrived" is its own dedicated stage that also drives the bus's tracked status
      if (key === "busArrived") {
        if (newVal && bus.status === "Not Started") { bus.status = "At Staging"; bus.stagingAt = Date.now(); }
        if (!newVal && bus.status === "At Staging") { bus.status = "Not Started"; bus.stagingAt = null; }
      }
      await saveRun(fresh);
      state.currentRun = fresh;
      renderBody();
    }

    function renderBody() {
      bodyHolder.innerHTML = "";
      const stage = gateStage();

      if (stage === "arrival") {
        const track = document.createElement("div");
        track.className = "step-track";
        track.innerHTML = `<b>Bus Arrival</b> \u2014 Stage 1`;
        bodyHolder.appendChild(track);
        const card = document.createElement("div");
        card.className = "prompt-card";
        card.innerHTML = `<div class="picon">\u{1F68C}</div>
          <div class="ptitle">Has the bus arrived at the staging location?</div>
          <div class="pdesc">${run.stagingLocation ? esc(run.stagingLocation) : "Confirm once the bus is parked and ready."} This confirms the bus is physically on site \u2014 the coordinator sees this update immediately.</div>`;
        const btn = document.createElement("button");
        btn.className = "btn btn-primary"; btn.textContent = "Yes, the bus has arrived";
        btn.onclick = () => toggleChecklistItem("busArrived");
        card.appendChild(btn);
        bodyHolder.appendChild(card);
        return;
      }

      if (stage === "checklist") {
        const items = checklistItems();
        const bus = myBus();
        const doneCount = items.filter(it => bus[it.key]).length;

        const track = document.createElement("div");
        track.className = "step-track";
        track.innerHTML = `<b>Pre-Run Checklist</b> \u2014 ${doneCount} of ${items.length} complete`;
        bodyHolder.appendChild(track);

        const heading = document.createElement("p");
        heading.className = "subtitle";
        heading.style.marginBottom = "16px";
        heading.textContent = "Check off each item as it's confirmed. The manifest unlocks once everything's checked.";
        bodyHolder.appendChild(heading);

        const card = document.createElement("div");
        card.className = "card";
        items.forEach((item, i) => {
          const checked = !!bus[item.key];
          const row = document.createElement("div");
          row.className = "pax-row" + (checked ? " boarded-mine" : "");
          if (i < items.length - 1) row.style.marginBottom = "8px";
          row.innerHTML = `<div class="checkbox">${checked ? "\u2713" : ""}</div><div class="pax-name" style="font-size:14.5px;">${esc(item.question)}</div>`;
          row.onclick = () => toggleChecklistItem(item.key);
          card.appendChild(row);
        });
        bodyHolder.appendChild(card);
        return;
      }

      // stage === none: full execute UI
      const track = document.createElement("div");
      track.className = "step-track";
      track.innerHTML = `<b>${myBus().status === "In Route" ? "In route" : myBus().status === "Completed" ? "Completed" : "Boarding"}</b>`;
      bodyHolder.appendChild(track);

      const gpsRow = document.createElement("div");
      gpsRow.className = "gps-status"; gpsRow.id = "gps-status-row";
      bodyHolder.appendChild(gpsRow);
      function updateGpsRow() {
        const active = myBus().status === "In Route" && geoWatchId !== null;
        gpsRow.className = "gps-status" + (active ? " live" : "");
        gpsRow.innerHTML = `<span class="gdot"></span>${active ? "Sharing live location" : "Location off until bus is In Route"}`;
      }

      const stepperHolder = document.createElement("div");
      bodyHolder.appendChild(stepperHolder);
      function renderStepper() {
        stepperHolder.innerHTML = "";
        stepperHolder.appendChild(statusStepperUI(state.currentRun, busNum, async () => {
          const fresh = await loadRun(run.runId);
          const bus = fresh.buses.find(b => b.num === busNum);
          const idx = STATUS_ORDER.indexOf(bus.status);
          bus.status = STATUS_ORDER[idx + 1];
          if (bus.status === "In Route") { bus.departedAt = Date.now(); startGeoWatch(run.runId, busNum); }
          if (bus.status === "Completed") { bus.completedAt = Date.now(); stopGeo(); await clearGuideResume(state.guidePin); }
          await saveRun(fresh);
          state.currentRun = fresh;
          renderStepper(); renderEtaBanner(); updateGpsRow(); renderBody2Track();
          showToast("Bus " + busNum + " marked " + bus.status);
        }));
      }
      function renderBody2Track() { track.innerHTML = `<b>${myBus().status === "In Route" ? "In route" : myBus().status === "Completed" ? "Completed" : "Boarding"}</b>`; }
      renderStepper();

      const etaHolder = document.createElement("div");
      bodyHolder.appendChild(etaHolder);
      function renderEtaBanner() {
        etaHolder.innerHTML = "";
        const bus = myBus();
        if (bus.status !== "In Route") return;

        if (!etaDue(bus) && !state.forceEtaOpen) {
          const compact = document.createElement("div");
          compact.style.cssText = "display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:16px; padding:10px 14px; background:var(--panel-alt); border:1px solid var(--border); border-radius:10px; font-size:12.5px; color:var(--text-dim);";
          const etaText = bus.eta
            ? "ETA " + new Date(bus.eta).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) + " \u00b7 next check-in in " + etaMinutesUntilDue(bus) + "m"
            : "No ETA set \u00b7 next check-in in " + etaMinutesUntilDue(bus) + "m";
          compact.innerHTML = `<span>${etaText}</span>`;
          const openBtn = document.createElement("button");
          openBtn.className = "link-btn"; openBtn.textContent = "Update now";
          openBtn.onclick = () => { state.forceEtaOpen = true; renderEtaBanner(); };
          compact.appendChild(openBtn);
          etaHolder.appendChild(compact);
          return;
        }

        const banner = document.createElement("div");
        banner.className = "eta-banner";
        banner.innerHTML = `<div class="eta-title">${bus.eta ? "ETA check-in" : "Set your ETA"}</div>`;
        const row = document.createElement("div");
        row.className = "eta-row";

        // Reliable dropdown-based time picker — native <input type="time"> pickers
        // are inconsistent (and prone to scroll conflicts) across Android browsers.
        const timeRow = document.createElement("div");
        timeRow.style.cssText = "display:flex; gap:6px; align-items:center;";
        const hourSel = document.createElement("select");
        hourSel.style.width = "auto";
        for (let h = 1; h <= 12; h++) { const o = document.createElement("option"); o.value = String(h); o.textContent = String(h); hourSel.appendChild(o); }
        const colon = document.createElement("span"); colon.textContent = ":"; colon.style.cssText = "color:var(--text-dim); font-family:var(--mono);";
        const minSel = document.createElement("select");
        minSel.style.width = "auto";
        for (let m = 0; m < 60; m += 5) { const o = document.createElement("option"); o.value = String(m); o.textContent = String(m).padStart(2, "0"); minSel.appendChild(o); }
        const ampmSel = document.createElement("select");
        ampmSel.style.width = "auto";
        ["AM", "PM"].forEach(v => { const o = document.createElement("option"); o.value = v; o.textContent = v; ampmSel.appendChild(o); });

        // default to the current time, rounded to the nearest 5 minutes
        const now = new Date();
        let defM = Math.round(now.getMinutes() / 5) * 5;
        let defH = now.getHours();
        if (defM === 60) { defM = 0; defH = (defH + 1) % 24; }
        const defAmpm = defH >= 12 ? "PM" : "AM";
        let def12 = defH % 12; if (def12 === 0) def12 = 12;
        hourSel.value = String(def12); minSel.value = String(defM); ampmSel.value = defAmpm;

        timeRow.appendChild(hourSel); timeRow.appendChild(colon); timeRow.appendChild(minSel); timeRow.appendChild(ampmSel);

        const submitBtn = document.createElement("button");
        submitBtn.className = "btn btn-primary"; submitBtn.style.width = "auto"; submitBtn.textContent = "Update ETA";
        submitBtn.onclick = async () => {
          let hh = parseInt(hourSel.value, 10);
          const mm = parseInt(minSel.value, 10);
          if (ampmSel.value === "PM" && hh !== 12) hh += 12;
          if (ampmSel.value === "AM" && hh === 12) hh = 0;
          const d = new Date(); d.setHours(hh, mm, 0, 0);
          const fresh = await loadRun(run.runId);
          const b = fresh.buses.find(b2 => b2.num === busNum);
          b.eta = d.getTime(); b.etaUpdatedAt = Date.now();
          await saveRun(fresh);
          state.currentRun = fresh;
          state.forceEtaOpen = false;
          renderEtaBanner();
          showToast("ETA updated");
        };
        row.appendChild(timeRow); row.appendChild(submitBtn);
        banner.appendChild(row);
        if (bus.eta) {
          const cur = document.createElement("div"); cur.className = "eta-current";
          cur.textContent = "Current ETA: " + new Date(bus.eta).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) + " \u00b7 last updated " + timeAgo(bus.etaUpdatedAt);
          banner.appendChild(cur);
        }
        if (state.forceEtaOpen && !etaDue(bus)) {
          const closeBtn = document.createElement("button");
          closeBtn.className = "btn btn-ghost"; closeBtn.style.marginTop = "8px"; closeBtn.textContent = "Close";
          closeBtn.onclick = () => { state.forceEtaOpen = false; renderEtaBanner(); };
          banner.appendChild(closeBtn);
        }
        etaHolder.appendChild(banner);
      }
      renderEtaBanner();
      updateGpsRow();
      if (myBus().status === "In Route") startGeoWatch(run.runId, busNum);

      const boarded = totalBoarded(state.currentRun);
      const mine = busBoardedCount(state.currentRun, busNum);
      const total = state.currentRun.manifest.length;
      const stats = document.createElement("div");
      stats.className = "stat-strip";
      stats.innerHTML = `<div class="stat-box"><div class="num">${mine}</div><div class="lbl">On this bus</div></div>
        <div class="stat-box"><div class="num">${boarded}/${total}</div><div class="lbl">Run boarded</div></div>
        <div class="stat-box"><div class="num">${total - boarded}</div><div class="lbl">Remaining</div></div>`;
      bodyHolder.appendChild(stats);

      const searchWrap = document.createElement("div");
      searchWrap.className = "search-wrap";
      const search = document.createElement("input");
      search.type = "text"; search.placeholder = "Search manifest\u2026"; search.value = state.search;
      search.oninput = e => { state.search = e.target.value; renderManifestList(); };
      searchWrap.appendChild(search);
      bodyHolder.appendChild(searchWrap);

      const listHolder = document.createElement("div");
      listHolder.className = "pax-list"; listHolder.id = "pax-list-holder";
      bodyHolder.appendChild(listHolder);

      function renderManifestList() {
        const holder = document.getElementById("pax-list-holder");
        if (!holder) return;
        holder.innerHTML = "";
        const q = state.search.trim().toLowerCase();
        const filtered = state.currentRun.manifest.filter(p => !q || p.name.toLowerCase().includes(q));
        if (!filtered.length) { holder.innerHTML = `<div class="empty-state" style="padding:30px 10px;">No matches.</div>`; return; }
        filtered.forEach(p => {
          const row = document.createElement("div");
          const mineRow = p.boarded && p.busNum === busNum;
          const otherRow = p.boarded && p.busNum !== busNum;
          const otherGuide = otherRow ? (state.currentRun.buses.find(b => b.num === p.busNum) || {}).guideName : null;
          row.className = "pax-row" + (mineRow ? " boarded-mine" : "") + (otherRow ? " boarded-other" : "");
          row.innerHTML = `<div class="checkbox">${p.boarded ? "\u2713" : ""}</div><div class="pax-name">${esc(p.name)}</div>${otherRow ? `<div class="pax-tag">Bus ${p.busNum}${otherGuide ? " \u00b7 " + esc(otherGuide) : ""}</div>` : ""}`;
          if (!otherRow) {
            row.onclick = async () => {
              const fresh = await loadRun(run.runId);
              const person = fresh.manifest.find(x => x.id === p.id);
              if (person.boarded && person.busNum === busNum) { person.boarded = false; person.busNum = null; person.boardedAt = null; }
              else if (!person.boarded) { person.boarded = true; person.busNum = busNum; person.boardedAt = Date.now(); }
              else return;
              await saveRun(fresh);
              state.currentRun = fresh;
              renderManifestList();
              updateStatsInPlace();
            };
          }
          holder.appendChild(row);
        });
      }
      function updateStatsInPlace() {
        const b2 = busBoardedCount(state.currentRun, busNum);
        const t2 = totalBoarded(state.currentRun);
        const tot = state.currentRun.manifest.length;
        stats.innerHTML = `<div class="stat-box"><div class="num">${b2}</div><div class="lbl">On this bus</div></div>
          <div class="stat-box"><div class="num">${t2}/${tot}</div><div class="lbl">Run boarded</div></div>
          <div class="stat-box"><div class="num">${tot - t2}</div><div class="lbl">Remaining</div></div>`;
      }
      refreshManifestLive = () => { renderManifestList(); updateStatsInPlace(); renderEtaBanner(); updateGpsRow(); };
      renderManifestList();
    }

    renderBody();
    return c;
  }

  // ---------- Coordinator: PIN gate ----------
  function renderCoordPin() {
    const c = document.createElement("div");
    c.appendChild(topbar("Coordinator", () => go("role-select")));
    const screen = document.createElement("div");
    screen.className = "screen";
    const holder = document.createElement("div");
    screen.appendChild(holder);
    c.appendChild(screen);
    loadCoordPin().then(pw => {
      if (!pw) {
        holder.innerHTML = "";
        const h = document.createElement("h2"); h.textContent = "Create a coordinator password";
        const sub = document.createElement("p"); sub.className = "subtitle";
        sub.textContent = "No coordinator password is set yet. Create one now (at least 8 characters) \u2014 you'll need it to get back in.";
        holder.appendChild(h); holder.appendChild(sub);

        const lbl1 = document.createElement("label"); lbl1.textContent = "Password";
        const p1 = document.createElement("input");
        p1.type = "password"; p1.placeholder = "At least 8 characters"; p1.autocomplete = "new-password";
        const lbl2 = document.createElement("label"); lbl2.textContent = "Confirm password";
        const p2 = document.createElement("input");
        p2.type = "password"; p2.autocomplete = "new-password";
        holder.appendChild(lbl1); holder.appendChild(p1); holder.appendChild(lbl2); holder.appendChild(p2);

        const btn = document.createElement("button");
        btn.className = "btn btn-primary"; btn.style.marginTop = "18px"; btn.textContent = "Create password & continue";
        btn.onclick = async () => {
          if (p1.value.length < 8) { showToast("Password must be at least 8 characters"); return; }
          if (p1.value !== p2.value) { showToast("Passwords don't match"); return; }
          await saveCoordPin(p1.value);
          state.coordTab = "dashboard";
          go("coord-home");
        };
        holder.appendChild(btn);
      } else {
        holder.innerHTML = "";
        const h = document.createElement("h2"); h.textContent = "Enter coordinator password";
        holder.appendChild(h);
        const label = document.createElement("label"); label.textContent = "Password";
        const input = document.createElement("input");
        input.type = "password"; input.autocomplete = "current-password"; input.autofocus = true;
        holder.appendChild(label); holder.appendChild(input);
        const btn = document.createElement("button");
        btn.className = "btn btn-primary"; btn.style.marginTop = "16px"; btn.textContent = "Continue";
        btn.onclick = async () => {
          if (input.value !== pw) { showToast("Incorrect password"); return; }
          state.coordTab = "dashboard";
          go("coord-home");
        };
        input.onkeydown = e => { if (e.key === "Enter") btn.click(); };
        holder.appendChild(btn);
      }
    });
    return c;
  }

  // ---------- Coordinator: tabbed home (Dashboard / Search / Courtesy Flow / Settings) ----------
  function renderCoordHome() {
    const c = document.createElement("div");
    c.appendChild(topbar("Coordinator", () => { stopPolling(); go("role-select"); }));
    const screen = document.createElement("div");
    screen.className = "screen";

    const banner = document.createElement("div");
    banner.className = "banner";
    banner.textContent = "Guides sign in with their own PIN. This data syncs to your Google Sheet if you've connected one in Settings.";
    screen.appendChild(banner);

    const tabBar = document.createElement("div");
    tabBar.className = "tab-bar";
    const tabs = [
      { id: "dashboard", label: "Dashboard", icon: "\u{1F4CA}" },
      { id: "search", label: "Search", icon: "\u{1F50D}" },
      { id: "courtesy", label: "Courtesy Flow", icon: "\u{1F697}" },
      { id: "settings", label: "Settings", icon: "\u2699\uFE0F" },
    ];
    tabs.forEach(t => {
      const btn = document.createElement("button");
      btn.className = "tab-btn" + (state.coordTab === t.id ? " active" : "");
      btn.innerHTML = `<span>${t.icon}</span> ${t.label}`;
      btn.onclick = () => { state.coordTab = t.id; render(); };
      tabBar.appendChild(btn);
    });
    screen.appendChild(tabBar);

    const contentHolder = document.createElement("div");
    contentHolder.innerHTML = `<div class="empty-state" style="padding:30px 0;">Loading\u2026</div>`;
    screen.appendChild(contentHolder);
    c.appendChild(screen);

    async function refresh() {
      if (state.view !== "coord-home") return;
      // Settings and Search are forms/lookups you're actively interacting with —
      // an automatic rebuild would wipe out anything mid-typing, so only the
      // live-glance views (Dashboard, Courtesy Flow) refresh on their own.
      if (state.coordTab === "settings" || state.coordTab === "search") return;
      await loadIndex();
      const runs = state.runIndex.length
        ? (await Promise.all(state.runIndex.map(r => loadRun(r.runId)))).filter(Boolean)
        : [];
      if (state.view !== "coord-home") return;
      if (state.coordTab === "settings" || state.coordTab === "search") return;
      contentHolder.innerHTML = "";
      if (state.coordTab === "dashboard") contentHolder.appendChild(buildDashboardTab(runs));
      else if (state.coordTab === "courtesy") contentHolder.appendChild(buildCourtesyContent(runs));
    }

    async function renderCurrentTab() {
      const runs = state.runIndex.length
        ? (await Promise.all(state.runIndex.map(r => loadRun(r.runId)))).filter(Boolean)
        : [];
      contentHolder.innerHTML = "";
      if (state.coordTab === "dashboard") contentHolder.appendChild(buildDashboardTab(runs));
      else if (state.coordTab === "search") contentHolder.appendChild(buildSearchTab(runs));
      else if (state.coordTab === "courtesy") contentHolder.appendChild(buildCourtesyContent(runs));
      else if (state.coordTab === "settings") contentHolder.appendChild(buildSettingsTab());
    }

    renderCurrentTab();
    startPolling(refresh, 60000);
    return c;
  }

  // ---------- Dashboard tab: global stats + run list ----------
  function buildDashboardTab(runs) {
    const wrap = document.createElement("div");

    if (!runs.length) {
      wrap.innerHTML = `<div class="empty-state"><div class="big">\u{1F4CB}</div>No runs yet. Head to Settings to create one or import a batch from Excel.</div>`;
      return wrap;
    }

    const byStatus = {};
    STATUS_ORDER.forEach(s => { byStatus[s] = { buses: 0, pax: 0 }; });
    let grandBuses = 0, grandPax = 0, completedRuns = 0, inRouteBuses = 0, totalBoardedAllRuns = 0;
    runs.forEach(run => {
      run.buses.forEach(b => {
        const pax = busBoardedCount(run, b.num);
        byStatus[b.status].buses += 1;
        byStatus[b.status].pax += pax;
        grandBuses += 1; grandPax += pax;
        if (b.status === "In Route") inRouteBuses += 1;
      });
      totalBoardedAllRuns += totalBoarded(run);
      if (aggregateStatus(run) === "Completed") completedRuns += 1;
    });

    const topStrip = document.createElement("div");
    topStrip.className = "stat-strip";
    topStrip.innerHTML = `
      <div class="stat-box"><div class="num">${runs.length}</div><div class="lbl">Total runs</div></div>
      <div class="stat-box"><div class="num">${completedRuns}</div><div class="lbl">Runs completed</div></div>
      <div class="stat-box"><div class="num">${inRouteBuses}</div><div class="lbl">Buses en route</div></div>
      <div class="stat-box"><div class="num">${totalBoardedAllRuns}</div><div class="lbl">Passengers boarded</div></div>
    `;
    wrap.appendChild(topStrip);

    const breakdownLabel = document.createElement("h3");
    breakdownLabel.textContent = "Buses & passengers by stage";
    breakdownLabel.style.margin = "16px 0 8px";
    wrap.appendChild(breakdownLabel);

    const breakdownCard = document.createElement("div");
    breakdownCard.className = "card";
    STATUS_ORDER.forEach(s => {
      const t = byStatus[s];
      const row = document.createElement("div");
      row.className = "bus-detail-row";
      row.innerHTML = `<div class="bus-detail-left"><span class="status-pill ${STATUS_CLASS(s)}"><span class="sdot"></span>${s}</span></div>
        <div class="bus-detail-count">${t.buses} bus${t.buses === 1 ? "" : "es"} \u00b7 ${t.pax} pax</div>`;
      breakdownCard.appendChild(row);
    });
    const totalRow = document.createElement("div");
    totalRow.className = "bus-detail-row"; totalRow.style.borderTop = "2px solid var(--border)";
    totalRow.innerHTML = `<div class="bus-detail-left"><span style="font-family:var(--mono); font-size:12px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.05em;">Total</span></div>
      <div class="bus-detail-count"><b>${grandBuses} buses \u00b7 ${grandPax} pax</b></div>`;
    breakdownCard.appendChild(totalRow);
    wrap.appendChild(breakdownCard);

    const listHeading = document.createElement("h3");
    listHeading.textContent = "All runs";
    listHeading.style.margin = "22px 0 8px";
    wrap.appendChild(listHeading);

    runs.slice().sort((a, b) => a.runId.localeCompare(b.runId)).forEach(run => {
      const boarded = totalBoarded(run);
      const total = run.manifest.length;
      const agg = aggregateStatus(run);
      const card = document.createElement("div");
      card.className = "card";
      const btn = document.createElement("button");
      btn.className = "list-btn";
      const chips = run.buses.map(b => `<span class="status-pill ${STATUS_CLASS(b.status)}" style="margin-right:6px;"><span class="sdot"></span>Bus ${b.num}</span>`).join("");
      btn.innerHTML = `<div class="run-row"><div><div class="run-id">${esc(run.runId)}</div><div class="run-desc">${esc(run.description || "")}</div>${run.busCompany ? `<div style="font-size:11.5px; color:var(--text-dim); margin-top:2px;">\u{1F68C} ${esc(run.busCompany)}</div>` : ""}</div></div>
        <div style="margin:10px 0 8px;">${chips}</div>
        <div class="run-row"><span class="status-pill ${STATUS_CLASS(agg)}"><span class="sdot"></span>${agg}</span><span style="font-family:var(--mono); font-size:13px;">${boarded} / ${total} boarded</span></div>`;
      btn.onclick = async () => { stopPolling(); state.currentRun = await loadRun(run.runId); go("coord-run-detail"); };
      card.appendChild(btn);
      wrap.appendChild(card);
    });

    return wrap;
  }

  // ---------- Search tab: passenger lookup across every run ----------
  function buildSearchTab(runs) {
    const wrap = document.createElement("div");
    const heading = document.createElement("h2");
    heading.textContent = "Find a passenger";
    wrap.appendChild(heading);
    const sub = document.createElement("p");
    sub.className = "subtitle";
    sub.textContent = "Search by name across every run to see whether they've boarded, which bus, and who the guide is.";
    wrap.appendChild(sub);

    const searchInput = document.createElement("input");
    searchInput.type = "text";
    searchInput.placeholder = "Passenger name\u2026";
    searchInput.value = state.passengerSearchQuery;
    searchInput.autofocus = true;
    wrap.appendChild(searchInput);

    const results = document.createElement("div");
    results.style.marginTop = "14px";
    wrap.appendChild(results);

    function renderResults() {
      const q = state.passengerSearchQuery.trim().toLowerCase();
      results.innerHTML = "";
      if (!q) return;
      const matches = [];
      runs.forEach(run => {
        run.manifest.forEach(p => {
          if (p.name.toLowerCase().includes(q)) matches.push({ run, person: p });
        });
      });
      if (!matches.length) {
        results.innerHTML = `<div class="empty-state" style="padding:20px 0;">No passenger matches "${esc(state.passengerSearchQuery)}".</div>`;
        return;
      }
      matches.slice(0, 30).forEach(({ run, person }) => {
        const bus = person.boarded ? run.buses.find(b => b.num === person.busNum) : null;
        const card = document.createElement("div");
        card.className = "card";
        const row = document.createElement("button");
        row.className = "list-btn";
        row.innerHTML = `<div class="run-row"><b style="font-size:14.5px;">${esc(person.name)}</b>
            <span class="run-id" style="font-size:12px;">${esc(run.runId)}</span></div>
          <div class="bus-detail-meta" style="margin-top:4px;">
            ${person.boarded
              ? `Boarded &middot; Bus ${person.busNum}${bus && bus.guideName ? " &middot; Guide: " + esc(bus.guideName) : ""}`
              : "Not yet boarded &middot; " + esc(run.description || run.runId)}
          </div>`;
        row.onclick = async () => {
          stopPolling();
          state.currentRun = await loadRun(run.runId);
          if (person.boarded) { state.currentBusNum = person.busNum; go("coord-bus-detail"); }
          else { go("coord-run-detail"); }
        };
        card.appendChild(row);
        results.appendChild(card);
      });
      if (matches.length > 30) {
        const more = document.createElement("div");
        more.className = "subtitle"; more.style.fontSize = "12px";
        more.textContent = (matches.length - 30) + " more match" + (matches.length - 30 === 1 ? "" : "es") + " \u2014 narrow your search to see them.";
        results.appendChild(more);
      }
    }
    searchInput.oninput = e => { state.passengerSearchQuery = e.target.value; renderResults(); };
    renderResults();
    return wrap;
  }

  // ---------- Courtesy Flow content: runs grouped by destination ----------
  // Shared between the Coordinator's "Courtesy Flow" tab and the standalone
  // no-PIN Courtesy Flow role reachable from the role-select screen.
  function groupRunsByDestination(runs) {
    const groups = {};
    runs.forEach(run => {
      const dest = (run.destination || "").trim();
      const key = dest ? dest.toLowerCase() : "\u0000unspecified";
      if (!groups[key]) groups[key] = { label: dest || "Unspecified destination", entries: [] };
      run.buses.forEach(b => groups[key].entries.push({ run, bus: b }));
    });
    return groups;
  }

  function buildCourtesyContent(runs) {
    const wrap = document.createElement("div");
    const groups = groupRunsByDestination(runs);
    const destKeys = Object.keys(groups).sort((a, b) => groups[a].label.localeCompare(groups[b].label));

    if (state.courtesySelectedDestination && groups[state.courtesySelectedDestination]) {
      const g = groups[state.courtesySelectedDestination];
      const backBtn = document.createElement("button");
      backBtn.className = "link-btn"; backBtn.style.marginBottom = "14px"; backBtn.textContent = "\u2190 All destinations";
      backBtn.onclick = () => { state.courtesySelectedDestination = null; render(); };
      wrap.appendChild(backBtn);

      const heading = document.createElement("h2");
      heading.textContent = g.label;
      wrap.appendChild(heading);
      const sub = document.createElement("p");
      sub.className = "subtitle";
      sub.textContent = "Every bus heading here, soonest arrival first.";
      wrap.appendChild(sub);

      const priority = { "In Route": 0, "At Staging": 1, "Not Started": 2, "Completed": 3 };
      const sorted = g.entries.slice().sort((a, b) => {
        const pa = priority[a.bus.status], pb = priority[b.bus.status];
        if (pa !== pb) return pa - pb;
        const ea = a.bus.eta || Infinity, eb = b.bus.eta || Infinity;
        return ea - eb;
      });
      if (!sorted.length) {
        wrap.innerHTML += `<div class="empty-state">No buses currently assigned to this destination.</div>`;
      }
      sorted.forEach(({ run, bus }) => {
        const pax = busBoardedCount(run, bus.num);
        const etaText = bus.eta ? new Date(bus.eta).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "\u2014";
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `<div class="run-row">
            <div><div class="run-id">${esc(run.runId)} \u00b7 Bus ${bus.num}</div><div class="run-desc">${esc(run.description || "")}</div></div>
            <span class="status-pill ${STATUS_CLASS(bus.status)}"><span class="sdot"></span>${bus.status}</span>
          </div>
          <div class="bus-detail-meta" style="margin-top:8px; font-size:13px;">
            Guide: ${bus.guideName ? esc(bus.guideName) : "\u2014"} &middot; ETA: <b style="color:var(--text);">${etaText}</b> &middot; ${pax} passenger${pax === 1 ? "" : "s"}
          </div>
          ${run.busCompany ? `<div class="bus-detail-meta" style="margin-top:4px; font-size:13px;">\u{1F68C} ${esc(run.busCompany)}</div>` : ""}`;
        wrap.appendChild(card);
      });
      return wrap;
    }

    const heading = document.createElement("h2");
    heading.textContent = "Courtesy Flow \u2014 by destination";
    wrap.appendChild(heading);
    const sub = document.createElement("p");
    sub.className = "subtitle";
    sub.textContent = "Pick a destination to see every inbound bus and its ETA.";
    wrap.appendChild(sub);

    if (!destKeys.length) {
      wrap.innerHTML += `<div class="empty-state"><div class="big">\u{1F3E8}</div>No runs with a destination set yet.</div>`;
      return wrap;
    }

    destKeys.forEach(key => {
      const g = groups[key];
      const activeBuses = g.entries.filter(e => e.bus.status !== "Completed");
      const nextEta = activeBuses
        .filter(e => e.bus.status === "In Route" && e.bus.eta)
        .map(e => e.bus.eta)
        .sort((a, b) => a - b)[0];
      const card = document.createElement("div");
      card.className = "card";
      const btn = document.createElement("button");
      btn.className = "list-btn";
      btn.innerHTML = `<div class="run-row"><div><div class="run-id">${esc(g.label)}</div>
          <div class="run-desc">${g.entries.length} bus${g.entries.length === 1 ? "" : "es"} total \u00b7 ${activeBuses.length} inbound</div></div>
          <div class="chev">\u203A</div></div>
        ${nextEta ? `<div class="bus-detail-meta" style="margin-top:8px;">Next arrival: <b style="color:var(--accent);">${new Date(nextEta).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}</b></div>` : ""}`;
      btn.onclick = () => { state.courtesySelectedDestination = key; render(); };
      card.appendChild(btn);
      wrap.appendChild(card);
    });

    return wrap;
  }

  function buildHelpdeskSearchTab(runs, roster) {
    const wrap = document.createElement("div");
    const heading = document.createElement("h2");
    heading.textContent = "Look someone up";
    wrap.appendChild(heading);

    const modeBar = document.createElement("div");
    modeBar.className = "tab-bar"; modeBar.style.marginBottom = "14px";
    const modes = [
      { id: "passenger", label: "Passenger" },
      { id: "guide", label: "Bus Guide" },
      { id: "runid", label: "Run ID" },
    ];
    modes.forEach(m => {
      const btn = document.createElement("button");
      btn.className = "tab-btn" + (state.helpdeskSearchMode === m.id ? " active" : "");
      btn.textContent = m.label;
      btn.onclick = () => { state.helpdeskSearchMode = m.id; state.helpdeskSearchQuery = ""; render(); };
      modeBar.appendChild(btn);
    });
    wrap.appendChild(modeBar);

    const placeholders = {
      passenger: "Passenger name\u2026",
      guide: "Bus guide name\u2026",
      runid: "Run ID, e.g. RUN-001\u2026",
    };
    const searchInput = document.createElement("input");
    searchInput.type = "text";
    searchInput.placeholder = placeholders[state.helpdeskSearchMode];
    searchInput.value = state.helpdeskSearchQuery;
    searchInput.autofocus = true;
    wrap.appendChild(searchInput);

    const results = document.createElement("div");
    results.style.marginTop = "14px";
    wrap.appendChild(results);

    function renderPassengerResults(q) {
      const matches = [];
      runs.forEach(run => {
        run.manifest.forEach(p => {
          if (p.name.toLowerCase().includes(q)) matches.push({ run, person: p });
        });
      });
      if (!matches.length) { results.innerHTML = `<div class="empty-state" style="padding:20px 0;">No passenger matches.</div>`; return; }
      matches.slice(0, 30).forEach(({ run, person }) => {
        const bus = person.boarded ? run.buses.find(b => b.num === person.busNum) : null;
        const guide = bus && bus.guideName ? roster.find(g => g.name === bus.guideName) : null;
        const card = document.createElement("div"); card.className = "card";
        card.innerHTML = `<div class="run-row"><b style="font-size:14.5px;">${esc(person.name)}</b>
            <span class="run-id" style="font-size:12px;">${esc(run.runId)}</span></div>
          <div class="bus-detail-meta" style="margin-top:4px;">
            ${person.boarded
              ? `Boarded &middot; Bus ${person.busNum}${bus && bus.guideName ? " &middot; Guide: " + esc(bus.guideName) : ""}`
              : "Not yet boarded &middot; " + esc(run.description || run.runId)}
          </div>
          ${bus && bus.guideName ? `<div class="bus-detail-meta" style="margin-top:6px;">${contactLinksHtml(guide)}</div>` : ""}`;
        results.appendChild(card);
      });
    }

    function renderGuideResults(q) {
      const matches = roster.filter(g => g.name.toLowerCase().includes(q));
      if (!matches.length) { results.innerHTML = `<div class="empty-state" style="padding:20px 0;">No guide matches.</div>`; return; }
      matches.slice(0, 30).forEach(g => {
        const assignments = [];
        runs.forEach(run => {
          run.buses.forEach(b => {
            if (b.guideName === g.name) assignments.push({ run, bus: b });
          });
        });
        const card = document.createElement("div"); card.className = "card";
        card.innerHTML = `<div class="run-row"><b style="font-size:14.5px;">${esc(g.name)}</b></div>
          <div class="bus-detail-meta" style="margin-top:4px;">${contactLinksHtml(g)}</div>`;
        if (assignments.length) {
          assignments.forEach(({ run, bus }) => {
            const etaText = bus.eta ? new Date(bus.eta).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "\u2014";
            const row = document.createElement("div");
            row.style.cssText = "margin-top:8px; padding-top:8px; border-top:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; gap:8px;";
            row.innerHTML = `<span style="font-size:13px;">${esc(run.runId)} \u00b7 Bus ${bus.num} \u00b7 ETA ${etaText}</span>
              <span class="status-pill ${STATUS_CLASS(bus.status)}"><span class="sdot"></span>${bus.status}</span>`;
            card.appendChild(row);
          });
        } else {
          const none = document.createElement("div");
          none.style.cssText = "margin-top:8px; font-size:12.5px; color:var(--text-dim);";
          none.textContent = "Not currently checked into any bus.";
          card.appendChild(none);
        }
        results.appendChild(card);
      });
    }

    function renderRunIdResults(q) {
      const matches = runs.filter(r => r.runId.toLowerCase().includes(q));
      if (!matches.length) { results.innerHTML = `<div class="empty-state" style="padding:20px 0;">No Run ID matches.</div>`; return; }
      matches.slice(0, 20).forEach(run => {
        const agg = aggregateStatus(run);
        const card = document.createElement("div"); card.className = "card";
        card.innerHTML = `<div class="run-row">
            <div><div class="run-id">${esc(run.runId)}</div><div class="run-desc">${esc(run.description || "")}</div>${run.busCompany ? `<div style="font-size:11.5px; color:var(--text-dim); margin-top:2px;">\u{1F68C} ${esc(run.busCompany)}</div>` : ""}</div>
            <span class="status-pill ${STATUS_CLASS(agg)}"><span class="sdot"></span>${agg}</span>
          </div>`;
        run.buses.forEach(bus => {
          const etaText = bus.eta ? new Date(bus.eta).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "\u2014";
          const row = document.createElement("div");
          row.style.cssText = "margin-top:8px; padding-top:8px; border-top:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; gap:8px;";
          row.innerHTML = `<span style="font-size:13px;">Bus ${bus.num} \u00b7 ${bus.guideName ? esc(bus.guideName) : "No guide"} \u00b7 ETA ${etaText}</span>
            <span class="status-pill ${STATUS_CLASS(bus.status)}"><span class="sdot"></span>${bus.status}</span>`;
          card.appendChild(row);
        });
        results.appendChild(card);
      });
    }

    function renderResults() {
      const q = state.helpdeskSearchQuery.trim().toLowerCase();
      results.innerHTML = "";
      if (!q) return;
      if (state.helpdeskSearchMode === "passenger") renderPassengerResults(q);
      else if (state.helpdeskSearchMode === "guide") renderGuideResults(q);
      else renderRunIdResults(q);
    }
    searchInput.oninput = e => { state.helpdeskSearchQuery = e.target.value; renderResults(); };
    renderResults();
    return wrap;
  }

  async function handleExcelImport(file) {
    const buf = await file.arrayBuffer();
    const workbook = XLSX.read(buf, { type: "array" });
    const runsSheetName = workbook.SheetNames.find(n => n.trim().toLowerCase() === "runs");
    const manifestSheetName = workbook.SheetNames.find(n => n.trim().toLowerCase() === "manifest");
    if (!runsSheetName) { showToast('No "Runs" tab found \u2014 check against the template'); return; }

    const runsRows = XLSX.utils.sheet_to_json(workbook.Sheets[runsSheetName], { defval: "" });
    const manifestRows = manifestSheetName ? XLSX.utils.sheet_to_json(workbook.Sheets[manifestSheetName], { defval: "" }) : [];
    const roster = await loadRoster();

    const manifestByRun = {};
    manifestRows.forEach(row => {
      const rid = String(row["Run ID"] || "").trim();
      const name = String(row["Passenger Name"] || row["Name"] || "").trim();
      if (!rid || !name) return;
      if (!manifestByRun[rid]) manifestByRun[rid] = [];
      manifestByRun[rid].push(name);
    });

    let created = 0, skipped = 0, unmatchedGuides = new Set();
    for (const row of runsRows) {
      const runId = String(row["Run ID"] || "").trim();
      if (!runId) continue;
      if (state.runIndex.some(r => r.runId === runId)) { skipped++; continue; }
      const numBuses = Math.max(1, Math.min(8, parseInt(row["Number of Buses"], 10) || 1));
      const names = manifestByRun[runId] || [];
      const manifest = names.map((name, i) => ({ id: runId + "-" + i, name, boarded: false, busNum: null, boardedAt: null }));
      const buses = Array.from({ length: numBuses }, (_, i) => {
        const raw = String(row["Bus " + (i + 1) + " Guide"] || "").trim();
        let guideName = "";
        if (raw) {
          const match = roster.find(g => g.name.toLowerCase() === raw.toLowerCase());
          if (match) guideName = match.name;
          else unmatchedGuides.add(raw);
        }
        return {
          num: i + 1, status: "Not Started", guideName, stagingAt: null, departedAt: null, completedAt: null,
          eta: null, etaUpdatedAt: null, loc: null, cateringLoaded: false, cateringLoadedAt: null,
          guideArrived: false, guideArrivedAt: null, busArrived: false, busArrivedAt: null, teamInPlace: false, teamInPlaceAt: null,
        };
      });
      const cateringVal = String(row["Catering (Yes/No)"] || row["Catering"] || "").trim().toLowerCase();
      const companyRaw = String(row["Bus Company"] || "").trim();
      const companyMatch = BUS_COMPANIES.find(c => c.toLowerCase() === companyRaw.toLowerCase());
      const run = {
        runId, description: String(row["Description"] || "").trim(),
        origin: String(row["Origin"] || "").trim(), destination: String(row["Destination"] || "").trim(),
        stagingLocation: String(row["Staging Location"] || "").trim(),
        busCompany: companyMatch || companyRaw,
        catering: ["yes", "y", "true"].includes(cateringVal),
        cateringDetails: String(row["Catering Details"] || "").trim(),
        notes: String(row["Notes"] || "").trim(),
        numBuses, buses, manifest, createdAt: Date.now(),
      };
      await saveRun(run);
      state.runIndex.push({ runId, description: run.description, numBuses, createdAt: run.createdAt, assignedGuides: computeAssignedGuides(buses) });
      created++;
    }
    await setJSON("run-index", state.runIndex);
    showToast(
      created + " run(s) imported" +
      (skipped ? ", " + skipped + " skipped (duplicate ID)" : "") +
      (unmatchedGuides.size ? ", " + unmatchedGuides.size + " guide name(s) not found in roster" : "")
    );
    state.coordTab = "dashboard";
    go("coord-home");
  }

  async function handleGuideExcelImport(file) {
    const buf = await file.arrayBuffer();
    const workbook = XLSX.read(buf, { type: "array" });
    const sheetName = workbook.SheetNames.find(n => n.trim().toLowerCase() === "guides") || workbook.SheetNames[0];
    const rows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { defval: "" });

    const roster = await loadRoster();
    let added = 0, updated = 0;
    rows.forEach(row => {
      const name = String(row["Name"] || "").trim();
      if (!name) return;
      const phone = String(row["Phone"] || "").trim();
      const email = String(row["Email"] || "").trim();
      let pin = String(row["PIN (optional)"] || row["PIN"] || "").trim();
      if (pin && !/^\d{4}$/.test(pin)) pin = "";
      if (pin && roster.some(g => g.pin === pin)) pin = "";
      const existingIdx = roster.findIndex(g => g.name.toLowerCase() === name.toLowerCase());
      if (existingIdx >= 0) {
        roster[existingIdx].phone = phone;
        roster[existingIdx].email = email;
        if (pin) roster[existingIdx].pin = pin;
        updated++;
      } else {
        if (!pin) pin = genPin(roster);
        roster.push({ name, phone, email, pin, lastRunId: null, lastBusNum: null });
        added++;
      }
    });
    await saveRoster(roster);
    state.roster = roster;
    showToast(added + " guide(s) added" + (updated ? ", " + updated + " updated" : ""));
  }

    copyBtn.className = "btn btn-secondary"; copyBtn.style.marginTop = "10px"; copyBtn.textContent = "Copy row for pasting into Excel";
    copyBtn.onclick = async () => {
      const r = buildExportRow(state.currentRun);
      try { await navigator.clipboard.writeText(r.row.join("\t")); showToast("Copied \u2014 paste into Excel"); }
      catch (e) { showToast("Copy not available \u2014 select text manually"); }
    };
    screen.appendChild(copyBtn);

    const deleteBtn = document.createElement("button");
    deleteBtn.className = "btn btn-danger"; deleteBtn.style.marginTop = "24px"; deleteBtn.textContent = "Delete this run";
    deleteBtn.onclick = async () => {
      if (!confirm("Delete " + run.runId + "? This can't be undone.")) return;
      state.runIndex = state.runIndex.filter(r => r.runId !== run.runId);
      await setJSON("run-index", state.runIndex);
      await deleteKey("run-" + run.runId);
      destroyMap(); go("coord-home");
    };
    screen.appendChild(deleteBtn);
    c.appendChild(screen);

    function buildExportRow(r) {
      const headers = ["Run ID", "Status", "Origin", "Destination", "Bus Company", "Catering (Y/N)"];
      for (let i = 1; i <= r.numBuses; i++) headers.push("Bus Guide " + i);
      for (let i = 1; i <= r.numBuses; i++) headers.push("Passengers - Bus " + i);
      headers.push("Total Passengers");
      const row = [r.runId, aggregateStatus(r), r.origin || "", r.destination || "", r.busCompany || "", r.catering ? "Yes" : "No"];
      for (let i = 1; i <= r.numBuses; i++) row.push(r.buses.find(b => b.num === i).guideName || "");
      for (let i = 1; i <= r.numBuses; i++) row.push(String(busBoardedCount(r, i)));
      row.push(String(totalBoarded(r)));
      return { headers, row };
    }

    function updateLiveParts() {
      const r = state.currentRun;
      const boarded = totalBoarded(r);
      const total = r.manifest.length;
      statsHolder.innerHTML = `<div class="stat-strip">
          <div class="stat-box"><div class="num">${boarded}</div><div class="lbl">Boarded</div></div>
          <div class="stat-box"><div class="num">${total}</div><div class="lbl">Manifest</div></div>
          <div class="stat-box"><div class="num">${total - boarded}</div><div class="lbl">Remaining</div></div>
        </div>`;
      busCardHolder.innerHTML = "";
      const busCard = document.createElement("div"); busCard.className = "card";
      r.buses.forEach(b => {
        const cnt = busBoardedCount(r, b.num);
        const etaText = b.eta ? new Date(b.eta).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) + " (upd " + timeAgo(b.etaUpdatedAt) + ")" : "\u2014";
        const cateringText = r.catering ? (b.cateringLoaded ? "Catering loaded" : "Catering not loaded yet") : "";
        const checklist = getChecklistItems(r);
        const checklistDone = checklist.filter(it => b[it.key]).length;
        const checklistComplete = checklistDone === checklist.length;
        const rowBtn = document.createElement("button");
        rowBtn.className = "list-btn bus-detail-row";
        rowBtn.innerHTML = `<div class="bus-detail-left"><div class="bus-detail-num">B${b.num}</div>
            <div><span class="status-pill ${STATUS_CLASS(b.status)}"><span class="sdot"></span>${b.status}</span>
            <span class="status-pill" style="margin-left:6px; background:${checklistComplete ? "var(--green-dim)" : "var(--panel-alt)"}; color:${checklistComplete ? "var(--green)" : "var(--text-dim)"};"><span class="sdot" style="background:${checklistComplete ? "var(--green)" : "var(--text-dim)"};"></span>Checklist ${checklistDone}/${checklist.length}</span>
            <div class="bus-detail-meta">${b.guideName ? esc(b.guideName) : "No guide checked in yet"} \u00b7 ETA ${etaText}${cateringText ? " \u00b7 " + cateringText : ""}</div></div></div>
          <div class="bus-detail-count">${cnt} pax <span class="chev">\u203A</span></div>`;
        rowBtn.onclick = () => { stopPolling(); destroyMap(); state.currentBusNum = b.num; go("coord-bus-detail"); };
        busCard.appendChild(rowBtn);
      });
      busCardHolder.appendChild(busCard);
      const { headers, row } = buildExportRow(r);
      csvHolder.innerHTML = "";
      const csvBox = document.createElement("div"); csvBox.className = "csv-box";
      csvBox.textContent = headers.join("\t") + "\n" + row.join("\t");
      csvHolder.appendChild(csvBox);
      updateMap(r);
    }
    updateLiveParts();
    startPolling(async () => {
      if (state.view !== "coord-run-detail") return;
      const fresh = await loadRun(run.runId);
      if (fresh) { state.currentRun = fresh; updateLiveParts(); }
    }, 60000);
    return c;
  }

  // ---------- Coordinator: single-bus detail (contact + passenger list) ----------
  function renderCoordBusDetail() {
    const run = state.currentRun;
    const busNum = state.currentBusNum;
    const c = document.createElement("div");
    c.appendChild(topbar(run.runId + " \u00b7 Bus " + busNum, () => {
      go("coord-run-detail");
      startPolling(async () => {
        if (state.view !== "coord-run-detail") return;
        const fresh = await loadRun(run.runId);
        if (fresh) { state.currentRun = fresh; }
      }, 60000);
    }));
    const screen = document.createElement("div");
    screen.className = "screen";
    const bodyHolder = document.createElement("div");
    screen.appendChild(bodyHolder);
    c.appendChild(screen);

    async function renderBody() {
      const bus = state.currentRun.buses.find(b => b.num === busNum);
      const roster = await loadRoster();
      const guide = bus.guideName ? roster.find(g => g.name === bus.guideName) : null;
      const riders = state.currentRun.manifest.filter(p => p.boarded && p.busNum === busNum);

      bodyHolder.innerHTML = "";
      const statusRow = document.createElement("div");
      statusRow.style.marginBottom = "14px";
      statusRow.innerHTML = `<span class="status-pill ${STATUS_CLASS(bus.status)}"><span class="sdot"></span>${bus.status}</span>`;
      bodyHolder.appendChild(statusRow);

      const contactCard = document.createElement("div");
      contactCard.className = "card";
      if (!bus.guideName) {
        contactCard.innerHTML = `<div class="empty-state" style="padding:10px 0;">No guide has checked into this bus yet.</div>`;
      } else {
        const phone = guide && guide.phone ? guide.phone : "";
        const email = guide && guide.email ? guide.email : "";
        contactCard.innerHTML = `
          <div class="overview-row" style="padding-top:0;">
            <div class="overview-label">Bus guide</div>
            <div class="overview-value">${esc(bus.guideName)}</div>
          </div>
          <div class="overview-row">
            <div class="overview-label">Phone</div>
            <div class="overview-value">${phone ? `<a href="tel:${esc(phone.replace(/[^+\d]/g, ""))}" style="color:var(--brand); text-decoration:none;">\u{1F4DE} ${esc(phone)}</a>` : "\u2014 not on file"}</div>
          </div>
          <div class="overview-row" style="border-bottom:none; padding-bottom:0;">
            <div class="overview-label">Email</div>
            <div class="overview-value">${email ? `<a href="mailto:${esc(email)}" style="color:var(--brand); text-decoration:none;">\u2709\uFE0F ${esc(email)}</a>` : "\u2014 not on file"}</div>
          </div>`;
      }
      bodyHolder.appendChild(contactCard);

      const checklistHeading = document.createElement("h3");
      checklistHeading.textContent = "Pre-run checklist";
      bodyHolder.appendChild(checklistHeading);
      const checklistCard = document.createElement("div");
      checklistCard.className = "card";
      const coordChecklistItems = getChecklistItems(run);
      coordChecklistItems.forEach((item, i) => {
        const done = !!bus[item.key];
        const row = document.createElement("div");
        row.className = "bus-detail-row";
        if (i === coordChecklistItems.length - 1) row.style.borderBottom = "none";
        row.innerHTML = `<div class="bus-detail-left"><div class="checkbox" style="${done ? 'background:var(--green); border-color:var(--green); color:#08201a;' : ''}">${done ? "\u2713" : ""}</div>
            <span style="font-size:13.5px; color:${done ? "var(--text)" : "var(--text-dim)"};">${esc(item.short)}</span></div>
          <span style="font-size:11px; color:var(--text-dim); font-family:var(--mono);">${done ? timeAgo(bus[item.key + "At"]) : "pending"}</span>`;
        checklistCard.appendChild(row);
      });
      bodyHolder.appendChild(checklistCard);

      const reassignCard = document.createElement("div");
      reassignCard.className = "card";
      const reassignLabel = document.createElement("label");
      reassignLabel.textContent = "Reassign this bus";
      reassignLabel.style.margin = "0 0 6px";
      reassignCard.appendChild(reassignLabel);
      const select = document.createElement("select");
      const noneOpt = document.createElement("option");
      noneOpt.value = ""; noneOpt.textContent = "\u2014 No guide assigned \u2014";
      select.appendChild(noneOpt);
      roster.forEach(g => {
        const opt = document.createElement("option");
        opt.value = g.name; opt.textContent = g.name;
        if (g.name === bus.guideName) opt.selected = true;
        select.appendChild(opt);
      });
      reassignCard.appendChild(select);
      const reassignBtn = document.createElement("button");
      reassignBtn.className = "btn btn-secondary"; reassignBtn.style.marginTop = "10px"; reassignBtn.textContent = "Save reassignment";
      reassignBtn.onclick = async () => {
        const fresh = await loadRun(run.runId);
        const freshBus = fresh.buses.find(b => b.num === busNum);
        const oldGuideName = freshBus.guideName;
        freshBus.guideName = select.value;
        await saveRun(fresh);
        await updateRunIndexEntry(run.runId, { assignedGuides: computeAssignedGuides(fresh.buses) });
        if (oldGuideName && oldGuideName !== select.value) {
          const rosterList = await loadRoster();
          const oldGuide = rosterList.find(g => g.name === oldGuideName);
          if (oldGuide && oldGuide.lastRunId === run.runId && oldGuide.lastBusNum === busNum) {
            oldGuide.lastRunId = null; oldGuide.lastBusNum = null;
            await saveRoster(rosterList);
          }
        }
        state.currentRun = fresh;
        showToast(select.value ? "Bus " + busNum + " reassigned to " + select.value : "Guide removed from Bus " + busNum);
        renderBody();
      };
      reassignCard.appendChild(reassignBtn);
      bodyHolder.appendChild(reassignCard);

      const ridersHeading = document.createElement("h3");
      ridersHeading.textContent = "On this bus (" + riders.length + ")";
      bodyHolder.appendChild(ridersHeading);

      if (!riders.length) {
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.innerHTML = `<div class="big">\u{1F6CB}\uFE0F</div>Nobody's boarded this bus yet.`;
        bodyHolder.appendChild(empty);
      } else {
        const list = document.createElement("div");
        list.className = "pax-list";
        riders
          .slice()
          .sort((a, b) => (a.boardedAt || 0) - (b.boardedAt || 0))
          .forEach(p => {
            const row = document.createElement("div");
            row.className = "pax-row boarded-mine";
            row.style.cursor = "default";
            row.innerHTML = `<div class="checkbox">\u2713</div><div class="pax-name">${esc(p.name)}</div>
              <div class="pax-tag">${p.boardedAt ? timeAgo(p.boardedAt) : ""}</div>`;
            list.appendChild(row);
          });
        bodyHolder.appendChild(list);
      }
    }
    renderBody();
    startPolling(async () => {
      if (state.view !== "coord-bus-detail") return;
      const fresh = await loadRun(run.runId);
      if (fresh) { state.currentRun = fresh; renderBody(); }
    }, 60000);
    return c;
  }

  function updateMap(run) {
    if (typeof L === "undefined") return;
    const withLoc = run.buses.filter(b => b.loc);
    if (!mapInstance) {
      const el = document.getElementById("live-map");
      if (!el) return;
      mapInstance = L.map(el, { attributionControl: false }).setView([39.5, -98.35], 4);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 18 }).addTo(mapInstance);
      mapMarkers = {};
    }
    withLoc.forEach(b => {
      const popupHtml = `<b>Bus ${b.num}</b><br/>${esc(b.guideName || "")}<br/>Updated ${timeAgo(b.loc.at)}`;
      if (mapMarkers[b.num]) { mapMarkers[b.num].setLatLng([b.loc.lat, b.loc.lng]); mapMarkers[b.num].setPopupContent(popupHtml); }
      else { mapMarkers[b.num] = L.marker([b.loc.lat, b.loc.lng]).addTo(mapInstance).bindPopup(popupHtml); }
    });
    if (withLoc.length) {
      const bounds = withLoc.map(b => [b.loc.lat, b.loc.lng]);
      if (bounds.length === 1) mapInstance.setView(bounds[0], 13);
      else mapInstance.fitBounds(bounds, { padding: [30, 30] });
    }
  }
  function destroyMap() { if (mapInstance) { mapInstance.remove(); mapInstance = null; mapMarkers = {}; } }

  // ---------- Coordinator: settings ----------
  function esc(s) {
    return String(s).replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
  }

  function storageBridgeMissing() {
    return typeof fbDb === "undefined" || !FIREBASE_CONFIG || FIREBASE_CONFIG.apiKey === "PASTE_YOUR_API_KEY_HERE";
  }

  function renderStorageWarning() {
    const root = document.getElementById("app-root");
    root.innerHTML = "";
    const screen = document.createElement("div");
    screen.className = "screen";
    screen.style.paddingTop = "60px";
    screen.innerHTML = `
      <div style="font-family: var(--mono); font-size: 11px; letter-spacing: .1em; color: var(--red); text-transform: uppercase; margin-bottom: 14px;">App can't save right now</div>
      <h1 style="color: var(--red);">Firebase isn't configured yet</h1>
      <p class="subtitle" style="margin-bottom: 8px;">This app saves data using Firebase, but the FIREBASE_CONFIG block near the top of index.html still has placeholder values.</p>
      <p class="subtitle" style="margin-bottom: 24px;">Follow Part 1 of the setup guide: create a Firebase project, copy your config, and paste it into index.html in place of the "PASTE_YOUR..." placeholders. Then reload this page.</p>
      <button class="btn btn-secondary" id="retry-storage-btn">I've updated the config \u2014 try again</button>
    `;
    root.appendChild(screen);
    document.getElementById("retry-storage-btn").onclick = () => {
      if (storageBridgeMissing()) { renderStorageWarning(); }
      else { render(); }
    };
  }

  if (storageBridgeMissing()) {
    renderStorageWarning();
  } else {
    render();
  }
})();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch((e) => console.warn("SW registration failed", e));
  });
}
</script>
